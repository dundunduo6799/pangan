<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>盘感训练营 · A股交易学习与盘感训练</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<style>
:root{
  --bg:#0b0e13; --surface:#12161c; --surface2:#1a2029; --surface3:#222a35;
  --border:#232b36; --border2:#2e3947;
  --text:#e8edf4; --text2:#9aa7b6; --muted:#6b7686;
  --up:#f0524f; --up-bg:rgba(240,82,79,.12); --down:#33b077; --down-bg:rgba(51,176,119,.12);
  --warn:#ffb224; --warn-bg:rgba(255,178,36,.12);
  --info:#519bff; --info-bg:rgba(81,155,255,.12);
  --gold:#e8b339; --gold-bg:rgba(232,179,57,.12);
  --purple:#b58cff; --purple-bg:rgba(181,140,255,.12);
  --radius:12px; --radius-s:8px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
html[data-theme="light"]{
  --bg:#f4f6fa; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e2e7ef;
  --border:#dde3ec; --border2:#c9d2df;
  --text:#1a2230; --text2:#4d5a6d; --muted:#8593a6;
  --up:#e03e3b; --up-bg:rgba(224,62,59,.10); --down:#149a66; --down-bg:rgba(20,154,102,.10);
  --warn-bg:rgba(255,178,36,.16); --info-bg:rgba(81,155,255,.14); --gold-bg:rgba(232,179,57,.18);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.55;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.up{color:var(--up)} .down{color:var(--down)}
.warn{color:var(--warn)} .info{color:var(--info)} .gold{color:var(--gold)} .purple{color:var(--purple)}
.muted{color:var(--muted)} .t2{color:var(--text2)} .bold{font-weight:600}
img{max-width:100%}

/* ============ 布局骨架 ============ */
#app{max-width:1080px;margin:0 auto;padding:0 14px 20px}
header.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  margin:0 -14px;padding:10px 14px 0}
.topbar-row{display:flex;align-items:center;gap:8px;max-width:1052px}
.logo{font-size:1.02rem;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.logo .dot{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.status{font-size:.66rem;padding:2px 8px;border-radius:20px;border:1px solid var(--border2);color:var(--text2);white-space:nowrap}
.status.live{color:var(--down);border-color:rgba(51,176,119,.4)}
.status.err{color:var(--warn);border-color:rgba(255,178,36,.4)}
.topbar .btn-ico{margin-left:auto;background:var(--surface2);border:1px solid var(--border2);color:var(--text2);
  padding:4px 11px;border-radius:20px;font-size:.75rem;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap}
.topbar .btn-ico:active{transform:scale(.96)}

/* 导航：桌面顶部 / 手机底部 */
nav.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 13px;font-size:.85rem;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;
  white-space:nowrap;user-select:none;display:flex;align-items:center;gap:4px}
.tab.on{color:var(--text);border-bottom-color:var(--up);font-weight:600}
@media (max-width:760px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;margin:0;background:var(--surface);
    border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom));justify-content:space-around}
  .tab{flex:1;flex-direction:column;gap:1px;padding:4px 0;font-size:.6rem;border-bottom:none;color:var(--muted)}
  .tab .t-ico{font-size:1.15rem;line-height:1.2}
  .tab.on{color:var(--up)}
}
@media (min-width:761px){ .tab .t-ico{display:none} }

.page{display:none;padding-top:12px;animation:fadein .18s ease}
.page.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 子标签 */
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.subtabs::-webkit-scrollbar{display:none}
.subtab{padding:6px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);
  font-size:.8rem;color:var(--text2);cursor:pointer;white-space:nowrap}
.subtab.on{background:var(--up-bg);color:var(--up);border-color:rgba(240,82,79,.4);font-weight:600}

/* ============ 卡片与通用组件 ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:12px}
.card.clickable{cursor:pointer;transition:transform .08s}
.card.clickable:active{transform:scale(.985)}
.card h3{font-size:.95rem;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){ .grid3{grid-template-columns:1fr 1fr} }
.stat{background:var(--surface2);border-radius:var(--radius-s);padding:10px;text-align:center}
.stat .v{font-size:1.15rem;font-weight:700}
.stat .k{font-size:.68rem;color:var(--muted);margin-top:2px}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.68rem;border:1px solid var(--border2);color:var(--text2);white-space:nowrap}
.chip.up{background:var(--up-bg);color:var(--up);border-color:rgba(240,82,79,.35)}
.chip.down{background:var(--down-bg);color:var(--down);border-color:rgba(51,176,119,.35)}
.chip.gold{background:var(--gold-bg);color:var(--gold);border-color:rgba(232,179,57,.35)}
.chip.info{background:var(--info-bg);color:var(--info);border-color:rgba(81,155,255,.35)}
.chip.purple{background:var(--purple-bg);color:var(--purple);border-color:rgba(181,140,255,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--up);color:#fff;border:none;
  padding:9px 20px;border-radius:22px;font-size:.88rem;font-weight:600;cursor:pointer;user-select:none}
.btn:active{transform:scale(.97)}
.btn.gray{background:var(--surface2);color:var(--text2);border:1px solid var(--border2)}
.btn.green{background:var(--down)}
.btn.blue{background:var(--info)}
.btn.small{padding:5px 14px;font-size:.76rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar-track{height:7px;background:var(--surface3);border-radius:5px;overflow:hidden;flex:1}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--up),var(--gold));border-radius:5px;transition:width .3s}
.bar-fill.green{background:linear-gradient(90deg,var(--down),#7bd8a8)}

/* 进度环 */
.ring{transform:rotate(-90deg)}
.ring .bg{stroke:var(--surface3);fill:none}
.ring .fg{stroke:var(--up);fill:none;stroke-linecap:round;transition:stroke-dashoffset .4s}

/* ============ 表单 ============ */
input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);
  padding:9px 12px;border-radius:var(--radius-s);font-size:.9rem;outline:none;font-family:var(--font)}
input:focus,select:focus,textarea:focus{border-color:var(--info)}
label.f{display:block;font-size:.75rem;color:var(--text2);margin:10px 0 4px}
textarea{resize:vertical;min-height:70px}
.seg{display:flex;background:var(--surface2);border-radius:var(--radius-s);overflow:hidden;border:1px solid var(--border2)}
.seg button{flex:1;background:none;border:none;color:var(--text2);padding:8px 4px;font-size:.82rem;cursor:pointer;font-family:var(--font)}
.seg button.on{background:var(--up-bg);color:var(--up);font-weight:600}

/* ============ 答题 ============ */
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.q-tag{font-size:.66rem;color:var(--muted);margin-bottom:6px}
.q-stem{font-size:.95rem;font-weight:600;line-height:1.6;margin-bottom:12px}
.opt{display:flex;align-items:flex-start;gap:9px;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:var(--radius-s);padding:11px 12px;margin-bottom:8px;cursor:pointer;font-size:.88rem;line-height:1.5;transition:border-color .12s}
.opt:active{transform:scale(.99)}
.opt .oidx{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--surface3);display:flex;
  align-items:center;justify-content:center;font-size:.72rem;color:var(--text2);font-weight:600}
.opt.sel{border-color:var(--info);background:var(--info-bg)}
.opt.right{border-color:var(--down);background:var(--down-bg)}
.opt.right .oidx{background:var(--down);color:#fff}
.opt.wrong{border-color:var(--up);background:var(--up-bg)}
.opt.wrong .oidx{background:var(--up);color:#fff}
.q-explain{margin-top:10px;background:var(--gold-bg);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;
  padding:10px 12px;font-size:.82rem;line-height:1.65;color:var(--text)}
/* 看图题：选项图形对照 */
.opt-charts{margin-top:10px;border-top:1px dashed rgba(0,0,0,.15);padding-top:8px}
html[data-theme="dark"] .opt-charts{border-top-color:var(--border2)}
.oc-t{font-size:.7rem;color:var(--muted);margin-bottom:7px;font-weight:600}
.oc-row{display:flex;gap:9px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius-s);padding:8px 10px;margin-bottom:8px}
.oc-row.oc-right{border-color:var(--down);background:var(--down-bg)}
.oc-row.oc-wrong{border-color:var(--up);background:var(--up-bg)}
.oc-row .oidx{flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--surface3);display:flex;
  align-items:center;justify-content:center;font-size:.68rem;color:var(--text2);font-weight:600;margin-top:1px}
.oc-row.oc-right .oidx{background:var(--down);color:#fff}
.oc-row.oc-wrong .oidx{background:var(--up);color:#fff}
.oc-main{flex:1;min-width:0}
.oc-name{font-size:.8rem;font-weight:600}
.oc-d{font-size:.7rem;color:var(--text2);line-height:1.6;margin-top:5px}
.q-actions{display:flex;gap:10px;margin-top:14px}
.judge-row{display:flex;gap:10px}
.judge-row .btn{flex:1}

/* 图题 */
.q-chart{background:var(--surface2);border-radius:var(--radius-s);padding:8px;margin-bottom:12px;text-align:center}
.q-chart canvas{max-width:100%;touch-action:none}

/* ============ 课程 ============ */
.lv-map{display:flex;flex-direction:column;gap:10px}
.lv-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:13px 14px;cursor:pointer}
.lv-item .lv-badge{flex-shrink:0;width:42px;height:42px;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:1.05rem;background:var(--surface2);border:1px solid var(--border2)}
.lv-item .lv-badge small{font-size:.58rem;color:var(--muted)}
.lv-item.done .lv-badge{background:var(--down-bg);border-color:rgba(51,176,119,.4)}
.lv-item.locked{opacity:.55}
.lv-item .lv-info{flex:1;min-width:0}
.lv-item .lv-info b{font-size:.9rem}
.lv-item .lv-info .t2{font-size:.72rem;margin-top:2px}
.lesson-body{font-size:.9rem;line-height:1.8}
.lesson-body p{margin-bottom:10px}
.lesson-body ul{margin:0 0 10px 18px}
.lesson-body li{margin-bottom:6px}
.lesson-body b{color:var(--gold)}
.lesson-body .demo-box{background:var(--surface2);border-radius:var(--radius-s);padding:10px;margin:8px 0;text-align:center}
/* 课件配图（25-figures） */
.lesson-figs{margin:12px 0 4px;display:flex;flex-direction:column;gap:12px}
.lesson-fig{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-s);
  padding:10px 10px 8px;text-align:center}
.lesson-fig canvas{max-width:100%}
.lesson-fig figcaption{font-size:.68rem;color:var(--muted);margin-top:4px;line-height:1.5}
.lesson-tip{margin-top:12px;background:var(--info-bg);border-left:3px solid var(--info);border-radius:0 8px 8px 0;
  padding:10px 12px;font-size:.82rem}
.callout{background:var(--up-bg);border-left:3px solid var(--up);border-radius:0 8px 8px 0;padding:10px 12px;font-size:.82rem;margin:8px 0}

/* ============ 图表 ============ */
.chart-wrap{position:relative;background:var(--surface2);border-radius:var(--radius-s);overflow:hidden;touch-action:none}
.chart-wrap canvas{display:block;width:100%;height:auto}
.chart-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ctg{padding:4px 10px;border-radius:14px;font-size:.7rem;background:var(--surface2);border:1px solid var(--border2);
  color:var(--text2);cursor:pointer;user-select:none}
.ctg.on{background:var(--info-bg);color:var(--info);border-color:rgba(81,155,255,.4)}
.chart-tip{position:absolute;pointer-events:none;background:rgba(10,13,18,.92);border:1px solid var(--border2);
  border-radius:8px;padding:6px 9px;font-size:.68rem;line-height:1.5;color:var(--text);z-index:5;display:none;max-width:230px}
html[data-theme="light"] .chart-tip{background:rgba(255,255,255,.95)}

/* ============ 情绪温度计 ============ */
.thermo{position:relative;height:14px;border-radius:8px;overflow:hidden;margin:10px 0;
  background:linear-gradient(90deg,#2b6cb0,#33b077,#e8b339,#f0524f)}
.thermo .pin{position:absolute;top:-4px;width:6px;height:22px;border-radius:3px;background:#fff;
  border:2px solid var(--text);box-shadow:0 0 6px rgba(0,0,0,.5);transition:left .5s;transform:translateX(-50%)}
.stage-big{font-size:1.5rem;font-weight:800;letter-spacing:2px}
.stage-ice{color:#519bff}.stage-warm{color:#33b077}.stage-hot{color:#f0524f}.stage-ebb{color:#9aa7b6}

/* ============ 日历（复盘日记） ============ */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .cal-h{font-size:.62rem;color:var(--muted);padding:3px 0}
.cal .cal-d{position:relative;font-size:.78rem;padding:6px 0;border-radius:8px;cursor:pointer;color:var(--text2)}
.cal .cal-d.has{background:var(--info-bg);color:var(--info);font-weight:600}
.cal .cal-d.today{border:1.5px solid var(--gold)}
.cal .cal-d.dim{opacity:.3;cursor:default}
.cal .cal-d .dot{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--gold)}

/* ============ 弹层 ============ */
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
  background:rgba(20,24,32,.95);color:#fff;border:1px solid var(--border2);padding:9px 18px;border-radius:22px;
  font-size:.82rem;z-index:200;opacity:0;pointer-events:none;transition:all .22s;max-width:82vw;text-align:center}
html[data-theme="light"] #toast{background:rgba(30,38,50,.95)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet-mask,.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-mask{align-items:center;padding:20px}
.sheet-mask.show,.modal-mask.show{display:flex}
.sheet{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:72vh;overflow-y:auto;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:slideup .22s ease}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:420px;max-height:82vh;overflow-y:auto;padding:20px;animation:fadein .18s ease}
@keyframes slideup{from{transform:translateY(40%)}to{transform:none}}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 12px}

/* 术语卡 */
.term-card h3{color:var(--gold)}
.term-card .sec{margin-top:10px}
.term-card .sec .k{font-size:.68rem;color:var(--muted);margin-bottom:2px}
.term-card .sec .v{font-size:.84rem;line-height:1.65}

/* ============ 训练场 ============ */
.train-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.train-mode{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;text-align:center}
.train-mode.on{border-color:var(--up);background:var(--up-bg)}
.train-mode .em{font-size:1.5rem}
.train-mode b{display:block;font-size:.85rem;margin:4px 0 2px}
.train-mode .t2{font-size:.68rem;line-height:1.4}
.conf-row{display:flex;gap:8px}
.conf-row .btn{flex:1}
.result-panel{background:var(--surface2);border-radius:var(--radius-s);padding:12px;margin-top:12px;font-size:.85rem;line-height:1.7}
.verdict{font-size:1.2rem;font-weight:800;margin-bottom:6px}

/* ============ 思路教练（24-coach） ============ */
.coach-card{border-color:rgba(232,179,57,.35)}
.coach-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.coach-head b{font-size:.9rem}
.coach-input{min-height:88px;margin-top:8px;font-size:.85rem;line-height:1.6}
.coach-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cchip{font-size:.7rem;padding:3px 10px;border-radius:20px;border:1px solid var(--border2);color:var(--text2);white-space:nowrap}
.cchip.hit{background:var(--down-bg);color:var(--down);border-color:rgba(51,176,119,.35)}
.cchip.miss{background:var(--warn-bg);color:var(--warn);border-color:rgba(255,178,36,.35)}
.cchip.nice{background:var(--info-bg);color:var(--info);border-color:rgba(81,155,255,.35)}
.coach-sec{margin-top:10px;font-size:.8rem;line-height:1.7}
.coach-sec .k{display:block;font-size:.66rem;color:var(--muted);margin-bottom:3px}
.coach-q{margin-top:10px;background:var(--info-bg);border-left:3px solid var(--info);border-radius:0 8px 8px 0;padding:9px 12px;font-size:.8rem;line-height:1.8}
.coach-review{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:13px;margin-top:12px;font-size:.8rem;line-height:1.7}
.cr-head{font-size:.9rem;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.cr-quote{margin:8px 0;background:var(--surface);border:1px dashed var(--border2);border-radius:var(--radius-s);padding:9px 11px}
.cr-quote .k{display:block;font-size:.66rem;color:var(--muted);margin-bottom:3px}
.cr-quote-body{font-size:.8rem;white-space:pre-wrap;word-break:break-word}
.cr-quote.miss{color:var(--text2)}
.cr-rows{margin:8px 0;border-top:1px solid var(--border)}
.cr-row{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:.78rem;line-height:1.6}
.cr-ico{flex-shrink:0;width:20px;text-align:center}
.cr-guide{margin-top:9px;font-size:.78rem;line-height:1.8}
.cr-model{margin-top:9px;font-size:.76rem}
.cr-model summary{cursor:pointer;color:var(--info);font-size:.74rem;user-select:none}
.cr-model pre{white-space:pre-wrap;font-family:var(--font);margin:6px 0 0;padding:9px 11px;background:var(--surface);border:1px dashed var(--border2);border-radius:8px;line-height:1.7}

/* ============ 图表标注层：画笔 + AI点读（23-markup） ============ */
.chart-wrap canvas.mark-layer{position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:3;touch-action:none}
.mark-tools{margin-top:8px;align-items:center;flex-wrap:wrap}
.mark-reads{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.mark-read{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-s);padding:9px 11px;font-size:.74rem;line-height:1.7}
.mark-read .mr-h{display:flex;align-items:center;gap:6px;margin-bottom:3px;font-size:.76rem}
.mark-bubble{position:absolute;z-index:6;background:rgba(10,13,18,.94);border:1px solid var(--gold);border-radius:8px;
  padding:7px 10px;font-size:.68rem;line-height:1.6;color:var(--text);max-width:240px;pointer-events:none}
html[data-theme="light"] .mark-bubble{background:rgba(255,255,255,.97)}

/* ============ 考试 ============ */
.exam-timer{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);
  padding:8px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.timer-num{font-size:1.15rem;font-weight:800;color:var(--warn);font-variant-numeric:tabular-nums}
.timer-num.hurry{color:var(--up);animation:pulse 1s infinite}
.anssheet{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.anssheet .cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;
  background:var(--surface2);font-size:.72rem;cursor:pointer;color:var(--text2);border:1px solid var(--border)}
.anssheet .cell.done{background:var(--info-bg);color:var(--info);border-color:rgba(81,155,255,.4)}
.anssheet .cell.cur{border-color:var(--gold);color:var(--gold)}
.exam-score{text-align:center;padding:18px 0}
.exam-score .big{font-size:3rem;font-weight:800}
.pass{color:var(--down)} .fail{color:var(--up)}

/* ============ 段位 ============ */
.rank-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border-radius:20px;font-weight:700;font-size:.9rem}
.rank-0{background:var(--surface2);color:var(--text2)}
.rank-1{background:rgba(176,137,104,.18);color:#c99b6a}
.rank-2{background:rgba(192,197,206,.16);color:#b8c0cc}
.rank-3{background:var(--gold-bg);color:var(--gold)}
.rank-4{background:var(--info-bg);color:var(--info)}
.rank-5{background:var(--purple-bg);color:var(--purple)}

/* ============ 雷达图 ============ */
.radar-box{display:flex;justify-content:center}

/* ============ 模拟盘 / 列表 ============ */
.list-item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--border);font-size:.85rem}
.list-item:last-child{border-bottom:none}
.list-item .li-main{flex:1;min-width:0}
.pos-tag{font-size:.64rem;padding:1px 7px;border-radius:10px;background:var(--surface2);border:1px solid var(--border2);color:var(--text2)}
table.tb{width:100%;border-collapse:collapse;font-size:.78rem}
table.tb th{text-align:left;color:var(--muted);font-weight:500;padding:6px 4px;border-bottom:1px solid var(--border)}
table.tb td{padding:7px 4px;border-bottom:1px solid var(--border)}
table.tb tr:last-child td{border-bottom:none}

/* ============ 离线条 / 免责 ============ */
#offlineBar{display:none;background:var(--warn-bg);border-bottom:1px solid rgba(255,178,36,.4);color:var(--warn);
  font-size:.74rem;padding:6px 14px;text-align:center;margin:0 -14px}
#offlineBar.show{display:block}
.disclaimer{font-size:.68rem;color:var(--muted);line-height:1.6;padding:10px 4px}
.field-err{border-color:var(--up)!important;background:var(--up-bg)!important}

/* ============ 引导 ============ */
.onboard-step{display:none}
.onboard-step.on{display:block;text-align:center}
.onboard-step .em{font-size:3rem;margin:10px 0}
.onboard-step h2{font-size:1.15rem;margin-bottom:8px}
.onboard-step p{font-size:.85rem;color:var(--text2);line-height:1.7}
.onboard-dots{display:flex;justify-content:center;gap:6px;margin:14px 0}
.onboard-dots i{width:7px;height:7px;border-radius:50%;background:var(--surface3)}
.onboard-dots i.on{background:var(--up);width:18px;border-radius:4px}

/* 术语内联标记 */
.term{color:var(--info);border-bottom:1px dashed var(--info);cursor:pointer}
.term:active{opacity:.7}

/* 空状态 */
.empty{text-align:center;padding:34px 10px;color:var(--muted);font-size:.82rem}
.empty .em{font-size:2.2rem;display:block;margin-bottom:8px}

/* 搜索 */
.search-row{display:flex;gap:8px;margin-bottom:12px}
.search-row input{flex:1}

@media print{ nav.tabs,header.topbar{display:none} }
</style>
</head>
<body>
<div id="offlineBar">当前离线 / 数据接口不可用 · 已切换示例数据，训练不受影响</div>
<div id="app">
  <header class="topbar">
    <div class="topbar-row">
      <div class="logo"><span class="dot"></span>盘感训练营</div>
      <span class="status" id="dataStatus">初始化</span>
      <button class="btn-ico" id="btnRefSearch">🔍 速查</button>
    </div>
    <nav class="tabs" id="navTabs">
      <div class="tab on" data-tab="home"><span class="t-ico">🏠</span>首页</div>
      <div class="tab" data-tab="academy"><span class="t-ico">🎓</span>学院</div>
      <div class="tab" data-tab="drill"><span class="t-ico">📝</span>练习</div>
      <div class="tab" data-tab="train"><span class="t-ico">🎯</span>训练</div>
      <div class="tab" data-tab="mood"><span class="t-ico">🌡️</span>情绪</div>
      <div class="tab" data-tab="tools"><span class="t-ico">🧰</span>工具</div>
      <div class="tab" data-tab="mine"><span class="t-ico">👤</span>我的</div>
    </nav>
  </header>

  <div class="page on" id="page-home"></div>
  <div class="page" id="page-academy"></div>
  <div class="page" id="page-drill"></div>
  <div class="page" id="page-train"></div>
  <div class="page" id="page-mood"></div>
  <div class="page" id="page-tools"></div>
  <div class="page" id="page-mine"></div>

  <div class="disclaimer" id="footDisclaimer">
    ⚠️ 本应用仅为交易知识与盘感训练工具，所有内容、历史行情与训练成绩均不构成任何投资建议，不代表实盘收益。
    历史回放存在幸存者偏差，训练成绩好 ≠ 实盘会赚钱。投资有风险，入市需谨慎。
  </div>
</div>

<div class="sheet-mask" id="sheetMask"><div class="sheet" id="sheetBody"></div></div>

function fmtAmt(v){ if(v==null||isNaN(v)||v==='-')return '--'; v=Number(v); const a=Math.abs(v);
  if(a>=1e12)return (v/1e12).toFixed(2)+'万亿'; if(a>=1e8)return (v/1e8).toFixed(a>=1e10?0:1)+'亿';
  if(a>=1e4)return (v/1e4).toFixed(1)+'万'; return v.toFixed(0); }

/* ================= 双写存储（IndexedDB 主库 + localStorage 镜像，启动对账） ================= */
const DB=(()=>{
  const P='pg_';
  let ifOK=false, ready=false;
  const mtIf={}, mtLs={};   // key -> 最后写入时间（两个引擎各记一份）
  function lsGet(k,def){ try{ const v=localStorage.getItem(P+k); return v==null?def:JSON.parse(v); }catch(e){ return def; } }
  function lsSet(k,v){ try{ localStorage.setItem(P+k,JSON.stringify(v)); return true; }catch(e){ return false; } }
  async function init(){
    try{ if(window.localforage){ await localforage.config({name:'pangan',storeName:'kv'}); ifOK=true; } }catch(e){ ifOK=false; }
    Object.assign(mtLs, lsGet('mt',{}));
    if(ifOK) Object.assign(mtIf, await localforage.getItem(P+'mt').catch(()=>null)||{});
    // 对账：两引擎都有且内容不一致 → 谁新用谁
    const keys=new Set([...Object.keys(mtIf),...Object.keys(mtLs)]);
    const fixed=[];
    for(const k of keys){
      if(k==='mt')continue;
      const a=lsGet(k,null);
      const b=ifOK?await localforage.getItem(P+k).catch(()=>null):null;
      if(a==null&&b==null)continue;
      const ta=mtLs[k]||0, tb=mtIf[k]||0;
      let winner=null;
      if(b!=null&&(a==null||tb>=ta))winner=b; else winner=a;
      lsSet(k,winner); if(ifOK)await localforage.setItem(P+k,winner).catch(()=>{});
      const t=Math.max(ta,tb); mtLs[k]=t; mtIf[k]=t; fixed.push(k);
    }
    lsSet('mt',mtLs);
    if(ifOK)await localforage.setItem(P+'mt',mtIf).catch(()=>{});
    ready=true;
    return {engine:ifOK?'IndexedDB+LS 双写':'仅 localStorage', reconciled:fixed.length};
  }
  async function get(k,def){
    const a=lsGet(k,null);
    const b=ifOK?await localforage.getItem(P+k).catch(()=>null):null;
    if(b!=null&&(a==null||(mtIf[k]||0)>=(mtLs[k]||0)))return b;
    return a!=null?a:def;
  }
  async function set(k,v){
    const t=nowMs();
    lsSet(k,v); mtLs[k]=t; lsSet('mt',mtLs);
    if(ifOK){ await localforage.setItem(P+k,v).catch(()=>{}); mtIf[k]=t; await localforage.setItem(P+'mt',mtIf).catch(()=>{}); }
  }
  async function exportAll(){
    const out={};
    const keys=new Set([...Object.keys(mtIf),...Object.keys(mtLs)]);
    for(const k of keys){ if(k==='mt')continue; const v=await get(k,null); if(v!=null)out[k]=v; }
    return out;
  }
  async function importAll(obj){
    for(const k in obj){ if(k==='mt')continue; await set(k,obj[k]); }
  }
  async function clearAll(){
    const keys=new Set([...Object.keys(mtIf),...Object.keys(mtLs)]);
    for(const k of keys){ if(k==='mt')continue; try{localStorage.removeItem(P+k);}catch(e){}
      if(ifOK)await localforage.removeItem(P+k).catch(()=>{}); }
    Object.keys(mtIf).forEach(x=>delete mtIf[x]); Object.keys(mtLs).forEach(x=>delete mtLs[x]);
    lsSet('mt',mtLs); if(ifOK)await localforage.setItem(P+'mt',mtIf).catch(()=>{});
  }
  return {init,get,set,exportAll,importAll,clearAll, get engine(){return ifOK?'IndexedDB':'localStorage';}, get ready(){return ready;}};
})();

function touchStreak(){
  const t=todayStr();
  if(S.streak.last===t)return false;
  const y=new Date(); y.setDate(y.getDate()-1);
  S.streak.count = (S.streak.last===todayStr(y)) ? S.streak.count+1 : 1;
  S.streak.last=t; S.streak.best=Math.max(S.streak.best,S.streak.count);
  savePiece('streak'); return true;
}

/* ================= 市场时段 ================= */
function marketPhase(d){
  d=d||new Date();
  const day=d.getDay(); if(day===0||day===6)return 'closed';
  const m=d.getHours()*60+d.getMinutes();
  if(m<570)return 'pre';           // <9:30
  if(m<690)return 'am';            // 9:30-11:30
  if(m<787)return 'break';         // 11:30-13:07
  if(m<900)return 'pm';            // 13:07-15:00
  return 'post';                   // 收盘后
}

function classifySentiment(st,prev){
  // st:{up,dn,zt,dt,zb,amount} prev:昨日 {score}
  const total=(st.up||0)+(st.dn||0);
  const upRatio=total>0?(st.up||0)/total:0.5;
  const amt=st.amount||0;
  let score=50 + (upRatio-0.5)*60 + clamp((st.zt||0)-(st.dt||0),-40,60)*0.6 - (st.zb||0)*25;
  if(prev&&prev.amount>0&&amt>0) score += clamp(amt/prev.amount-1,-0.5,0.5)*20;
  score=Math.round(clamp(score,0,100));
  let stage;
  const ps=prev&&prev.score!=null?prev.score:null;
  if(score>=65)stage='hot';
  else if(score<25)stage='ice';
  else if(ps!=null&&ps-score>=8&&ps>=50)stage='ebb';
  else if(ps!=null&&score-ps>=8&&score>=45)stage='warm';
  else stage=score>=45?'warm':'ebb';
  return {score,stage};
}

function mulberry32(seed){ return function(){ let t=seed+=0x6D2B79F5; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
function synthKline(idx,seedShift){
  const rnd=mulberry32(20261108+idx*977+ (seedShift||0));
  const bars=[]; let px=8+rnd()*60, regime=0, left=0, drift=0, vol=1;
  const start=new Date(); start.setDate(start.getDate()-560);
  for(let i=0;i<500;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    if(d.getDay()===0||d.getDay()===6)continue;
    if(left<=0){ // 切换行情阶段：0震荡 1上行 2下行 3急拉 4急跌
      regime=Math.floor(rnd()*5); left=20+Math.floor(rnd()*60);
      drift=[0,0.004,-0.004,0.012,-0.012][regime]; vol=[1,1.4,1.6,2.6,2.4][regime];
    }
    left--;
    const chg=(rnd()-0.5)*0.03*vol+drift;
    const o=px*(1+(rnd()-0.5)*0.008);
    const c=Math.max(1,px*(1+chg));
    const h=Math.max(o,c)*(1+rnd()*0.012*vol);
    const l=Math.min(o,c)*(1-rnd()*0.012*vol);
    const base=(idx+3)*2.2e6*(1+vol);
    const v=Math.round(base*(1+Math.abs(chg)*40)*(0.7+rnd()*0.8));
    bars.push({date:todayStr(d),o:+o.toFixed(2),c:+c.toFixed(2),h:+h.toFixed(2),l:+l.toFixed(2),v,a:v*(px*(1+rnd())),amp:+(Math.abs(chg)*100*1.6+0.5).toFixed(2),pct:+(chg*100).toFixed(2),turn:+(1.2+rnd()*6*vol).toFixed(2)});
    px=c;
  }
  return bars;
}

/* ================= 指标计算 ================= */
function ma(closes,n){ const out=[]; let sum=0;
  for(let i=0;i<closes.length;i++){ sum+=closes[i]; if(i>=n)sum-=closes[i-n]; out.push(i>=n-1?sum/n:null); }
  return out; }
function maOf(bars,n){ return ma(bars.map(b=>b.c),n); }
function volMa(bars,n){ return ma(bars.map(b=>b.v),n); }
function ema(arr,n){ const k=2/(n+1); const out=[]; let e=arr[0];
  arr.forEach((v,i)=>{ e=i===0?v:v*k+e*(1-k); out.push(e); }); return out; }
function macd(closes){ const e12=ema(closes,12),e26=ema(closes,26);
  const dif=closes.map((_,i)=>e12[i]-e26[i]); const dea=ema(dif,9);
  const hist=dif.map((v,i)=>(v-dea[i])*2); return {dif,dea,hist}; }
function boll(closes,n,p){ const mid=ma(closes,n); const up=[],low=[];
  for(let i=0;i<closes.length;i++){
    if(mid[i]==null){up.push(null);low.push(null);continue;}
    const seg=closes.slice(i-n+1,i+1); const m=mid[i];
    const sd=Math.sqrt(seg.reduce((s,x)=>s+(x-m)*(x-m),0)/n);
    up.push(m+(p||2)*sd); low.push(m-(p||2)*sd);
  } return {mid,up,low}; }

class KChart{
  constructor(cv,bars,opts){
    this.cv=cv; this.bars=bars; this.o=Object.assign({ma:[5,10,20,60],boll:false,vol:true,turn:false,macd:false,hideAfter:null,height:300,volMa:true},opts||{});
    this.view={i0:Math.max(0,bars.length-(opts?.count||90)),n:opts?.count||90};
    this.cursor=null; this.tip=cv.parentNode.querySelector('.chart-tip');
    this._bind();
    this.render();
  }
  _bind(){
    const cv=this.cv; this.ptrs=new Map(); this.drag=null; this.pinch0=null;
    cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); this.ptrs.set(e.pointerId,{x:this._ox(e),y:this._oy(e)});
      if(this.ptrs.size===1){ this.drag={x0:this._ox(e),i0:this.view.i0,moved:false}; }
      else if(this.ptrs.size===2){ const p=[...this.ptrs.values()]; this.pinch0={d:Math.abs(p[0].x-p[1].x),n:this.view.n,cx:(p[0].x+p[1].x)/2}; this.drag=null; }
    });
    cv.addEventListener('pointermove',e=>{
      if(!this.ptrs.has(e.pointerId)){ this._cross(this._ox(e)); return; }
      this.ptrs.set(e.pointerId,{x:this._ox(e),y:this._oy(e)});
      if(this.pinch0&&this.ptrs.size===2){
        const p=[...this.ptrs.values()]; const d=Math.abs(p[0].x-p[1].x);
        if(this.pinch0.d>4){ const r=d/this.pinch0.d; this._zoomAround(this.pinch0.cx, clamp(Math.round(this.pinch0.n/r),20,this.bars.length)); }
        return;
      }
      if(this.drag){
        const cw=this._cw();
        const dx=this._ox(e)-this.drag.x0;
        if(Math.abs(dx)>6)this.drag.moved=true;
        if(this.drag.moved){
          const shift=Math.round(dx/cw);
          const i0=clamp(this.drag.i0-shift,0,Math.max(0,this.bars.length-this.view.n));
          this.view.i0=i0; this.render(); this._cross(this._ox(e),true);
        }
      } else this._cross(this._ox(e));
    });
    const up=e=>{ this.ptrs.delete(e.pointerId);
      if(this.ptrs.size<2)this.pinch0=null;
      if(this.ptrs.size===0){ if(this.drag&&!this.drag.moved&&this.o.onTap)this.o.onTap(this._ox(e),this._oy(e)); this.drag=null; } };
    cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
    cv.addEventListener('pointerleave',()=>{ this.cursor=null; if(this.tip)this.tip.style.display='none'; this.render(); });
    cv.addEventListener('wheel',e=>{ e.preventDefault();
      const f=e.deltaY>0?1.15:0.87;
      this._zoomAround(this._ox(e), clamp(Math.round(this.view.n*f),20,this.bars.length));
    },{passive:false});
    cv.addEventListener('dblclick',()=>{ this.view={i0:Math.max(0,this.bars.length-this.view.n),n:this.view.n}; this.render(); });
  }
  _cw(){ const {w}=this._dim; return (w-46)/this.view.n; }
  /* 兼容性：部分安卓内核触屏指针事件没有 offsetX，用 clientX-rect 兜底 */
  _ox(e){ const r=this.cv.getBoundingClientRect(); return (e.clientX||0)-r.left; }
  _oy(e){ const r=this.cv.getBoundingClientRect(); return (e.clientY||0)-r.top; }
  _zoomAround(cx,newN){
    const cw=this._cw();
    const idxAt=this.view.i0+cx/cw;
    const i0=clamp(Math.round(idxAt-newN*(cx/(this._dim.w-46))),0,Math.max(0,this.bars.length-newN));
    this.view={i0,n:newN}; this.render();
  }
  _cross(x,keep){
    const {w}=this._dim;
    const cw=(w-46)/this.view.n;
    const idx=clamp(this.view.i0+Math.round(x/cw),0,this.bars.length-1);
    this.cursor=idx; this.render();
    if(this.tip&&this.o.onTip!==false){
      const b=this.bars[idx];
      let html=`<b>${esc(b.date)}</b><br>开 ${b.o} 收 ${b.c} 高 ${b.h} 低 ${b.l}<br>量 ${fmtAmt(b.v)}`;
      if(b.turn!=null)html+=` · 换手 ${b.turn}%`;
      if(b.pct!=null)html+=`<br>涨跌 <span class="${b.pct>0?'up':'down'}">${fmtPct(b.pct)}</span>`;
      this.tip.innerHTML=html; this.tip.style.display='block';
      const tx=clamp(x+12,0,w-190);
      this.tip.style.left=tx+'px'; this.tip.style.top='8px';
    }
  }
  setOpts(patch){ Object.assign(this.o,patch); this.render(); }
  render(){
    if(!this.bars.length)return;
    const h=this.o.height;
    const {ctx,w}=setupCanvas(this.cv,h);
    this._dim={ctx,w,h};
    const axW=44;
    const subH=(this.o.vol?h*0.16:0)+(this.o.turn||this.o.macd?h*0.15:0);
    const priceH=h-subH-20;
    const i0=this.view.i0,n=Math.min(this.view.n,this.bars.length-i0);
    const iEnd=i0+n;
    const vis=this.bars.slice(i0,iEnd);
    const cw=(w-axW)/n;
    const upC=css('--up'),dnC=css('--down'),txtC=css('--text2'),gridC=css('--border'),mutC=css('--muted');
    // 价格范围（含均线/BOLL）
    let lo=Infinity,hi=-Infinity;
    for(let i=i0;i<iEnd;i++){ const b=this.bars[i]; if(this.o.hideAfter!=null&&i>this.o.hideAfter)continue;
      lo=Math.min(lo,b.l); hi=Math.max(hi,b.h); }
    const mas={};
    for(const p of this.o.ma||[]){ mas[p]=maOf(this.bars,p); for(let i=i0;i<iEnd;i++){ const v=mas[p][i]; if(v!=null&&!(this.o.hideAfter!=null&&i>this.o.hideAfter)){lo=Math.min(lo,v);hi=Math.max(hi,v);} } }
    if(this.o.boll){ const bl=boll(this.bars.map(b=>b.c),20,2);
      for(let i=i0;i<iEnd;i++){ if(this.o.hideAfter!=null&&i>this.o.hideAfter)continue;
        if(bl.up[i]!=null){lo=Math.min(lo,bl.low[i]);hi=Math.max(hi,bl.up[i]);} } }
    const pad=(hi-lo)*0.06||1; lo-=pad; hi+=pad;
    const Y=v=>priceH-(v-lo)/(hi-lo)*(priceH-14)+7;
    const X=i=>axW*0+ (i-i0)*cw + cw/2;
    /* 坐标映射暴露给标注层（23-markup）：X(i) Y(price) 与反向计算 */
    this._map={X,Y,lo,hi,priceH,axW,cw,i0,n};
    ctx.clearRect(0,0,w,h);
    ctx.font='10px -apple-system,sans-serif';
    // 网格与价格刻度
    ctx.strokeStyle=gridC; ctx.fillStyle=mutC; ctx.textAlign='left';
    for(let g=0;g<=4;g++){ const y=7+g*(priceH-14)/4; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w-axW,y); ctx.stroke();
      const val=hi-(hi-lo)*g/4; ctx.fillText(val.toFixed(val>=100?0:2),w-axW+4,y+3); }
    // 未来遮罩（训练模式）
    if(this.o.hideAfter!=null){
      const hx=X(this.o.hideAfter)+cw/2;
      ctx.fillStyle=css('--surface3'); ctx.fillRect(hx,0,w-axW-hx,priceH);
      ctx.fillStyle=mutC; ctx.textAlign='center';
      ctx.fillText('? 未 来 五 天 ?',Math.min(hx+(w-axW-hx)/2,w-axW-40),priceH/2);
      ctx.strokeStyle=css('--gold'); ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.moveTo(hx,0); ctx.lineTo(hx,priceH); ctx.stroke(); ctx.setLineDash([]);
    }
    // BOLL
    if(this.o.boll){ const bl=boll(this.bars.map(b=>b.c),20,2);
      ctx.strokeStyle=MA_COLORS[10]; ctx.setLineDash([3,3]);
      [[bl.up,'up'],[bl.low,'low']].forEach(([arr])=>{ ctx.beginPath(); let first=true;
        for(let i=i0;i<Math.min(iEnd,this.o.hideAfter!=null?this.o.hideAfter+1:iEnd);i++){ if(arr[i]==null)continue;
          const x=X(i),y=Y(arr[i]); first?ctx.moveTo(x,y):ctx.lineTo(x,y); first=false; } ctx.stroke(); });
      ctx.setLineDash([]); }
    // K线（或基金净值线形模式）
    if(this.o.line){
      const hi2=Math.min(iEnd,this.o.hideAfter!=null?this.o.hideAfter+1:iEnd);
      ctx.strokeStyle=css('--gold'); ctx.lineWidth=1.8; ctx.beginPath(); let lf=true;
      for(let i=i0;i<hi2;i++){ const x=X(i),y=Y(this.bars[i].c); lf?ctx.moveTo(x,y):ctx.lineTo(x,y); lf=false; }
      ctx.stroke();
      ctx.fillStyle=mutC; ctx.textAlign='left'; ctx.fillText('净值走势',4,priceH-4);
    } else {
    for(let i=i0;i<iEnd;i++){
      const b=this.bars[i]; if(this.o.hideAfter!=null&&i>this.o.hideAfter)continue;
      const x=X(i); const col=b.c>=b.o?upC:dnC;
      ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x,Y(b.h)); ctx.lineTo(x,Y(b.l)); ctx.stroke();
      const bw=Math.max(1.5,cw*0.62);
      const yo=Y(b.o),yc=Y(b.c);
      if(b.c>=b.o){ ctx.strokeRect(x-bw/2,Math.min(yo,yc),bw,Math.max(1,Math.abs(yc-yo))); }
      else { ctx.fillRect(x-bw/2,Math.min(yo,yc),bw,Math.max(1,Math.abs(yc-yo))); }
    }
    }
    // 均线
    for(const p of this.o.ma||[]){ const arr=mas[p]; ctx.strokeStyle=MA_COLORS[p]; ctx.lineWidth=1.2; ctx.beginPath(); let first=true;
      for(let i=i0;i<Math.min(iEnd,this.o.hideAfter!=null?this.o.hideAfter+1:iEnd);i++){ if(arr[i]==null)continue;
        const x=X(i),y=Y(arr[i]); first?ctx.moveTo(x,y):ctx.lineTo(x,y); first=false; } ctx.stroke(); }
    // 最新价虚线
    const lastVis=this.o.hideAfter!=null?this.o.hideAfter:iEnd-1;
    const lb=this.bars[lastVis];
    if(lb){ ctx.strokeStyle=mutC; ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(0,Y(lb.c)); ctx.lineTo(w-axW,Y(lb.c)); ctx.stroke(); ctx.setLineDash([]); }
    // 十字线
    if(this.cursor!=null&&this.cursor>=i0&&this.cursor<iEnd){
      const x=X(this.cursor);
      ctx.strokeStyle=css('--text2'); ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,priceH); ctx.stroke(); ctx.setLineDash([]);
    }
    // 成交量副图
    let y0=priceH+2;
    if(this.o.vol){
      const vh=subH*(this.o.turn||this.o.macd?0.55:1)-4;
      let vmax=0; for(let i=i0;i<iEnd;i++)vmax=Math.max(vmax,this.bars[i].v);
      const vma=volMa(this.bars,5);
      for(let i=i0;i<iEnd;i++){ const b=this.bars[i]; if(this.o.hideAfter!=null&&i>this.o.hideAfter)continue;
        const x=X(i); const bh=vmax?b.v/vmax*vh:0;
        ctx.fillStyle=b.c>=b.o?upC:dnC; ctx.globalAlpha=.75;
        ctx.fillRect(x-cw*0.3,y0+vh-bh,Math.max(1.5,cw*0.6),bh); }
      ctx.globalAlpha=1;
      if(this.o.volMa){ ctx.strokeStyle=MA_COLORS[5]; ctx.beginPath(); let first=true;
        for(let i=i0;i<Math.min(iEnd,this.o.hideAfter!=null?this.o.hideAfter+1:iEnd);i++){ if(vma[i]==null)continue;
          const x=X(i),y=y0+vh-(vma[i]/vmax*vh); first?ctx.moveTo(x,y):ctx.lineTo(x,y); first=false; } ctx.stroke(); }
      ctx.fillStyle=mutC; ctx.textAlign='left'; ctx.fillText('成交量 '+fmtAmt(vmax),4,y0+10);
      y0+=subH*(this.o.turn||this.o.macd?0.55:1);
    }
    // 换手率 / MACD 副图
    if(this.o.turn||this.o.macd){
      const sh2=subH-(this.o.vol?subH*0.55:0);
      if(this.o.turn){
        let tmax=0.1; for(let i=i0;i<iEnd;i++)tmax=Math.max(tmax,this.bars[i].turn||0);
        ctx.strokeStyle=css('--gold'); ctx.beginPath(); let first=true;
        for(let i=i0;i<Math.min(iEnd,this.o.hideAfter!=null?this.o.hideAfter+1:iEnd);i++){ const t=this.bars[i].turn||0;
          const x=X(i),y=y0+sh2-4-(t/tmax)*(sh2-10); first?ctx.moveTo(x,y):ctx.lineTo(x,y); first=false; }
        ctx.stroke();
        ctx.fillStyle=mutC; ctx.fillText('换手率 max '+tmax.toFixed(1)+'%',4,y0+10);
      } else {
        const closes=this.bars.map(b=>b.c); const m=macd(closes);
        let mm=0.001; for(let i=i0;i<iEnd;i++)mm=Math.max(mm,Math.abs(m.hist[i]),Math.abs(m.dif[i]));
        const midY=y0+sh2/2;
        for(let i=i0;i<iEnd;i++){ if(this.o.hideAfter!=null&&i>this.o.hideAfter)continue;
          const x=X(i); const v=m.hist[i]/mm*(sh2/2-4);
          ctx.fillStyle=v>=0?upC:dnC; ctx.globalAlpha=.7; ctx.fillRect(x-cw*0.3,Math.min(midY,midY-v),Math.max(1.5,cw*0.6),Math.abs(v)); }
        ctx.globalAlpha=1;
        ctx.strokeStyle=MA_COLORS[5]; ctx.beginPath(); let f1=true;
        for(let i=i0;i<Math.min(iEnd,this.o.hideAfter!=null?this.o.hideAfter+1:iEnd);i++){ const x=X(i),y=midY-m.dif[i]/mm*(sh2/2-4); f1?ctx.moveTo(x,y):ctx.lineTo(x,y); f1=false; } ctx.stroke();
        ctx.strokeStyle=MA_COLORS[20]; ctx.beginPath(); let f2=true;
        for(let i=i0;i<Math.min(iEnd,this.o.hideAfter!=null?this.o.hideAfter+1:iEnd);i++){ const x=X(i),y=midY-m.dea[i]/mm*(sh2/2-4); f2?ctx.moveTo(x,y):ctx.lineTo(x,y); f2=false; } ctx.stroke();
        ctx.fillStyle=mutC; ctx.fillText('MACD',4,y0+10);
      }
    }
    // 日期轴
    ctx.fillStyle=mutC; ctx.textAlign='center';
    const step=Math.max(8,Math.round(n/5));
    for(let i=i0+2;i<iEnd;i+=step){ ctx.fillText(this.bars[i].date.slice(5),X(i),h-6); }
    // 图例
    let lx=6,ly=14; ctx.textAlign='left';
    for(const p of this.o.ma||[]){ ctx.fillStyle=MA_COLORS[p]; ctx.fillText('MA'+p,lx,ly); lx+=34; }
    // 标注层重绘钩子（23-markup 的画笔/点读钉用最新坐标映射重画）
    if(this.o.onRender)this.o.onRender(this);
  }
}

/* ================= 形态图渲染（图鉴 + 看图题共用） =================
   ma: 可选均线叠加 [{v:[...],col,label}]，v 与K线同一示意尺度 */
function renderPattern(cv,candles,h,labels,ma){
  /* 兼容性修复：解析卡从 display:none 展开的同帧测量会拿到排版前旧宽度（手机高DPR下错位裁切），
     因此：① 用 getBoundingClientRect 强制排版后测量并夹紧到父容器 ② 宽度可疑时 rAF 重试
     ③ 显式写 style.width（覆盖内联 min()）④ 绘制后再复检一次，宽度变了就重绘 */
  const paint=(allowRecheck)=>{
    const dpr=window.devicePixelRatio||1;
    const r=cv.getBoundingClientRect();
    let w=Math.round(r.width)||Math.round(cv.offsetWidth)||260;
    const pw=cv.parentNode?Math.round(cv.parentNode.getBoundingClientRect().width):0;
    if(pw>0&&w>pw)w=pw;
    if(w<40){  // 容器还不可见，下一帧再试
      if(!cv._pgRetry){ cv._pgRetry=true; requestAnimationFrame(()=>paint(true)); }
      return;
    }
    cv._pgRetry=false;
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
    cv.style.width=w+'px'; cv.style.height=h+'px'; cv.style.maxWidth='100%';
    const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const n=candles.length;
  const pad=8, cw=(w-pad*2)/n;
  let lo=Infinity,hi=-Infinity;
  for(const [o,c,hh,ll] of candles){ lo=Math.min(lo,ll); hi=Math.max(hi,hh); }
  if(ma) (Array.isArray(ma)?ma:[ma]).forEach(m=>{ m.v.forEach(v=>{ if(v!=null){ lo=Math.min(lo,v); hi=Math.max(hi,v); } }); });
  const padV=(hi-lo)*0.12; lo-=padV; hi+=padV;
  const Y=v=>h-8-(v-lo)/(hi-lo)*(h-16);
  const upC=css('--up'),dnC=css('--down');
  candles.forEach((cd,i)=>{
    const [o,c,hh,ll]=cd; const x=pad+i*cw+cw/2; const col=c>=o?upC:dnC;
    ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(x,Y(hh)); ctx.lineTo(x,Y(ll)); ctx.stroke();
    const bw=Math.min(cw*0.6,16);
    const yo=Y(o),yc=Y(c);
    if(c>=o) ctx.strokeRect(x-bw/2,Math.min(yo,yc),bw,Math.max(1.2,Math.abs(yc-yo)));
    else ctx.fillRect(x-bw/2,Math.min(yo,yc),bw,Math.max(1.2,Math.abs(yc-yo)));
  });
  if(ma) (Array.isArray(ma)?ma:[ma]).forEach(m=>{
    ctx.strokeStyle=m.col||'#e8b339'; ctx.lineWidth=1.6;
    ctx.beginPath(); let first=true;
    m.v.forEach((v,i)=>{ if(v==null)return; const x=pad+i*cw+cw/2; first?ctx.moveTo(x,Y(v)):ctx.lineTo(x,Y(v)); first=false; });
    ctx.stroke();
    if(m.label){ ctx.fillStyle=m.col||'#e8b339'; ctx.font='9px sans-serif'; ctx.textAlign='left';
      ctx.fillText(m.label,pad+2,Y(m.v.find(v=>v!=null))-4); }
  });
  if(labels){ ctx.fillStyle=css('--muted'); ctx.font='10px sans-serif'; ctx.textAlign='center';
    labels.forEach((t,i)=>ctx.fillText(t,pad+i*cw+cw/2,h-0.5)); }
  if(allowRecheck!==false) requestAnimationFrame(()=>setTimeout(()=>{
    const w2=Math.round(cv.getBoundingClientRect().width);
    if(w2>=40&&Math.abs(w2-w)>2&&!cv._pgFixed){ cv._pgFixed=true; paint(false); }
    else cv._pgFixed=false;
  },60));
  };
  paint();
}

/* ================= 雷达图 ================= */
function drawRadar(cv,labels,vals){
  const h=cv.getAttribute('data-h')?+cv.getAttribute('data-h'):210;
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth||260;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.height=h+'px';
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const cx=w/2,cy=h/2,R=Math.min(w,h)/2-30,n=labels.length;
  const gridC=css('--border2'),txtC=css('--text2');
  for(let ring=1;ring<=4;ring++){
    ctx.strokeStyle=gridC; ctx.beginPath();
    for(let i=0;i<=n;i++){ const a=-Math.PI/2+i*2*Math.PI/n; const r=R*ring/4;
      const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
    ctx.stroke();
  }
  ctx.strokeStyle=gridC;
  for(let i=0;i<n;i++){ const a=-Math.PI/2+i*2*Math.PI/n;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R); ctx.stroke(); }
  ctx.beginPath();
  vals.forEach((v,i)=>{ const a=-Math.PI/2+i*2*Math.PI/n; const r=R*clamp(v,0.04,1);
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.closePath();
  ctx.fillStyle='rgba(240,82,79,.18)'; ctx.fill();
  ctx.strokeStyle=css('--up'); ctx.lineWidth=1.6; ctx.stroke();
  vals.forEach((v,i)=>{ const a=-Math.PI/2+i*2*Math.PI/n; const r=R*clamp(v,0.04,1);
    ctx.fillStyle=css('--up'); ctx.beginPath(); ctx.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,3,0,7); ctx.fill(); });
  ctx.font='11px sans-serif'; ctx.fillStyle=txtC; ctx.textAlign='center';
  labels.forEach((t,i)=>{ const a=-Math.PI/2+i*2*Math.PI/n;
    ctx.fillText(t,cx+Math.cos(a)*(R+18),cy+Math.sin(a)*(R+16)+4);
    ctx.fillStyle=css('--up'); ctx.fillText(Math.round(vals[i]*100)+'%',cx+Math.cos(a)*(R+18),cy+Math.sin(a)*(R+16)+16);
    ctx.fillStyle=txtC; });
}
function drawSpark(cv,vals,color){
  const h=+cv.getAttribute('data-h')||48;
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth||200;
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); cv.style.height=h+'px';
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  if(!vals.length)return;
  const lo=Math.min(...vals),hi=Math.max(...vals),sp=(hi-lo)||1;
  ctx.strokeStyle=color||css('--gold'); ctx.lineWidth=1.5; ctx.beginPath();
  vals.forEach((v,i)=>{ const x=i/(vals.length-1||1)*(w-8)+4; const y=h-6-(v-lo)/sp*(h-12);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();
}

</script>

<script>/* ==== 13-fsrs.js ==== */
'use strict';
/* ================= FSRS 记忆算法封装 ================= */
const FS=(()=>{
  let sched=null;
  function ensure(){
    if(!sched&&window.FSRS){
      sched=window.FSRS.fsrs(window.FSRS.generatorParameters({request_retention:0.9,maximum_interval:180,enable_short_term:false,enable_fuzz:true}));
    }
    return sched;
  }
  function newCard(){
    if(!ensure())return {fallback:true,due:todayStr(),reps:0};
    const c=window.FSRS.createEmptyCard(new Date());
    return serialize(c);
  }
  function serialize(c){
    if(!c||c.fallback)return c;
    return {due:c.due instanceof Date?c.due.toISOString():String(c.due),
      stability:c.stability,difficulty:c.difficulty,reps:c.reps,
      state:c.state,last_review:c.last_review instanceof Date?c.last_review.toISOString():(c.last_review||null)};
  }
  function deserialize(s){
    if(!s||s.fallback||!window.FSRS)return s?{...s}:null;
    try{
      const c=window.FSRS.createEmptyCard(new Date());
      return {...c,due:new Date(s.due),stability:s.stability,difficulty:s.difficulty,reps:s.reps,state:s.state,
        last_review:s.last_review?new Date(s.last_review):null};
    }catch(e){ return {...s,due:new Date(s.due||Date.now())}; }
  }
  function review(card,grade){ // grade 1-4
    if(!ensure()||card.fallback){
      const days=[1,3,7,16][grade-1]||7;
      const d=new Date(); d.setDate(d.getDate()+days);
      return {fallback:true,due:d.toISOString(),reps:(card.reps||0)+1};
    }
    const c=deserialize(card);
    const res=sched.repeat(c,new Date())[window.FSRS.Rating[grade==='1'?'Again':grade==='2'?'Hard':grade==='3'?'Good':'Easy']];
    if(res&&res.card)return serialize(res.card);
    return card;
  }
  function isDue(card){
    if(!card)return false;
    const due=new Date(card.due);
    return due<=new Date();
  }
  return {newCard,review,isDue,ensure};
})();

/* ================= 答题引擎（课程/每日一练/考试共用） ================= */
/* 题目结构 {t:'s'|'j'|'m'|'c', q, o:[], a, e, p:patternId}  a: s=索引 j=bool m=[索引] */
function qHtml(q,idx,total,qid,state){
  // state: {picked:null|idx|bool|[], checked:false}
  const tag={s:'单选',j:'判断',m:'多选',c:'看图题'}[q.t]||'';
  let chart='';
  /* v1.5 全题图形辅助：每道题（含考试/练习/课程巩固）都强制配图 */
  if(typeof qFigFor==='function'){
    const fig=qFigFor(q);
    if(fig)chart=`<div class="q-chart"><canvas data-qfig="${fig.kind}:${fig.id}" style="width:min(260px,86vw)"></canvas>
      <div class="t2" style="font-size:.68rem;margin-top:4px">📊 图形辅助${fig.cap?' · '+esc(fig.cap):''}</div></div>`;
  } else if(q.t==='c'&&q.p&&typeof PATTERNS!=='undefined'&&PATTERNS[q.p]){
    const pat=PATTERNS[q.p];
    chart=`<div class="q-chart"><canvas data-pat="${q.p}" style="width:min(260px,86vw)"></canvas>
      <div class="t2" style="font-size:.68rem;margin-top:4px">▲ 图中形态（示意）</div></div>`;
  }
  const optsHtml=(q.t==='j')
    ? `<div class="judge-row">
         <button class="btn gray opt-j" data-v="1">✔ 正确</button>
         <button class="btn gray opt-j" data-v="0">✘ 错误</button></div>`
    : q.o.map((o,i)=>`<div class="opt" data-i="${i}"><span class="oidx">${'ABCD'[i]||i+1}</span><span>${o}</span></div>`).join('');
  return `<div class="q-card" data-qid="${qid}">
    <div class="q-tag">第 ${idx+1}/${total} 题 · ${tag}${state.tag?(' · '+esc(state.tag)):''}</div>
    <div class="q-stem">${q.q}</div>
    ${chart}
    <div class="q-opts">${optsHtml}</div>
    <div class="q-explain" style="display:none"></div>
    <div class="q-actions"></div>
  </div>`;
}
function bindQCard(card,q,onDone){
  let picked=null; let checked=false;
  const opts=$$('.opt',card);
  const renderSel=()=>{
    if(q.t==='j'){ $$('.opt-j',card).forEach(b=>b.classList.toggle('sel',picked===b.dataset.v)); }
    else if(q.t==='m'){ opts.forEach((o,i)=>o.classList.toggle('sel',picked&&picked.includes(i))); }
    else opts.forEach((o,i)=>o.classList.toggle('sel',picked===i));
  };
  if(q.t==='j'){ $$('.opt-j',card).forEach(b=>b.addEventListener('click',()=>{ if(checked)return; picked=b.dataset.v; renderSel(); check(); })); }
  else opts.forEach((o,i)=>o.addEventListener('click',()=>{ if(checked)return;
    if(q.t==='m'){ picked=picked||[]; const at=picked.indexOf(i); at>=0?picked.splice(at,1):picked.push(i); renderSel(); }
    else { picked=i; renderSel(); check(); } }));
  if(q.t==='m'){ const act0=$('.q-actions',card);
    act0.innerHTML='<button class="btn small act-check">确认答案</button>';
    $('.act-check',act0).addEventListener('click',()=>{ if(!picked||!picked.length)return toast('先选出你的答案（可多选）'); check(); }); }
  function check(){
    if(checked)return;
    if(picked==null||(q.t==='m'&&(!picked||!picked.length))){ toast('先选出你的答案'); return; }
    checked=true;
    let right=false;
    if(q.t==='j')right=(picked==='1')===!!q.a;
    else if(q.t==='m')right=(q.a.length===picked.length&&q.a.every(x=>picked.includes(x)));
    else right=picked===q.a;
    // 标色
    if(q.t==='j'){ $$('.opt-j',card).forEach(b=>{ const v=b.dataset.v==='1';
      if(v===!!q.a){ b.className='btn small green'; b.style.background=''; }
      else if(v===(picked==='1')){ b.className='btn small'; b.style.background='var(--up)'; }
      else { b.className='btn small gray'; b.style.background=''; } }); }
    else opts.forEach((o,i)=>{
      const isAns=q.t==='m'?q.a.includes(i):i===q.a;
      if(isAns)o.classList.add('right');
      if(!isAns&&(q.t==='m'?picked.includes(i):picked===i))o.classList.add('wrong');
    });
    const ex=$('.q-explain',card);
    ex.style.display='block';
    /* 看图题/多选/单选概念题：解析里逐选项给解释与对照图形 */
    ex.innerHTML=(right?'✅ <b>答对了</b>　':'❌ <b>答错了</b>　')+(q.e||'')
      +(typeof optExplainHtml==='function'?optExplainHtml(q,picked):'');
    if(q.t==='c'||q.t==='m'||q.t==='s'||q.t==='j'){
      $$('canvas[data-oc]',ex).forEach(cv=>{ const p=PATTERNS[cv.dataset.oc]; if(p)renderPattern(cv,p.candles,96,null,p.ma); });
      if(typeof LSN_FIGS!=='undefined'&&LSN_FIGS.CONCEPT_FIGS)
        $$('canvas[data-ocfig]',ex).forEach(cv=>{ const f=LSN_FIGS.CONCEPT_FIGS[cv.dataset.ocfig]; if(f&&f.draw)f.draw(cv); });
    }
    const act=$('.q-actions',card);
    act.innerHTML=`<button class="btn small gray act-again">再想想</button><button class="btn small act-next">下一题 →</button>`;
    $('.act-again',act).addEventListener('click',()=>{ checked=false; picked=null;
      opts.forEach(o=>o.className='opt'); $$('.opt-j',card).forEach(b=>b.className='btn gray opt-j');
      ex.style.display='none'; act.innerHTML='';
      /* 多选题「再想想」后必须重建确认按钮，否则选完无法提交 */
      if(q.t==='m'){ act.innerHTML='<button class="btn small act-check">确认答案</button>';
        $('.act-check',act).addEventListener('click',()=>{ if(!picked||!picked.length)return toast('先选出你的答案（可多选）'); check(); }); }
      renderSel(); });
    $('.act-next',act).addEventListener('click',()=>onDone(right));
    return right;
  }
  // 暴露 check 给外部（考试模式先收全部再判分）
  card._check=()=>{ if(checked)return null; return check(); };
  card._answered=()=>picked!=null&&(q.t!=='m'||picked.length>0);
}
/* 一次渲染一批题的容器 */
function quizFlow(container,questions,opts){
  // opts: {onEach(right,q), onFinish(results), tagOf(q)}
  const results=[]; let cur=0;
  function show(){
    if(cur>=questions.length){ opts.onFinish&&opts.onFinish(results); return; }
    const q=questions[cur];
    const qid=q.id||('q'+cur);
    const st={tag:opts.tagOf?opts.tagOf(q):null};
    /* opts.coach（如训练场E）：每题上方插入「思路会话框」，答后接对照复盘 */
    container.innerHTML=((opts.coach&&typeof COACH!=='undefined')?COACH.quizCardHtml():'')+qHtml(q,cur,questions.length,qid,st);
    if(opts.coach&&typeof COACH!=='undefined')COACH.mountQuiz(opts.coach,q,container);
    if(typeof drawQFigs==='function')drawQFigs(container);
    else if(q.t==='c'&&q.p&&PATTERNS[q.p]){
      const cv=$('canvas',container);
      renderPattern(cv,PATTERNS[q.p].candles,120,PATTERNS[q.p].xl||null,PATTERNS[q.p].ma);
    }
    const card=$('.q-card',container);
    bindQCard(card,q,right=>{
      results.push({qid,right,q});
      if(opts.coach&&typeof COACH!=='undefined'&&COACH.quizAnswer)COACH.quizAnswer(q,right,container);
      (opts.onEach||(()=>{}))(right,q);
      cur++; show();
    });
  }
  show();
  return {get results(){return results;}};
}
/* FSRS：题目答完排期 */
function scheduleQ(qid,lvKey,right){
  if(!S.lessons[lvKey])S.lessons[lvKey]={};
  const L=S.lessons[lvKey];
  if(!L.card)L.card=FS.newCard();
  L.card=FS.review(L.card,right?3:1);
  L.lastAt=nowMs();
  if(right===false){ const w=S.wrong[qid]||{n:0,streak:0};
    w.n++; w.streak=0; w.lastAt=nowMs(); if(lvKey)w.lv=lvKey; S.wrong[qid]=w; }
  else if(right===true&&S.wrong[qid]){ const w=S.wrong[qid]; w.streak=(w.streak||0)+1;
    if(w.streak>=2)delete S.wrong[qid]; }
}

</script>

/* ================= 课程索引 ================= */
const CUR={levels:[],flat:[],qmap:{}};
function CURRICULUM_add(levels){ window.__CURRICULUM__.push(...levels); }
function buildCurriculumIndex(){
  CUR.levels=window.__CURRICULUM__;
  CUR.flat=[]; CUR.qmap={};
  for(const lv of CUR.levels){
    lv.count=lv.lessons.length;
    for(const ls of lv.lessons){
      ls.lvl=lv.i; ls.levelName=lv.n;
      ls.qs.forEach((q,qi)=>{ q.id=ls.id+'-'+qi; q.lid=ls.id; q.lvl=lv.i;
        CUR.qmap[q.id]=q; });
      CUR.flat.push(ls);
    }
  }
}
function lessonDone(){ return CUR.flat.filter(ls=>S.lessons[ls.id]&&S.lessons[ls.id].done).length; }
function allQids(){ return CUR.flat.flatMap(ls=>ls.qs.map(q=>q.id)); }

/* ================= 速查搜索（顶栏🔍） ================= */
function openRefSearch(){
  openSheet(`<h3>🔍 指标速查与形态图鉴</h3>
    <input type="text" id="refQ" placeholder="搜索术语 / 形态（如：换手率、十字星）" style="margin:10px 0">
    <div id="refList"></div>`);
  renderRefList('');
  $('#refQ').addEventListener('input',e=>renderRefList(e.target.value));
}
function renderRefList(kw){
  const k=(kw||'').trim().toLowerCase();
  const tHit=Object.entries(TERM).filter(([key,t])=>!k||key.toLowerCase().includes(k)||t.n.toLowerCase().includes(k)||(t.d||'').includes(kw));
  const pHit=Object.entries(PATTERNS).filter(([id,p])=>!k||p.n.toLowerCase().includes(k)||(p.d||'').includes(kw));
  let html='';
  if(tHit.length)html+='<div class="t2" style="font-size:.72rem;margin:6px 0">📖 指标百科</div>'+tHit.slice(0,20).map(([key,t])=>
    `<div class="list-item clickable" onclick="showTermCard('${key}')"><div class="li-main"><b>${esc(t.n)}</b> <span class="chip">${esc(t.cat)}</span><div class="t2" style="font-size:.72rem">${esc(t.d.slice(0,40))}…</div></div><span class="pos-tag">查看</span></div>`).join('');
  if(pHit.length)html+='<div class="t2" style="font-size:.72rem;margin:10px 0 6px">🕯️ K线形态</div>'+pHit.slice(0,12).map(([id,p])=>
    `<div class="list-item clickable" onclick="showPattern('${id}')"><div class="li-main"><b>${esc(p.n)}</b> <span class="${PATTERN_BIAS[p.bias].cls}">${PATTERN_BIAS[p.bias].t}</span></div><span class="pos-tag">图鉴</span></div>`).join('');
  if(!html)html='<div class="empty"><span class="em">🔍</span>没有匹配的词条</div>';
  $('#refList').innerHTML=html;
}
function showPattern(id){
  const p=PATTERNS[id]; if(!p)return;
  openSheet(`<h3>🕯️ ${esc(p.n)}</h3><span class="${PATTERN_BIAS[p.bias].cls}">${PATTERN_BIAS[p.bias].t}</span> <span class="chip">${esc(p.cat)}</span>
    <div class="q-chart" style="margin-top:10px"><canvas id="patBig" style="width:min(300px,88vw)"></canvas></div>
    <div class="sec" style="margin-top:10px"><div class="k t2" style="font-size:.7rem">定义</div><div style="font-size:.85rem;line-height:1.7">${esc(p.d)}</div></div>
    <div class="sec" style="margin-top:8px"><div class="k t2" style="font-size:.7rem">含义与用法</div><div style="font-size:.85rem;line-height:1.7">${esc(p.s)}</div></div>
    <button class="btn gray block" style="margin-top:14px" onclick="closeSheet()">关闭</button>`);
  const cv=$('#patBig'); if(cv)renderPattern(cv,p.candles,150,null,p.ma);
}

/* ---------- 派生 ---------- */
const _te=new TextEncoder();
async function pgDerive(name,pwd,ns){
  const saltBuf=await crypto.subtle.digest('SHA-256',_te.encode(ns+':'+name));
  const key=await crypto.subtle.importKey('raw',_te.encode(pwd),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:saltBuf,iterations:150000},key,256);
  return new Uint8Array(bits);
}
async function pgHash(name,pwd){ // 64 hex，上云比对用
  const b=await pgDerive(name,pwd,'pg-salt-v1');
  return [...b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function pgAes(name,pwd){ // AES-GCM JWK，加密进度用
  const raw=await pgDerive(name,pwd,'pg-aes-v1');
  return crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt']);
}
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pgEnc(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,_te.encode(JSON.stringify(obj)));
  return {enc:1,iv:b64u(iv),ct:b64u(ct)};
}
async function pgDec(key,st){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(st.iv)},key,ub64(st.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- RPC（网络瞬断自动重试1次；业务错误立即抛出） ---------- */
async function pgRpc(fn,params){
  for(let i=0;i<2;i++){
    try{
      const r=await fetch(CLOUD_URL+'/rest/v1/rpc/'+fn,{method:'POST',
        headers:{apikey:CLOUD_KEY,Authorization:'Bearer '+CLOUD_KEY,'Content-Type':'application/json'},
        body:JSON.stringify(params)});
      const t=await r.text();
      if(!r.ok){
        let m='服务异常 '+r.status;
        try{ const j=JSON.parse(t); if(j.message)m=j.message; }catch(e){}
        throw {biz:m};
      }
      try{ return JSON.parse(t); }catch(e){ return t.replace(/"/g,''); }
    }catch(e){
      if(e&&e.biz)throw new Error(e.biz);   // 后端业务错误（密码错/锁定/限额）不重试
      if(i===0)await sleep(1500);           // 网络瞬断重试一次
    }
  }
  throw new Error('网络不稳，稍后再试');
}

/* ---------- 进度裁剪（不进云端：日记贴图/GitHub凭据；总量超限先裁历史） ---------- */
function cloudSlim(){
  const j={}; for(const [d,e] of Object.entries(S.journal)) j[d]={...e,imgs:[]};
  const st={settings:{dailyTarget:S.settings.dailyTarget,theme:S.settings.theme,diff:S.settings.diff,pool:S.settings.pool||'all'},
    streak:S.streak,lessons:S.lessons,wrong:S.wrong,daily:S.daily,exams:S.exams,
    train:{hist:S.train.hist.slice(-500),cards:S.train.cards},sent:S.sent.slice(-120),
    journal:j,paper:S.paper,watch:S.watch,watchMeta:S.watchMeta,onboarding:S.onboarding,
    _at:nowMs(),_app:'pangan'};
  let out=JSON.stringify(st);
  if(out.length>200000){ st.sent=st.sent.slice(-40); out=JSON.stringify(st); }
  if(out.length>200000){ st.train.hist=st.train.hist.slice(-200); out=JSON.stringify(st); }
  return JSON.parse(out);
}
function cloudApply(d){
  if(d.settings)S.settings=Object.assign(S.settings,d.settings);
  const take=(k,cur)=>{ if(d[k]!=null)S[k]=d[k]; };
  ['streak','lessons','wrong','daily','exams','train','sent','paper','watch','watchMeta'].forEach(take);
  /* 日记特殊合并：云端精简版无图片，保留本机贴图与本地独有的日记 */
  if(d.journal){
    const m={};
    for(const k in d.journal) m[k]={...d.journal[k],imgs:(S.journal[k]&&S.journal[k].imgs)||[]};
    for(const k in S.journal) if(!m[k])m[k]=S.journal[k];
    S.journal=m;
  }
  if(d.onboarding!=null)S.onboarding=d.onboarding;
  return Object.keys(['settings','streak','lessons','wrong','daily','exams','train','sent','journal','paper','watch']).length;
}

/* ---------- 登录 / 注册 / 找回（一个入口，后端自动区分） ---------- */
async function cloudLogin(name,pwd,mode){ // mode: 'auto'|'pull'|'push'
  if(!CLOUD_OK)throw new Error('当前页面不是安全上下文(https)，云同步不可用——请用在线网址打开');
  name=name.trim();
  if(!name||name.length>20)throw new Error('名字需 1-20 个字符');
  if(!pwd||pwd.length<6)throw new Error('密码至少 6 位');
  const hash=await pgHash(name,pwd);
  const aes=await pgAes(name,pwd);
  const rows=await pgRpc('pg_load',{p_name:name,p_salt:'',p_hash:hash});
  if(rows&&rows.length&&rows[0].state){ // 云端有进度
    let data;
    try{ data=await pgDec(aes,rows[0].state); }
    catch(e){ throw new Error('密码不正确（解密失败）'); }
    if(!data||data._app!=='pangan')throw new Error('云端数据不是本应用的进度');
    const localHas=lessonDone()>0||S.train.hist.length>0||Object.keys(S.journal).length>0||Object.keys(S.wrong).length>0;
    let choice=mode;
    if(localHas&&mode==='auto'){
      choice=confirm(`云端有「${name}」的进度（${new Date(data._at||Date.now()).toLocaleString()}），本机也有学习记录。\n\n【确定】= 下载云端覆盖本机\n【取消】= 保留本机，并把本机上传为云端`)?'pull':'push';
    }
    if(choice!=='push'){ cloudApply(data); }
    persistKeys(name,hash,aes); S.cloud={name,on:true,last:nowMs()}; savePiece('cloud');
    for(const k of ['settings','streak','lessons','wrong','daily','exams','train','sent','journal','paper','watch','watchMeta','cloud'])await DB.set(k,S[k]);
    if(choice!=='push'&&choice==='pull'&&localHas){ location.reload(); return '已恢复云端进度'; }
    if(choice==='push'){ await cloudPushNow(hash,aes); return '已保留本机并上传云端'; }
    return '登录成功，进度已同步';
  }
  // 云端无数据：注册（若名字已被占用且密码错，后端返回 wrong_password）
  const slim=cloudSlim();
  const enc=await pgEnc(aes,slim);
  const res=await pgRpc('pg_save',{p_name:name,p_salt:'',p_hash:hash,p_state:enc});
  if(res==='wrong_password')throw new Error('该名字已存在，但密码不对（已计入失败锁定）');
  if(res==='error')throw new Error('参数/数据超限');
  persistKeys(name,hash,aes); S.cloud={name,on:true,last:nowMs()}; savePiece('cloud');
  return res==='created'?'🎉 云同步开通成功，本机进度已加密上传':'进度已加密上传';
}
function persistKeys(name,hash,aes){
  // 派生密钥只存本机；不进 DB（不进备份码/云端）
  crypto.subtle.exportKey('jwk',aes).then(j=>{
    localStorage.setItem('pg_ck',JSON.stringify({name,hash,aes:j}));
  }).catch(()=>{});
}
/* ---------- 自动上传（savePiece 钩子调用，防抖6秒） ---------- */
function scheduleCloud(){
  if(!cloudOn())return;
  clearTimeout(cloudT); cloudT=setTimeout(()=>{ cloudPush().catch(()=>{}); },6000);
}
async function cloudPush(){
  if(!cloudOn()||cloudBusy)return 'off';
  cloudBusy=true;
  try{
    const ck=cloudKeys();
    const aes=await crypto.subtle.importKey('jwk',ck.aes,'AES-GCM',true,['encrypt','decrypt']);
    return await cloudPushNow(ck.hash,aes);
  } finally { cloudBusy=false; }
}
async function cloudPushNow(hash,aes){
  const enc=await pgEnc(aes,cloudSlim());
  const res=await pgRpc('pg_save',{p_name:cloudName(),p_salt:'',p_hash:hash,p_state:enc});
  if(res==='ok'||res==='created'){ S.cloud.last=nowMs(); savePiece('cloud'); return res; }
  if(res==='wrong_password'){
    localStorage.removeItem('pg_ck'); S.cloud={...S.cloud,on:false}; savePiece('cloud');
    throw new Error('云端密码已变更，自动同步暂停——请在「我的→云同步」重新登录');
  }
  throw new Error(res==='error'?'进度超限或参数异常':String(res));
}
/* ---------- 手动下载恢复 ---------- */
async function cloudPull(){
  const ck=cloudKeys(); if(!ck)throw new Error('请先登录云同步');
  const rows=await pgRpc('pg_load',{p_name:ck.name,p_salt:'',p_hash:ck.hash});
  if(!rows||!rows.length||!rows[0].state)throw new Error('云端暂无进度');
  const aes=await crypto.subtle.importKey('jwk',ck.aes,'AES-GCM',true,['encrypt','decrypt']);
  const data=await pgDec(aes,rows[0].state);
  cloudApply(data);
  for(const k of ['settings','streak','lessons','wrong','daily','exams','train','sent','journal','paper','watch','watchMeta'])await DB.set(k,S[k]);
  S.cloud.last=nowMs(); savePiece('cloud');
  return new Date(data._at||Date.now()).toLocaleString();
}

/* ---------- 换密码（重新加密上传） ---------- */
async function cloudChpwd(oldPwd,newPwd){
  const ck=cloudKeys(); const name=ck?ck.name:$('#clName')?$('#clName').value.trim():'';
  if(!name)throw new Error('先填名字');
  const oldHash=await pgHash(name,oldPwd);
  // 用旧密码解出当前云端进度 → 新密码重加密 → chpwd + save
  const rows=await pgRpc('pg_load',{p_name:name,p_salt:'',p_hash:oldHash});
  let data=null;
  if(rows&&rows.length&&rows[0].state){
    const oldAes=await pgAes(name,oldPwd);
    data=await pgDec(oldAes,rows[0].state);
  } else data=null;
  const newHash=await pgHash(name,newPwd);
  if(data){
    const newAes=await pgAes(name,newPwd);
    const enc=await pgEnc(newAes,data);
    const r1=await pgRpc('pg_chpwd',{p_name:name,p_old_hash:oldHash,p_new_salt:'',p_new_hash:newHash});
    if(r1!=='ok')throw new Error('旧密码不正确');
    await pgRpc('pg_save',{p_name:name,p_salt:'',p_hash:newHash,p_state:enc});
    persistKeys(name,newHash,newAes); if(S.cloud){S.cloud.on=true;savePiece('cloud');}
    return '密码已更换，进度已用新密码重新加密';
  }
  const r1=await pgRpc('pg_chpwd',{p_name:name,p_old_hash:oldHash,p_new_salt:'',p_new_hash:newHash});
  if(r1!=='ok')throw new Error('旧密码不正确');
  persistKeys(name,newHash,null); return '密码已更换';
}
