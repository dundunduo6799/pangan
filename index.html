<script>/* ==== 23-markup.js ==== */
'use strict';
/* ================= 图表标注层：画笔 + AI点读（训练场 / 指标实验室共用） =================
   ✏️ 画笔标注：自由手绘「我认为的答案」（如未来走势路径、支撑压力圈画）。
      坐标存 (日期,价格) 空间——缩放/平移不漂移；揭晓后自动叠加到真实走势图对照。
   🔍 AI点读：点任意一根K线 → 该位置的数据+规则化解读（只用当根及之前的数据）。
      训练模式下未来遮罩区域不可点读——先自己判断，揭晓后再对照。
   红线：解读全部为历史数据的学习视角，不预测未来、不荐股、不给买卖指令。 */
const ChartMark=(()=>{
const PEN_COLOR='#e8b339';

/* ---------- 单根K线的规则化解读 ---------- */
function readLines(bars,idx){
  const b=bars[idx];const L=[];
  const pct=b.pct!=null?b.pct:(bars[idx-1]?(b.c/bars[idx-1].c-1)*100:null);
  L.push(`📌 <b>${b.date}</b> 收 <b>${b.c.toFixed(2)}</b> ${pct!=null?`<span class="${pct>=0?'up':'down'}">${fmtPct(pct)}</span>`:''} · 量 ${fmtAmt(b.v)}${b.turn!=null?' · 换手 '+b.turn+'%':''}`);
  const m5=maOf(bars,5),m10=maOf(bars,10),m20=maOf(bars,20),v5=volMa(bars,5);
  if(m5[idx]!=null&&m10[idx]!=null&&m20[idx]!=null){
    const bull=m5[idx]>m10[idx]&&m10[idx]>m20[idx],bear=m5[idx]<m10[idx]&&m10[idx]<m20[idx];
    L.push(`均线：价格在MA5${b.c>m5[idx]?'上方':'下方'}（MA5=${m5[idx].toFixed(2)} MA10=${m10[idx].toFixed(2)} MA20=${m20[idx].toFixed(2)}），${bull?'多头排列——短中期成本抬升，趋势环境偏多':bear?'空头排列——成本下移，反弹易遇解套抛压':'均线纠缠——方向未选择，观望等突破'}`);
  } else if(m5[idx]!=null){
    L.push(`均线：价格在MA5${b.c>m5[idx]?'上方':'下方'}（MA5=${m5[idx].toFixed(2)}）——${b.c>m5[idx]?'近5日买入者平均获利，短线结构偏强':'近5日买入者平均被套，短线结构偏弱'}`);
  }
  if(v5[idx-1]){
    const vr=b.v/v5[idx-1];
    L.push(`量能：为5日均量 ${vr.toFixed(2)} 倍（${vr>=1.4?'放量':vr<=0.75?'缩量':'温和'}）——${vr>=1.4?'有真金白银推动；若在高位，要防放量出货':vr<=0.75?'参与冷清：涨则持续性存疑，跌则抛压不算重':'量能中性，信号还需确认'}`);
  }
  const seg=bars.slice(Math.max(0,idx-19),idx+1);
  let hi=-Infinity,lo=Infinity;
  seg.forEach(x=>{hi=Math.max(hi,x.h);lo=Math.min(lo,x.l);});
  if(hi>lo){
    const pr=(b.c-lo)/(hi-lo);
    L.push(`位置：近20日区间的 ${Math.round(pr*100)}% 分位——${pr>=0.8?'高位：追高性价比低，警惕冲高回落':pr<=0.2?'低位：下跌动能衰竭区，但「便宜」不是买入理由，等企稳信号':'中部：上下都有空间，看量能与关键位指引'}`);
  }
  const body=Math.abs(b.c-b.o),range=b.h-b.l;
  if(range>1e-9){
    const upW=b.h-Math.max(b.o,b.c),dnW=Math.min(b.o,b.c)-b.l;
    if(body/range<0.12)L.push('形态：十字星——多空拉锯，常见于转折或中继，等次日方向确认');
    else if(upW>body*2&&body/range<0.45)L.push('形态：长上影——上方抛压重，冲高遇阻');
    else if(dnW>body*2&&body/range<0.45)L.push('形态：长下影——下方有承接，探底遇到买盘');
    else if(b.c>=b.o&&body/range>0.7)L.push('形态：光头大阳线——买方完胜，看次日能否放量延续');
    else if(b.c<b.o&&body/range>0.7)L.push('形态：光头大阴线——卖方完胜，观察是否跌破关键支撑');
  }
  return L;
}

/* ---------- 标注层实例 ---------- */
class Mark{
  /* wrap: .chart-wrap DOM；chart: KChart 实例
     opts: {editable,ai,hideAfter,viewOnly,importMarks:{strokes,pins}} */
  constructor(wrap,chart,opts){
    this.chart=chart;this.wrap=wrap;
    this.o=Object.assign({editable:true,ai:true,hideAfter:null,viewOnly:false},opts||{});
    this.strokes=[];this.pins=[];this.ops=[];this.cur=null;this.mode='off';
    // 清掉同卡片里旧标注层的残留（实验室换股重挂时防重复）
    $$('.mark-layer',wrap).forEach(x=>x.remove());
    const card=wrap.parentNode;
    $$('.mark-tools,.mark-reads,.mark-bubble',card).forEach(x=>x.remove());
    // 覆盖层画布
    const cv=document.createElement('canvas');
    cv.className='mark-layer';
    wrap.appendChild(cv);
    this.cv=cv;this.cv.style.pointerEvents='none';
    this._bindPen();
    this._sync();
    // 工具条 + 点读列表
    if(this.o.editable&&!this.o.viewOnly){
      wrap.insertAdjacentHTML('afterend',`<div class="chart-tools mark-tools">
        <span class="ctg" data-m="pen">✏️ 画笔标注</span>
        <span class="ctg" data-m="ai">🔍 AI点读</span>
        <span class="ctg on" data-m="off">🖱️ 浏览</span>
        <span class="ctg" data-a="undo">↩️ 撤销</span>
        <span class="ctg" data-a="clear">🗑️ 清空</span>
        <span class="t2" style="font-size:.62rem;align-self:center">画笔=画出你的预测 · 点读=看任意K线解读（不剧透未来）</span></div>`);
      $$('.ctg',$('.mark-tools',card)).forEach(t=>t.addEventListener('click',()=>{
        const m=t.dataset.m,a=t.dataset.a;
        if(m)this.setMode(m);
        else if(a==='undo')this.undo();
        else if(a==='clear')this.clearAll();
      }));
      this.readBox=document.createElement('div');
      this.readBox.className='mark-reads';
      const tools=$('.mark-tools',card);
      if(tools)tools.insertAdjacentElement('afterend',this.readBox);
    }
    // 导入（答后对照）
    if(this.o.importMarks)this.importMarks(this.o.importMarks);
    // 图表钩子
    chart.o.onRender=()=>this.redraw();
    if(this.o.ai&&!this.o.viewOnly)chart.o.onTap=(x,y)=>this.onTap(x,y);
    this.redraw();
  }
  _sync(){
    const d=this.chart._dim;
    if(!d)return;
    const dpr=window.devicePixelRatio||1;
    this.cv.width=Math.round(d.w*dpr);this.cv.height=Math.round(d.h*dpr);
    this.cv.style.height=d.h+'px';
    this.ctx=this.cv.getContext('2d');
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.dim=d;
  }
  setMode(m){
    this.mode=m;
    this.cv.style.pointerEvents=(m==='pen')?'auto':'none';
    const tools=$('.mark-tools',this.wrap.parentNode);
    if(tools)$$('.ctg[data-m]',tools).forEach(t=>t.classList.toggle('on',t.dataset.m===m));
    $$('.mark-bubble',this.wrap).forEach(x=>x.remove());
    if(m!=='pen')this.cur=null;
    this.redraw();
  }
  /* ---- 坐标换算 ---- */
  _xOf(i){ const m=this.chart._map; return m?m.X(i):0; }
  _yOf(p){ const m=this.chart._map; return m?m.Y(p):0; }
  _iAt(x){ const m=this.chart._map; return m?m.i0+x/m.cw-0.5:0; }
  _pAt(y){ const m=this.chart._map;
    if(!m)return 0;
    return m.lo+(m.priceH-(y-7))/(m.priceH-14)*(m.hi-m.lo); }
  /* ---- 画笔 ---- */
  _bindPen(){
    let last=null;
    this.cv.addEventListener('pointerdown',e=>{
      if(this.mode!=='pen')return;
      this.cv.setPointerCapture(e.pointerId);
      const x=e.offsetX,y=e.offsetY;
      this.cur={pts:[{i:this._iAt(x),price:this._pAt(y),date:this._dateAt(x)}]};
      last={x,y};
      e.preventDefault();
    });
    this.cv.addEventListener('pointermove',e=>{
      if(this.mode!=='pen'||!this.cur)return;
      const x=e.offsetX,y=e.offsetY;
      if(last&&Math.abs(x-last.x)+Math.abs(y-last.y)<3)return;
      this.cur.pts.push({i:this._iAt(x),price:this._pAt(y),date:this._dateAt(x)});
      last={x,y};
      this.redraw();
    });
    const up=e=>{
      if(this.mode!=='pen'||!this.cur)return;
      if(this.cur.pts.length>1)this.ops.push({t:'stroke'});
      this.strokes.push(this.cur);
      this.cur=null;last=null;
      this.redraw();
    };
    this.cv.addEventListener('pointerup',up);
    this.cv.addEventListener('pointercancel',up);
  }
  _dateAt(x){
    const bars=this.chart.bars,m=this.chart._map;
    if(!bars||!m)return '';
    const i=clamp(Math.round(this._iAt(x)+0.5),0,bars.length-1);
    return bars[i]?bars[i].date:'';
  }
  /* ---- AI点读 ---- */
  onTap(x,y){
    const bars=this.chart.bars,m=this.chart._map;
    if(!bars||!m)return;
    const idx=clamp(Math.round(this._iAt(x)+0.5),0,bars.length-1);
    if(this.o.hideAfter!=null&&idx>this.o.hideAfter){
      toast('未来区域不可点读——先自己判断，揭晓后再对照');
      return;
    }
    const b=bars[idx];
    const pin={i:idx,date:b.date,price:this._pAt(y),n:this.pins.length+1};
    this.pins.push(pin);this.ops.push({t:'pin'});
    this._bubble(x,y,idx);
    this._addRead(idx,pin);
    this.redraw();
  }
  _bubble(x,y,idx){
    $$('.mark-bubble',this.wrap).forEach(x=>x.remove());
    const lines=readLines(this.chart.bars,idx);
    const d=document.createElement('div');
    d.className='mark-bubble';
    d.innerHTML=lines.slice(0,3).join('<br>');
    this.wrap.appendChild(d);
    const w=this.dim?this.dim.w:300;
    d.style.left=clamp(x+12,0,w-250)+'px';
    d.style.top=Math.max(6,Math.min(y-70,(this.dim?this.dim.h:300)-120))+'px';
    setTimeout(()=>{d.remove();},5000);
  }
  _addRead(idx,pin){
    if(!this.readBox)return;
    const lines=readLines(this.chart.bars,idx);
    const d=document.createElement('div');
    d.className='mark-read';
    d.innerHTML=`<div class="mr-h"><span class="chip gold">#${pin.n}</span><b>AI点读 · ${this.chart.bars[idx].date}</b>
      <span class="t2" style="font-size:.62rem;margin-left:auto;cursor:pointer" data-dismiss="1">收起</span></div>
      <div class="mr-b">${lines.join('<br>')}</div>`;
    this.readBox.insertBefore(d,this.readBox.firstChild);
    const t=$('.t2[data-dismiss]',d);
    if(t)t.addEventListener('click',()=>{const b=$('.mr-b',d);if(b)b.style.display=b.style.display==='none'?'':'none';});
    while(this.readBox.children.length>6)this.readBox.lastChild.remove();
  }
  /* ---- 撤销/清空/导入导出 ---- */
  undo(){
    const op=this.ops.pop();
    if(!op)return toast('没有可撤销的标注');
    if(op.t==='stroke')this.strokes.pop();
    else if(op.t==='pin')this.pins.pop();
    if(this.readBox&&this.readBox.firstChild)this.readBox.firstChild.remove();
    this.redraw();
  }
  clearAll(){
    this.strokes=[];this.pins=[];this.ops=[];
    if(this.readBox)this.readBox.innerHTML='';
    $$('.mark-bubble',this.wrap).forEach(x=>x.remove());
    this.redraw();
  }
  export(){ return {strokes:this.strokes,pins:this.pins}; }
  importMarks(marks){
    const bars=this.chart.bars;
    const byDate={};
    bars.forEach((b,i)=>{byDate[b.date]=i;});
    this.strokes=(marks.strokes||[]).map(s=>({
      pts:(s.pts||[]).map(p=>byDate[p.date]!=null?{i:byDate[p.date],price:p.price}:null).filter(Boolean)
    })).filter(s=>s.pts.length>1);
    this.pins=(marks.pins||[]).map(p=>byDate[p.date]!=null?{...p,i:byDate[p.date]}:null).filter(Boolean);
  }
  /* ---- 绘制 ---- */
  redraw(){
    this._sync();
    if(!this.ctx)return;
    const ctx=this.ctx,m=this.chart._map,d=this.dim;
    ctx.clearRect(0,0,d.w,d.h);
    if(!m)return;
    // 画笔笔迹
    const drawStroke=(pts,alpha)=>{
      if(pts.length<2)return;
      ctx.save();
      ctx.globalAlpha=alpha;
      ctx.strokeStyle=PEN_COLOR;ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.lineCap='round';
      if(this.chart.o.hideAfter!=null)ctx.setLineDash([]);
      ctx.beginPath();
      let started=false;
      pts.forEach(p=>{ const x=this._xOf(p.i),y=this._yOf(p.price);
        if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y); });
      ctx.stroke();
      ctx.restore();
    };
    this.strokes.forEach(s=>drawStroke(s.pts,0.9));
    if(this.cur)drawStroke(this.cur.pts,1);
    // 点读钉
    this.pins.forEach(p=>{
      const x=this._xOf(p.i),y=this._yOf(p.price);
      ctx.save();
      ctx.strokeStyle=PEN_COLOR;ctx.lineWidth=1.4;
      ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.stroke();
      ctx.fillStyle=PEN_COLOR;
      ctx.beginPath();ctx.arc(x,y,2.5,0,7);ctx.fill();
      ctx.font='bold 10px -apple-system,sans-serif';
      ctx.fillStyle=PEN_COLOR;ctx.textAlign='center';
      ctx.fillText('#'+p.n,x,y-12);
      ctx.restore();
    });
    // 画笔模式提示
    if(this.mode==='pen'){
      ctx.save();
      ctx.fillStyle='rgba(232,179,57,.14)';
      ctx.fillRect(0,0,d.w,22);
      ctx.fillStyle=PEN_COLOR;ctx.font='11px -apple-system,sans-serif';ctx.textAlign='center';
      ctx.fillText('✏️ 画笔模式：直接在图上画出你的预测（平移/缩放暂停，切回浏览恢复）',d.w/2,15);
      ctx.restore();
    }
  }
}

return {Mount:(wrap,chart,opts)=>new Mark(wrap,chart,opts),readLines};
})();

</script>

<script>/* ==== 24-coach.js ==== */
'use strict';
/* ================= 思路教练：每道训练题的「思路会话框」 =================
   答题前：用户把看盘思路/策略写成文字 → 本地规则引擎点评（要素盘点+教练追问）。
   答题后：生成「数据判断依据 × 你的思路」对照复盘（哪条判断与数据一致/不符）。
   随时：一键复制整卡，粘贴给 AI（AionUi/Claude 等）做深度点评。
   红线：答前点评只读用户文本、绝不读行情数据——不剧透答案；全部输出为学习视角，
        不荐股、不给买卖指令、不预测个股涨跌。 */
const COACH=(()=>{

/* ---------- 维度词典（只分析用户写了什么，不含任何行情数据） ---------- */
const DIMS={
 trend:{n:'趋势均线',icon:'📈',kws:/均线|MA\s?[0-9一二三四五六]|五日|十日|二十日|六十日|多头排列|空头排列|趋势|站上|站稳|回踩|金叉|死叉|成本线|乖离|方向/,

 pos:{n:'位置关键位',icon:'📐',kws:/支撑|压力|阻力|前高|前低|平台|箱体|区间|突破|破位|新高|新低|关键位|颈线|套牢|高位|低位|上沿|下沿/,

 shape:{n:'K线形态',icon:'🕯️',kws:/形态|十字星|锤子|长阴|长阳|大阳|大阴|上影|下影|吞没|启明|乌云|跳空|缺口|阳线|阴线/,

 sent:{n:'市场情绪',icon:'🌡️',kws:/情绪|涨停|跌停|炸板|连板|冰点|回暖|高潮|退潮|赚钱效应|亏钱效应|大盘|指数|市场环境|人气|普涨|普跌/,
   why:'个股走不出大盘：情绪阶段决定同一技术信号的胜率（第5关第1课）',

 ind:{n:'技术指标',icon:'🧮',kws:/MACD|KDJ|RSI|BOLL|布林|零轴|背离|超买|超卖|指标|DIF|DEA/,
   why:'指标是价格的二次加工，用来确认趋势而不是预测涨跌（第6关第2课）',
   ask:'指标确认了吗？MACD的DIF在零轴上方还是下方？有没有背离？'},
 fund:{n:'资金筹码',icon:'💰',kws:/资金|主力|庄|北向|流入|流出|承接|抛压|套牢盘|获利盘|筹码|出货|吸筹/,
   why:'价格背后是买卖力量：谁在买、谁在卖、谁被套（第3关第7课）',
   ask:'这个位置获利盘和套牢盘谁多？反弹时解套抛压大不大？'},
 plan:{n:'策略预案',icon:'🛡️',kws:/止损|止盈|仓位|轻仓|重仓|半仓|试仓|如果|若是|假如|一旦|否则|失效|确认|预案|计划|应对|减仓|离场|观察|条件/,
   why:'判断≠交易：写下「什么信号出现说明我错了、错了怎么办」才是完整策略（第8关第3课）',
   ask:'预案呢？什么信号出现说明你错了？错了是止损离场还是先减仓观察？'},
};
/* 各模式的要素配置：core=核心要素（缺了会点名） nice=加分要素 plan=要求有预案
   frame=本题判断依据框架（只给框架不给数据，防剧透） */
const MODE_COACH={
 A:{n:'看图猜明天',core:['trend','vol'],nice:['pos','shape','sent','ind','fund'],plan:true,frame:'均线方向 → 量价关系 → 换手率 → 量比'},
 B1:{n:'支撑压力判断',core:['trend','pos','vol'],nice:['shape','fund','sent'],plan:false,frame:'趋势方向 → 关键位性质 → 量能确认'},
 B2:{n:'排列应对',core:['trend'],nice:['vol','sent','fund'],plan:true,frame:'排列识别 → 趋势交易原则 → 应对动作'},
 B3:{n:'指标判断',core:['ind','trend'],nice:['vol','fund'],plan:false,frame:'DIF与零轴位置 → 多空环境含义'},
 C:{n:'情绪推断',core:['sent','vol'],nice:['trend','pos','fund'],plan:false,frame:'涨跌家数 → 涨停跌停对比 → 炸板率 → 成交额'},
 D:{n:'量价关系',core:['vol','trend'],nice:['pos','shape','fund'],plan:false,frame:'价的方向 × 量的相对倍数'},
 E:{n:'今日复盘小测',core:['sent'],nice:['vol','trend','pos'],plan:false,frame:'涨跌家数 → 涨跌停 → 炸板率 → 成交额'},
 trade:{n:'模拟盘交易计划',core:['trend','vol','plan'],nice:['pos','sent','fund','shape','ind'],plan:true,frame:'方向依据 → 量能/位置确认 → 止损与仓位 → 失效条件'},
};
const COMBOS=['放量上涨','放量下跌','缩量上涨','缩量回调','量价平稳'];

/* ---------- 每题状态（换题即重置） ---------- */
let st={mode:'A',title:'',text:'',rounds:0,ok:null,gain:0,explainPlain:''};

/* ---------- 思路分析（纯文本，答前答后通用） ---------- */
function analyze(mode,text){
  const cfg=MODE_COACH[mode]||MODE_COACH.A;
  const t=(text||'').trim();
  const hits={}; for(const k in DIMS)hits[k]=DIMS[k].kws.test(t);
  const hedges=(t.match(/我觉得|感觉|直觉|应该会|肯定会|大概|也许|好像|估计|盲猜|蒙一个/g)||[]).length;
  return {mode,cfg,t,hits,hedges,
    coreGot:cfg.core.filter(k=>hits[k]),coreMiss:cfg.core.filter(k=>!hits[k]),
    niceGot:cfg.nice.filter(k=>hits[k]),hasPlan:hits.plan,
    bothDir:/看涨|看多|多头排列|趋势向上/.test(t)&&/看跌|看空|空头排列|趋势向下/.test(t)};
}
/* 方向/量能等「可对答案的宣称」。预案子句（若/如果之后）不算主判断 */
function claimsOf(t){
  const main=(t||'').split(/若|如果|一旦|否则|假如|要是|万一/)[0]||'';
  return {
    bull:/看涨|看多|做多|多头排列|趋势向上|向多/.test(main),
    bear:/看跌|看空|做空|空头排列|趋势向下|向空/.test(main),
    heavy:/放量|倍量|天量|堆量|量能大/.test(main),
    light:/缩量|地量|量能萎缩/.test(main),
    high:/高位|新高|上沿|顶部/.test(main),
    low:/低位|新低|下沿|底部/.test(main),
    support:/支撑/.test(main),resist:/压力|阻力/.test(main),
    stages:{ice:/冰点/.test(main),warm:/回暖/.test(main),hot:/高潮|过热/.test(main),ebb:/退潮|降温/.test(main)},
    difUp:/零轴上方|零轴上[^方]|DIF[^。]{0,6}上方|白线[^。]{0,6}上方/.test(main),
    difDown:/零轴下方|零轴下[^方]|DIF[^。]{0,6}下方|白线[^。]{0,6}下方/.test(main),
    plan:DIMS.plan.kws.test(t||''),
  };
}

/* ---------- 答前点评卡片 ---------- */
function feedbackHtml(r){
  const t=r.t;
  if(!t)return `<div class="coach-sec">还没写。先别急着点选项——把你看到的第一反应写下来，教练帮你把「直觉」变成「有依据的判断」。按这个骨架写：
    <br><span class="num">方向：看涨/看跌/横盘 ｜ 依据：哪个信号 ｜ 量能：放量还是缩量 ｜ 位置：高位/低位/关键位 ｜ 预案：什么情况认错、怎么走</span></div>
    <div class="t2" style="font-size:.66rem;margin-top:8px">本题判断依据框架：${esc(r.cfg.frame)}</div>`;
  const chip=(k,cls)=>`<span class="cchip ${cls}">${DIMS[k].icon} ${DIMS[k].n}${cls==='hit'?' ✓':cls==='miss'?' ?':''}</span>`;
  const chips=[
    ...r.cfg.core.map(k=>chip(k,r.hits[k]?'hit':'miss')),
    ...r.niceGot.map(k=>chip(k,'nice')),
    r.cfg.core.includes('plan')?'':chip('plan',r.hasPlan?'hit':'miss'),
  ].join('');
  const lines=[];
  if(t.length<10)lines.push('写得太短——至少说清三件事：<b>依据什么信号 → 得出什么方向 → 什么情况认错</b>。');
  if(r.hedges>0)lines.push(`出现 ${r.hedges} 处「我觉得/感觉/应该」——把直觉词换成数据词，例如「<b>因为</b>近3天温和放量+站上MA5，<b>所以</b>短线偏强」。说得清依据，复盘才对得出对错。`);
  if(r.bothDir)lines.push('思路里「看涨」和「看跌」的理由同时出现——赛前把方向说唯一；反面情况写成「若…则认错」的预案，而不是并列两个理由。');
  if(r.coreMiss.length){
    const m0=r.coreMiss[0];
    lines.push(`还缺核心要素：<b>${r.coreMiss.map(k=>DIMS[k].n).join('、')}</b>。${DIMS[m0].why}`);
  } else if(!r.hasPlan&&r.cfg.plan&&!r.cfg.core.includes('plan')){
    lines.push(`核心要素齐了，但缺<b>策略预案</b>。${DIMS.plan.why}`);
  }
  if(r.coreGot.length===1&&r.coreMiss.length>0&&r.niceGot.length===0)lines.push('目前主要靠单一信号——单一信号容易被骗。趋势×量能×位置三重共振，判断的胜率才高。');
  if(r.coreGot.length>=2&&r.niceGot.length>=1&&r.hasPlan)lines.push('<b class="gold">结构完整：方向+证据+预案都在</b>——这就是第9关实战要求的交易计划骨架，保持这个习惯。');
  const qs=[];
  if(r.coreMiss.length)qs.push(DIMS[r.coreMiss[0]].ask);
  if(r.coreMiss.length>1)qs.push(DIMS[r.coreMiss[1]].ask);
  if(!r.hasPlan&&r.cfg.plan)qs.push(DIMS.plan.ask);
  return `<div class="coach-chips">${chips}</div>
    <div class="coach-sec"><span class="k">覆盖度</span>核心 ${r.coreGot.length}/${r.cfg.core.length} · 加分 ${r.niceGot.length}/${r.cfg.nice.length} · 预案 ${r.hasPlan?'✓':'✗'}${r.rounds>1?` · 第${r.rounds}轮点评`:''}</div>
    ${lines.length?`<div class="coach-sec"><span class="k">教练点评</span>${lines.join('<br>')}</div>`
      :'<div class="coach-sec">要素齐全、结构清楚——带着这份思路去作答，答完看「对照复盘」验证它。</div>'}
    ${qs.length?`<div class="coach-q">❓ 教练追问<br>${qs.map((q,i)=>`${i+1}. ${esc(q)}`).join('<br>')}</div>`:''}
    <div class="t2" style="font-size:.66rem;margin-top:8px">判断依据框架：${esc(r.cfg.frame)} ｜ 改完可再点「教练点评」多轮打磨；写好了就到下方作答。</div>`;
}

/* ---------- 卡片渲染与绑定 ---------- */
function cardHtml(compact){
  return `<div class="card coach-card" id="coachCard">
    <div class="coach-head"><b>💬 我的看盘思路与策略</b><span class="chip gold">答前先写 · 不剧透答案</span></div>
    <div class="t2" style="font-size:.7rem">${compact?'把你的推理写一句再作答：':'把判断依据和应对计划写下来 → 点「教练点评」检查要素 → 再作答。点评只帮你想清楚，绝不透露方向。'}</div>
    <textarea class="coach-input" id="coachInput" rows="${compact?3:4}" placeholder="例：站上MA5多头排列趋势向上，近3天温和放量突破平台，回踩缩量不破MA5可关注；若放量跌破MA5则思路失效、止损离场"></textarea>
    <div class="row wrap" style="margin-top:8px">
      <button class="btn small" id="coachGo">🧠 教练点评思路</button>
      <button class="btn gray small" id="coachAIPre">🤖 复制给AI教练</button>
      <button class="btn gray small" id="coachFold">收起</button>
      <span class="t2 num" style="font-size:.66rem;align-self:center" id="coachRound"></span></div>
    <div id="coachOut"></div></div>`;
}
function bindCard(mode,title,prefill){
  st={mode:mode||'A',title:title||'',text:prefill||'',rounds:0,ok:null,gain:0,explainPlain:''};
  const ta=$('#coachInput'); if(!ta)return;
  if(st.text)ta.value=st.text;
  ta.addEventListener('input',()=>{st.text=ta.value;});
  $('#coachGo').addEventListener('click',doCoach);
  $('#coachFold').addEventListener('click',foldCard);
  $('#coachAIPre').addEventListener('click',()=>copyOut(exportText('pre'),'pre'));
}
function mountTrain(mode,title){
  const box=$('#coachBox'); if(!box)return;
  box.innerHTML=cardHtml(false);
  bindCard(mode,title);
}
function mountQuiz(cfg,q,container){
  container=container||document;
  bindCard((cfg&&cfg.mode)||'E',(q&&q.q)||'',null);
}
function doCoach(){
  const ta=$('#coachInput'); const t=ta?ta.value.trim():'';
  st.text=t; st.rounds++;
  const r=analyze(st.mode,t); r.rounds=st.rounds;
  const round=$('#coachRound'); if(round)round.textContent=st.rounds>1?`第${st.rounds}轮`:'';
  const out=$('#coachOut');
  if(out){ out.innerHTML=feedbackHtml(r); if(out.scrollIntoView)out.scrollIntoView({behavior:'smooth',block:'nearest'}); }
}
function foldCard(){
  const ta=$('#coachInput'); if(ta)st.text=ta.value;
  const card=$('#coachCard'); if(!card)return;
  card.innerHTML=`<div class="coach-head" id="coachUnfold" style="cursor:pointer"><b>💬 我的看盘思路与策略</b>
    <span class="t2" style="font-size:.7rem">${st.text?('已写 '+st.text.length+' 字 · 点击展开'):'未写思路 · 点击展开（建议先写再答）'}</span></div>`;
  const un=$('#coachUnfold');
  if(un)un.addEventListener('click',()=>mountTrain(st.mode,st.title,st.text));
}
function takeText(){
  const ta=$('#coachInput'); const t=ta?ta.value.trim():'';
  if(t)st.text=t;
  return st.text||'';
}
/* 答题后：记录结果并生成对照复盘 */
function arm(o){ Object.assign(st,o,{stage:'post'}); }
function quizAnswer(q,right,container){
  const ta=$('.coach-input',container||document);
  const t=ta?ta.value.trim():'';
  st.text=t; st.ok=right; st.gain=0; st.stage='post';
  st.title=plainify((q&&q.q)||'').slice(0,60);
  st.explainPlain=plainify((q&&q.e)||'');
  const out=$('#coachOut',container||document);
  if(!out)return;
  const r=analyze(st.mode,t); r.rounds=st.rounds;
  out.innerHTML=feedbackHtml(r)+reviewBlockHtml();
  bindExport();
}

/* ---------- 答后：数据判断依据（只在此刻读行情数据） ---------- */
function factsOf(mode){
  try{
    if(mode==='A')return factsA();
    if(mode==='B1')return factsB1();
    if(mode==='B2')return factsB2();
    if(mode==='B3')return factsB3();
    if(mode==='C')return factsC();
    if(mode==='D')return factsD();
  }catch(e){}
  return [];
}
function factsA(){
  const a=window._a; if(!a)return [];
  const cut=a.cut,m5=maOf(a.bars,5),m10=maOf(a.bars,10),m20=maOf(a.bars,20),v5=volMa(a.bars,5);
  const bull=m5[cut]>m10[cut]&&m10[cut]>m20[cut],bear=m5[cut]<m10[cut]&&m10[cut]<m20[cut];
  const vr=v5[cut-1]?a.bars[cut].v/v5[cut-1]:1;
  const vp=classifyVolPrice(a.bars,cut);
  const seg=a.bars.slice(Math.max(0,cut-19),cut+1);
  let hi=-Infinity,lo=Infinity;
  seg.forEach(b=>{hi=Math.max(hi,b.h);lo=Math.min(lo,b.l);});
  const pr=hi>lo?(a.bars[cut].c-lo)/(hi-lo):0.5;
  return [
    {dim:'trend',k:bull?'bull':bear?'bear':'mixed',label:`MA5=${m5[cut].toFixed(2)} MA10=${m10[cut].toFixed(2)} MA20=${m20[cut].toFixed(2)} → ${bull?'多头排列':bear?'空头排列':'均线纠缠'}`},
    {dim:'vol',k:vr>=1.4?'heavy':vr<=0.75?'light':'mid',label:`当日量能为5日均量${vr.toFixed(2)}倍（${vp.n}）· 换手率${a.bars[cut].turn!=null?a.bars[cut].turn+'%':'--'}`},
    {dim:'pos',k:pr>=0.8?'high':pr<=0.2?'low':'mid',label:`收盘价位于近20日区间 ${lo.toFixed(2)}~${hi.toFixed(2)} 的 ${Math.round(pr*100)}% 分位`},
    {dim:'sent',k:null,label:'本题为个股题，市场情绪维度不参与判定'},
  ];
}
function factsB1(){
  const b=window._b; if(!b)return [];
  return [
    {dim:'trend',k:b.trendUp?'bull':'bear',label:`近5日均线呈${b.trendUp?'多头':'空头'}排列 → 趋势${b.trendUp?'向上':'向下'}`},
    {dim:'pos',k:b.trendUp?'support':'resist',label:`本题考点：趋势${b.trendUp?'向上':'向下'}时，回踩/反弹到均线，MA5更可能构成${b.trendUp?'支撑':'压力'}位`},
    {dim:'vol',k:b.vr>=1.4?'heavy':b.vr<=0.75?'light':'mid',label:`当日量能为5日均量${(b.vr||1).toFixed(2)}倍（${b.vr>=1.4?'放量':b.vr<=0.75?'缩量':'温和'}）`},
  ];
}
function factsB2(){
  const b=window._b; if(!b)return [];
  return [
    {dim:'trend',k:b.bull?'bull':'bear',label:`MA5/MA10/MA20 呈${b.bull?'多头':'空头'}排列`},
    {dim:'plan',k:null,label:`考点：${b.bull?'顺势而为——持股或回踩关注，不逆势':'不接飞刀——等排列修复、放量企稳再考虑'}`},
  ];
}
function factsB3(){
  const b=window._b; if(!b)return [];
  return [
    {dim:'ind',k:b.above?'above':'below',label:`DIF=${(b.dif||0).toFixed(3)}，位于零轴${b.above?'上方（短期均势偏多）':'下方（短期均势偏空）'}`},
    {dim:'trend',k:null,label:'零轴是多空环境分界线：零轴上的金叉更可信，零轴下的死叉更危险（第6关第2课）'},
  ];
}
function factsC(){
  const c=window._c; if(!c)return [];
  const s=c.st;
  const ud=s.up>s.dn*2?'普涨':s.dn>s.up*2?'普跌':'分化';
  return [
    {dim:'sent',k:c.truth,label:`本题答案：${STAGE_META[c.truth].n}｜涨跌比 ${s.up}:${s.dn}（${ud}）· 涨停${s.zt}/跌停${s.dt} · 炸板率${Math.round(s.zb*100)}%`},
    {dim:'vol',k:null,label:`两市成交额 ${fmtAmt(s.amount)}（单日数据无基线，量能宣称无法判定）`},
  ];
}
function factsD(){
  const d=window._d; if(!d)return [];
  const b=d.bars[d.cut],v5=volMa(d.bars,5);
  const vr=v5[d.cut-1]?b.v/v5[d.cut-1]:1;
  const pct=b.pct!=null?b.pct:(d.bars[d.cut-1]?(b.c/d.bars[d.cut-1].c-1)*100:0);
  return [
    {dim:'vol',k:d.truth,combo:true,label:`本题答案：${d.truth}｜当日涨跌 ${fmtPct(pct)} · 量比5日均量 ${vr.toFixed(2)}倍 · 换手率${b.turn!=null?b.turn+'%':'--'}`},
    {dim:'pos',k:null,label:'量价组合要结合位置：高位放量上涨要防出货，低位缩量回调反而是洗盘特征（第3关第5课）'},
  ];
}

/* ---------- 宣称 × 数据 对照 ---------- */
function stanceOf(dim,cl){
  if(dim==='trend')return{bull:cl.bull,bear:cl.bear};
  if(dim==='vol')return{heavy:cl.heavy,light:cl.light};
  if(dim==='pos')return{support:cl.support,resist:cl.resist,high:cl.high,low:cl.low};
  if(dim==='sent')return{list:['ice','warm','hot','ebb'].filter(k=>cl.stages[k])};
  if(dim==='ind')return{difUp:cl.difUp,difDown:cl.difDown};
  return null;
}
function verdictFor(f,cl,t){
  if(f.dim==='plan')return{plan:true};
  if(f.combo){
    const cs=COMBOS.filter(w=>t.indexOf(w)>=0);
    if(cs.length===1)return{claimed:true,label:cs[0],match:f.k===cs[0],soft:true};
    if(cs.length>1)return{claimed:true,label:'多种量价组合并列',match:null,conflict:true};
    return{claimed:false};
  }
  if(f.k==null)return{claimed:false};
  const s=stanceOf(f.dim,cl);
  if(!s)return{claimed:false};
  const both=(a,b)=>a&&b;
  if(f.dim==='trend'){
    if(both(s.bull,s.bear))return{claimed:true,label:'方向正反都写了',match:null,conflict:true};
    if(s.bull)return{claimed:true,label:'趋势向多',match:f.k==='bull',soft:true};
    if(s.bear)return{claimed:true,label:'趋势向空',match:f.k==='bear',soft:true};
  } else if(f.dim==='vol'){
    if(both(s.heavy,s.light))return{claimed:true,label:'放量与缩量两种情景都写了',match:null,conflict:true};
    if(s.heavy)return{claimed:true,label:'放量',match:f.k==='heavy',soft:true};
    if(s.light)return{claimed:true,label:'缩量',match:f.k==='light',soft:true};
  } else if(f.dim==='pos'){
    if(f.k==='support'||f.k==='resist'){
      if(both(s.support,s.resist))return{claimed:true,label:'支撑压力都写了',match:null,conflict:true};
      if(s.support)return{claimed:true,label:'支撑位',match:f.k==='support',soft:true};
      if(s.resist)return{claimed:true,label:'压力位',match:f.k==='resist',soft:true};
    } else if(s.high||s.low){
      if(both(s.high,s.low))return{claimed:true,label:'高低位都写了',match:null,conflict:true};
      return{claimed:true,label:s.high?'处于高位':'处于低位',match:s.high?f.k==='high':f.k==='low',soft:true};
    }
  } else if(f.dim==='sent'){
    if(s.list.length===1)return{claimed:true,label:STAGE_META[s.list[0]].n,match:f.k===s.list[0],soft:true};
    if(s.list.length>1)return{claimed:true,label:'几个阶段都写了',match:null,conflict:true};
  } else if(f.dim==='ind'){
    if(both(s.difUp,s.difDown))return{claimed:true,label:'零轴上下都写了',match:null,conflict:true};
    if(s.difUp)return{claimed:true,label:'DIF在零轴上方',match:f.k==='above',soft:true};
    if(s.difDown)return{claimed:true,label:'DIF在零轴下方',match:f.k==='below',soft:true};
  }
  return{claimed:false};
}
function rowHtml(f,cl,t){
  const dim=DIMS[f.dim]||{n:f.dim,kws:/$^/,ask:''};
  if(f.dim==='plan'){
    return `<div class="cr-row"><span class="cr-ico">${cl.plan?'✅':'➖'}</span><div style="flex:1"><b>策略预案</b>｜${cl.plan
      ?'你写了预案（止损/失效/仓位条件）——判断有了「认错开关」，这是策略和赌博的分界线（第8关第3课）'
      :'这题没写预案——「如果错了怎么办」没想清楚，判断坚持不住、错误离场不及时（第8关第3课）'}</div></div>`;
  }
  const v=verdictFor(f,cl,t);
  const mentioned=dim.kws.test(t);
  const ico=v.claimed?(v.conflict?'❔':v.match?'✅':'❌'):(mentioned?'📝':'➖');
  let line=`<b>${esc(dim.n)}</b>｜${f.label}`;
  if(v.claimed){
    if(v.conflict)line+=`<br><span class="t2">↳ 你写的是「${esc(v.label)}」，没法唯一对答案——${f.dim==='vol'?'若「放量」指当下、「缩量」指回踩情景，下次分开写：「当下放量X倍；若回踩，看是否缩量」':'把主方向写唯一，反面放进预案'}</span>`;
    else if(v.match===true)line+=`<br><span class="down">↳ 你写「${esc(v.label)}」：与数据一致 ✓</span>`;
    else if(v.match===false)line+=`<br><span class="up">↳ 你写「${esc(v.label)}」：与数据不一致 ✗（若这是预案里的假设句，不算判断错误）</span>`;
    else line+=`<br><span class="t2">↳ 思路里提到了它，但没有可对答案的明确判断</span>`;
  } else if(mentioned){
    line+=`<br><span class="t2">↳ 思路提到了${esc(dim.n)}，但没给出可对答案的明确判断</span>`;
  } else {
    line+=`<br><span class="t2">↳ 思路未提及该维度${dim.ask?'：'+esc(dim.ask):''}</span>`;
  }
  return `<div class="cr-row"><span class="cr-ico">${ico}</span><div style="flex:1">${line}</div></div>`;
}
function guideLines(ok,t,cl){
  const g=[];
  if(!t){
    g.push('下一题建议：先花30秒写思路再作答——写不出来=其实没想清楚，这正是训练的价值。');
    g.push('骨架模板：方向 → 依据（哪个信号）→ 量能 → 位置 → 预案（何时认错）。');
    return g;
  }
  if(ok){
    g.push('对照上面逐条看：对，要对着「依据」对——是哪条证据让你对了？把它写成一句话存进今天的复盘日记，下次复用。');
    if(!cl.plan)g.push('这次判断对了，但没写预案——靠运气对的一次，下次可能靠运气亏回去。预案是判断的「认错开关」（第8关第3课）。');
    else g.push('有依据、有预案的判断，对一次就积累一次可复用的经验——盘感就是这么攒出来的。');
  } else {
    g.push('答错先归因：对照数据逐条看——是方向看反了，还是信号对但量能/位置维度出卖了你？把错的那条抄进今天的复盘日记。');
    if(!cl.plan)g.push('没有预案的判断，错了容易扛——先补上「什么信号出现就认错」，再练下一题（第8关第3课）。');
    else g.push('有预案但这次错了——检查是预案条件定得太松还是没执行；错而守纪，好过对而侥幸。');
  }
  g.push('想获得更深的点评：点「复制本题给AI教练」，把整卡贴进 AI 对话即可。');
  return g;
}
/* 参考解答：教练按本题数据写的一份「标准思路」（答后才展示，答前绝不出现在页面） */
function modelThought(mode){
  const f=factsOf(mode);
  if(!f.length)return '';
  const get=d=>f.find(x=>x.dim===d);
  const t=get('trend'),v=get('vol'),p=get('pos'),s=get('sent');
  const parts=[];
  if(s&&s.k&&STAGE_META[s.k])parts.push('方向（市场）：判断当前处于'+STAGE_META[s.k].n+'——涨跌家数比、涨停跌停结构与炸板率都指向这一阶段，个股操作要跟随这个大环境。');
  else if(t&&t.k)parts.push('方向：'+(t.k==='bull'?'趋势向上（均线多头排列），短线结构偏强，顺势思路为主':t.k==='bear'?'趋势向下（均线空头排列），反弹面对解套抛压，不轻易接':'均线纠缠，方向未选择——先观望，等均线给出方向'));
  if(v&&v.k&&v.k!=='mid')parts.push('量能：'+(v.k==='heavy'?'放量——信号有真金白银确认，但位置高时要防出货':'缩量——参与度低，上涨持续性存疑、回调抛压不大，可靠性要打折')+'。');
  else if(v)parts.push('量能：'+v.label.split('·')[0]+'——量能中性，等待量能给方向。');
  if(p&&p.k)parts.push('位置：'+p.label+'——'+(p.k==='high'||p.k==='resist'?'位置偏高/承压，追高的性价比低，等回踩':'位置偏低/有承接，但「便宜」不是买入理由，等企稳信号'));
  else if(p)parts.push('位置：'+p.label);
  parts.push('预案：'+(s&&s.k?'若明日炸板率明显升高、跌停增多（阶段切换信号），则按新阶段重新评估，不和市场争辩。':'若价格放量跌破MA5/关键支撑，或出现量价背离，则本思路失效——先离场观望，再等新信号。'));
  return parts.map(x=>'· '+x).join('\n');
}
function reviewBlockHtml(){
  const ok=st.ok,t=st.text||'';
  const cl=claimsOf(t);
  const facts=factsOf(st.mode);
  const rows=facts.map(f=>rowHtml(f,cl,t)).join('');
  return `<div class="coach-review" id="coachReview">
    <div class="cr-head">🧠 思路教练 · 对照复盘 <span class="chip ${ok?'down':'up'}">${ok?'判断正确':'判断错误'}</span></div>
    ${t?`<div class="cr-quote"><span class="k">你的思路（原文）</span><div class="cr-quote-body">${esc(t)}</div></div>`
       :`<div class="cr-quote miss"><span class="k">这题没写思路</span>下一题先写再答——答错不可怕，可怕的是分不清错在「依据」还是「执行」。</div>`}
    ${rows?`<div class="cr-rows">${rows}</div>`:''}
    ${modelThought(st.mode)?`<details class="cr-model"><summary>📖 参考解答：教练按本题数据会这样写思路</summary><pre>${esc(modelThought(st.mode))}</pre></details>`:''}
    <div class="cr-guide">${guideLines(ok,t,cl).map(esc).join('<br>')}</div>
    <div class="row wrap" style="margin-top:10px">
      <button class="btn gray small" id="coachExport">🤖 复制本题给AI教练</button>
      <span class="t2" style="font-size:.62rem;align-self:center">点评仅供训练复盘 · 不构成投资建议</span></div></div>`;
}

/* ---------- 一键复制给 AI ---------- */
function plainify(html){
  if(!html)return '';
  const d=document.createElement('div');
  d.innerHTML=String(html).replace(/<br\s*\/?>/gi,'\n');
  return (d.textContent||'').replace(/[ \t]+/g,' ').trim();
}
function exportText(stage){
  const now=new Date();
  const cfg=MODE_COACH[st.mode]||MODE_COACH.A;
  const title=st.title||window._lastTitle||'';
  const L=[];
  L.push('【盘感训练营 · 思路教练转介单】');
  L.push('时间：'+todayStr()+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'));
  L.push('模式：'+st.mode+' '+cfg.n);
  if(title)L.push('题目：'+title);
  if(stage==='post')L.push('我的作答：'+(st.ok?'判断正确':'判断错误')+(st.gain?'（+'+st.gain+'分）':''));
  else L.push('状态：尚未作答——请引导我完善思路，不要直接说出方向或答案。');
  L.push('');
  L.push('【我写的看盘思路与策略】');
  L.push(st.text||'（没写——请先引导我补全：方向→依据→量能→位置→预案）');
  const r=analyze(st.mode,st.text);
  L.push('');
  L.push('【本地教练要素盘点】');
  L.push('核心：'+r.cfg.core.map(k=>DIMS[k].n+(r.hits[k]?'✓':'✗')).join('、')
    +'｜加分：'+(r.niceGot.length?r.niceGot.map(k=>DIMS[k].n).join('、'):'无')
    +'｜预案：'+(r.hasPlan?'✓':'✗'));
  const exPlain=st.explainPlain||plainify(window._lastExplain||'');
  if(stage==='post'&&exPlain){
    L.push('');
    L.push('【App给出的本题判断依据】');
    L.push(exPlain);
  }
  L.push('');
  L.push('【请AI教练这样帮我】');
  L.push('1) 对照判断依据，指出我思路里的认知盲区与逻辑漏洞；');
  L.push('2) 先用提问引导我自己想，再给结论（苏格拉底式）；');
  L.push('3) 只做学习视角点评：不荐股、不给买卖指令、不预测该股未来涨跌。');
  return L.join('\n');
}
async function copyOut(txt,tag){
  if(!txt)return toast('没有可复制的内容');
  let ok=false;
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(txt); ok=true; } }catch(e){}
  if(!ok){
    try{ const ta=document.createElement('textarea'); ta.value=txt;
      ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      ok=document.execCommand('copy'); ta.remove(); }catch(e){}
  }
  if(ok){ toast(tag==='pre'?'📋 已复制——去AI对话粘贴，让AI引导你完善思路':'📋 已复制整卡——去AI对话粘贴，获取深度点评'); return; }
  openSheet(`<h3>🤖 复制给AI教练</h3><div class="t2" style="font-size:.72rem;margin-bottom:6px">自动复制失败，请全选下方文字手动复制</div>
    <textarea id="coachCopyTa" style="min-height:180px">${esc(txt)}</textarea>
    <button class="btn block" style="margin-top:10px" onclick="coachCopySel()">全选并复制</button>`);
}
window.coachCopySel=function(){
  const ta=$('#coachCopyTa'); if(!ta)return;
  ta.focus(); ta.select();
  let ok=false; try{ok=document.execCommand('copy');}catch(e){}
  toast(ok?'已复制':'请手动长按复制');
};
function bindExport(){
  const b=$('#coachExport');
  if(b)b.addEventListener('click',()=>copyOut(exportText('post'),'post'));
}
/* 模拟盘交易计划的点评（不拦截提交） */
window.coachTradePlan=function(){
  const ta=$('#tpReason'); const t=ta?ta.value.trim():'';
  const box=$('#tpCoachOut'); if(!box)return;
  const r=analyze('trade',t);
  box.innerHTML=`<div class="coach-sec" style="margin-top:8px">${feedbackHtml(r)}</div>
    <div class="t2" style="font-size:.66rem;margin-top:6px">点评不拦截提交——可以带着问题先成交，但成交后要能在复盘日记里对得上号。改完理由再点一次可重新点评。</div>`;
  if(box.scrollIntoView)box.scrollIntoView({behavior:'smooth',block:'nearest'});
};

return {mountTrain,mountQuiz,quizAnswer,takeText,arm,reviewBlockHtml,bindExport,
  quizCardHtml:()=>cardHtml(true),analyze,feedbackHtml,MODE_COACH};
})();

  PUR=()=>css('--purple'),MUT=()=>css('--muted'),TXT=()=>css('--text2'),WARN=()=>css('--warn');
/* --- 基元 --- */
function line(ctx,pts,col,lw,dash){ctx.strokeStyle=col;ctx.lineWidth=lw||1.5;ctx.setLineDash(dash||[]);
  ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.setLineDash([]);}
function text(ctx,x,y,t,col,align,size,bold){ctx.fillStyle=col||TXT();
  ctx.font=(bold?'600 ':'')+(size||10)+'px -apple-system,sans-serif';ctx.textAlign=align||'left';ctx.fillText(t,x,y);}
function circle(ctx,x,y,r,col){ctx.strokeStyle=col;ctx.lineWidth=1.8;ctx.setLineDash([3,2]);
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();ctx.setLineDash([]);}
function arrow(ctx,x1,y1,x2,y2,col){line(ctx,[[x1,y1],[x2,y2]],col,1.2);
  const a=Math.atan2(y2-y1,x2-x1);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-6*Math.cos(a-0.45),y2-6*Math.sin(a-0.45));ctx.lineTo(x2-6*Math.cos(a+0.45),y2-6*Math.sin(a+0.45));ctx.fill();}
function yMap(lo,hi,top,bot){return v=>bot-(v-lo)/(hi-lo)*(bot-top);}
function oneCandle(ctx,x,Y,o,c,h,l,cw){const col=c>=o?UP():DN();
  line(ctx,[[x,Y(h)],[x,Y(l)]],col,1.3);

/* 选项文本 → 概念图示（死叉先于金叉判断） */
function conceptKeyOf(t){
  if(typeof t!=='string')return null;
  if(t.indexOf('死叉')>=0)return 'deadcross';
  if(t.indexOf('金叉')>=0)return 'goldcross';
  if(t.indexOf('多头排列')>=0)return 'mbull';
  if(t.indexOf('空头排列')>=0)return 'mbear';
  if(/黏合|粘合|缠绕/.test(t))return 'mastick';
  if(t.indexOf('背离')>=0)return 'cdiv';
  if(t.indexOf('乖离')>=0)return 'cbias';
  if(t.indexOf('成交额')>=0)return 'cvolamt';
  if(t.indexOf('换手率')>=0)return 'cturn';
  if(/放量|量比/.test(t))return 'cheavy';
  if(/缩量/.test(t))return 'clight';
  if(/回踩|支撑|站上|站稳/.test(t))return 'msup';
  if(/跌破|压力|受阻|压制/.test(t))return 'mres';
  return null;
}

   超出范围的一键复制问题给 AI 教练（微信/AionUi 粘贴即问）。 */
const ASK_FAQ=[
 {kw:['云同步','开通','绑定','互通','同步'],q:'怎么开通云同步？',a:'① 首页「☁️ 云同步」卡片：起个名字（≤20字）+密码（≥6位）→ 点开通；② 之后每答完题约6秒自动加密上传；③ 手机/电脑输入同一名字+密码即进度互通。也可在「我的→云同步」管理（上传/恢复/改密码/退出）。'},
 {kw:['进度','丢失','没了','找回','恢复','清缓存','清空'],q:'进度丢了/换了设备怎么办？',a:'两条路：① <b>云同步找回</b>：新设备打开 → 首页云同步卡片 → 输入原来的名字+密码 → 自动找回；② <b>备份码兜底</b>：旧设备「我的→导出备份码」复制保存，新设备「导入恢复」粘贴。本机数据是 IndexedDB+localStorage 双写的，微信里打开的独立副本数据不互通（别在微信里做题）。'},
 {kw:['改密码','换密码','密码忘'],q:'怎么改云同步密码？',a:'「我的 → 云同步 → 改密码」：填名字+旧密码+新密码，进度会用新密码重新加密。⚠️ 密码忘了无法找回（它同时负责加密），只能重新注册一个名字从头练。'},
 {kw:['备份','备份码','导出','导入'],q:'备份码怎么用？',a:'「我的 → 导出备份码」→ 复制整段文字（微信发给自己保存）；恢复：新设备「导入恢复」→ 粘贴 → 覆盖本机数据。备份码不含云同步密钥，云端进度不受影响。'},
 {kw:['训练场','猜涨跌','玩法','怎么玩','盘感'],q:'盘感训练场怎么玩？',a:'五种玩法：A看图猜明天（核心：历史行情遮住未来5天，你判断涨跌→揭晓→自动讲解）/ B关键位判断 / C情绪推断 / D量价关系 / E今日复盘小测（收盘后）。建议每天至少3题；答题前可先在「💬我的看盘思路」写思路让教练点评，图上还能✏️画笔预测、🔍点读任意K线。'},
 {kw:['每天','学什么','计划','安排','节奏','几题'],q:'每天该学什么？',a:'三件套（约15分钟）：① 每日一练10题（首页「练习」）② 盘感训练场3题 ③ 收盘后写复盘日记。新课按「学院」9关顺序推进，学完每关考闯关试。新手参考「使用说明」里的7天计划：第1-2天K线基础，第3-4天均线+训练场L1，第5-6天量价+仓位计算器+第一篇日记，第7天第一次闯关考试。'},
 {kw:['段位','晋升','升级','见习','青铜','大师'],q:'段位怎么晋升？',a:'通过闯关考试自动晋升：1关=青铜、3关=白银、5关=黄金、7关=铂金、结业考通过=盘感大师。当前进度在「学院」顶部和「我的」都能看到。'},
 {kw:['考试','不及格','多少分','通过','结业'],q:'考试多少分通过？',a:'闯关考试20题20分钟、结业考50题60分钟，都<b>≥80分通过</b>。不过可以无限次重考。考试中途点「⏸暂存退出」进度自动保存，随时续考。'},
 {kw:['错题','消灭','错题本','重练'],q:'错题本怎么消灭错题？',a:'错题<b>连对2次自动消灭</b>，也可以点「全懂」手动消灭。「练习→错题本」可整批重练；每日一练会优先抽错题。'},
 {kw:['复习','fsrs','遗忘','到期'],q:'FSRS复习是怎么回事？',a:'学完的课进入复习队列，按遗忘曲线自动排期（记得牢间隔变长、快忘的尽快重现）。到期课程显示在「学院→复习队列」和首页任务里，重做3道巩固题即完成一轮。'},
 {kw:['打卡','连续','断签','签到'],q:'打卡规则？',a:'完成任意学习动作（答题/训练/写日记）自动打卡；断签不清零但连续数重新计算，最佳纪录一直保留。'},
 {kw:['手机','打开','安装','主屏幕','app'],q:'手机怎么安装/打开？',a:'手机浏览器打开 https://dundunduo6799.github.io/pangan/ → 分享 → 「添加到主屏幕」→ 以后像App一样点图标进入，已缓存内容离线可用。同一名字+密码登录云同步后与电脑进度互通。'},
 {kw:['数据','存哪','隐私','安全','加密','泄露'],q:'我的数据存在哪，安全吗？',a:'三处：① 本机 IndexedDB+localStorage 双写（防清缓存）；② 云端只存<b>AES加密后的密文</b>（服务端也看不到内容），按名字隔离、错5次锁10分钟；③ 备份码在你自己手里。行情数据来自东方财富/腾讯公开接口，App 不碰任何账户信息。'},
 {kw:['快捷键','提问','助手','客服','问','ai在哪'],q:'提问助手怎么用？',a:'任何页面点右下角<b>💬</b>悬浮按钮，电脑上按 <b>/</b> 或 Ctrl/Cmd+K 也行。输入问题立即解答；点术语蓝色虚线词也能弹出速查卡；顶栏🔍可搜索全部词条。'},
 {kw:['模拟盘','模拟交易','虚拟','纸上'],q:'模拟盘怎么用？',a:'「练习→模拟盘」：100万虚拟资金，每笔交易<b>理由必填</b>（强制写清依据哪个指标——这是交易计划训练）、可填止损价，费用按真实费率计算；统计胜率/最大回撤。建议：先在模拟盘把最大回撤练到<15%、按计划执行，再谈实盘。'},
 {kw:['复盘','日记','怎么写'],q:'复盘日记怎么写？',a:'「练习→复盘日记→写今天」：五步模板（今日情绪阶段/热点板块/自选股体检/明日观察计划/贴图）。收盘后5分钟写完，坚持21天会明显感觉复盘变快变准。'},
];
ASK_FAQ.push(
 {kw:['期货','保证金','杠杆','做空','爆仓'],q:'期货是什么？新手能玩吗？',a:'期货=标准化未来合同，支持双向+保证金杠杆+每日盯市。规则详见「学院→第10关」。<b>立场：纯新手不建议期货实盘</b>——认知先行；训练场选"期货"类别可以用连续合约数据安全练盘感。'},
 {kw:['比特币','加密货币','币','区块链','usdt','稳定币'],q:'加密货币是什么？能参与吗？',a:'加密货币=区块链驱动的去中心化资产（比特币总量恒定）。关键认知：私钥=所有权、境内不受法律保护、平台与钓鱼风险极高、7×24极端波动。详见「学院→第11关」。<b>立场：先学懂再谈其他，默认资金可能100%消失。</b>训练场可选"加密货币"类别练波动识别。'},
 {kw:['基金','净值','etf','定投','指数'],q:'基金怎么选、怎么投？',a:'新手默认三件套：<b>宽基指数基金 + 定投 + 长期持有</b>（费率低、风格不漂移、纪律化）。选主动基金看：经理任职过牛熊/规模适中/回撤控制。详见「学院→第12关」。训练场"基金"类别可练净值趋势。'},
 {kw:['多品种','品种','期货题','基金题','币价'],q:'训练场怎么练期货/基金/加密货币？',a:'训练场顶部新增「品种类别」选择：A股/基金(净值线形)/期货(新浪连续合约)/加密货币(代理行情)。A看图猜明天、B关键位、D量价都支持多品种；数据失败自动回退示例数据（会标注）。'},
);
const ASK=(()=>{
  let log=[];
  function norm(s){return String(s==null?'':s).toLowerCase().trim();}
  function open(prefill){
    openSheet(`<h3>💬 提问助手 <span class="chip info">快捷键 / </span></h3>
      <div class="t2" style="font-size:.7rem;margin-top:2px">术语/形态/课程/用法都能问；先看看这些大家常问的：</div>
      <div class="ask-chips" id="askChips"></div>
      <div class="ask-log" id="askLog"></div>
      <div class="ask-input-row"><input type="text" id="askIn" placeholder="输入你的问题，回车发送">
      <button class="btn small" id="askSend">发送</button></div>`);
    $('#askChips').innerHTML=['换手率是什么？','怎么开通云同步？','每天该学什么？','MA5怎么用？','进度丢了怎么办？','考试多少分通过？']
      .map(c=>`<span class="ask-chip" data-q="${esc(c)}">${esc(c)}</span>`).join('');
    $$('#askChips .ask-chip').forEach(ch=>ch.addEventListener('click',()=>submit(ch.dataset.q)));
    $('#askSend').addEventListener('click',()=>submit($('#askIn').value));
    $('#askIn').addEventListener('keydown',e=>{ if(e.key==='Enter')submit($('#askIn').value); });
    render();
    if(prefill)setTimeout(()=>submit(prefill),80);
    setTimeout(()=>{ try{$('#askIn').focus();}catch(e){} },150);
  }
  function submit(text){
    const q=String(text||'').trim();
    if(!q)return;
    const inp=$('#askIn'); if(inp)inp.value='';
    log.push({who:'u',html:esc(q)});
    log.push({who:'a',html:answer(q),q});
    render();
  }
  function render(){
    const box=$('#askLog'); if(!box)return;
    box.innerHTML=log.map(m=>`<div class="ask-msg ${m.who}"><div class="ask-bubble">${m.html}</div></div>`).join('');
    $$('#askLog canvas[data-oc]').forEach(cv=>{ const p=PATTERNS[cv.dataset.oc]; if(p)renderPattern(cv,p.candles,92,null,p.ma); });
    box.scrollTop=box.scrollHeight;
  }
  function answer(q){
    const k=norm(q);
    if(!k)return '<div class="t2">输入你的问题，比如「换手率怎么看」「怎么开通云同步」</div>';
    const hits=[];
    // FAQ
    for(const f of ASK_FAQ){ let s=0;
      f.kw.forEach(w=>{ if(k.indexOf(norm(w))>=0)s+=norm(w).length>=3?3:2; });
      if(s>=2)hits.push({type:'faq',s:s+2,f});
    }
    // 术语
    for(const [key,t] of Object.entries(TERM)){
      const nk=norm(key),nn=norm(t.n||key); let s=0;
      if(k.indexOf(nk)>=0||k.indexOf(nn)>=0)s=10;
      else if(nk.length>=2&&k.includes(nk))s=8; else if(nn.length>=2&&k.includes(nn))s=8;
      else if(k.length>=2&&norm(t.d).includes(k))s=4;
      if(s)hits.push({type:'term',s,key,t});
    }
    // 形态
    for(const [id,p] of Object.entries(PATTERNS)){
      const nn=norm(p.n); let s=k.indexOf(nn)>=0?9:0;
      if(!s&&k.length>=3&&norm(p.d).includes(k))s=4;
      if(s)hits.push({type:'pat',s,id,p});
    }
    hits.sort((a,b)=>b.s-a.s);
    let html='';
    const faq=hits.find(h=>h.type==='faq');
    if(faq)html+=`<div class="ask-card"><div class="ask-t">💡 ${esc(faq.f.q)}</div><div class="v" style="line-height:1.8">${faq.f.a}</div></div>`;
    const term=hits.find(h=>h.type==='term');
    if(term){ const t=term.t;
      html+=`<div class="ask-card"><div class="ask-t">📖 ${esc(t.n)} <span class="chip">${esc(t.cat)}</span></div>
        <div class="sec"><div class="k">一句话人话</div><div class="v">${t.d}</div></div>
        ${(t.how||t.s)?`<div class="sec"><div class="k">怎么看</div><div class="v">${t.how||t.s}</div></div>`:''}
        ${t.w?`<div class="sec"><div class="k">⚠️ 常见误读</div><div class="v">${t.w}</div></div>`:''}</div>`;
    }
    const pat=hits.find(h=>h.type==='pat');
    if(pat){ const p=pat.p;
      html+=`<div class="ask-card"><div class="ask-t">🕯️ ${esc(p.n)} <span class="${PATTERN_BIAS[p.bias].cls}">${PATTERN_BIAS[p.bias].t}</span> <span class="chip">${esc(p.cat)}</span></div>
        <canvas data-oc="${pat.id}" style="width:min(240px,78vw);display:block;margin:6px auto"></canvas>
        <div class="v" style="line-height:1.7">${esc(p.d)}${p.s?' '+esc(p.s):''}</div></div>`;
    }
    // 相关课程
    const kws=k.split(/[\s,，。？?！!、]+/).filter(w=>w.length>=2);
    if(kws.length){
      const lsHits=[];
      for(const ls of CUR.flat){
        const text=norm(ls.t+' '+(ls.c||'').replace(/<[^>]+>/g,' '));
        let s=0; kws.forEach(w=>{ let at=text.indexOf(norm(w)); while(at>=0){s++; at=text.indexOf(norm(w),at+1);} });
        if(norm(ls.t).includes(kws[0]))s+=3;
        if(s>=2)lsHits.push({ls,s});
      }
      lsHits.sort((a,b)=>b.s-a.s);
      const top=lsHits.slice(0,3);
      if(top.length)html+=`<div class="ask-rel">📚 相关课程（点击直达）</div>`+top.map(x=>
        `<div class="list-item clickable" onclick="closeSheet();go('academy');viewLesson('${x.ls.id}')">
          <div class="li-main"><b style="font-size:.82rem">${esc(x.ls.t)}</b>
          <div class="t2" style="font-size:.66rem">${esc(x.ls.levelName)}</div></div><span class="pos-tag">去学</span></div>`).join('');
    }
    if(!html){
      const lastQ=esc(q);
      html=`<div class="ask-card"><div class="ask-t">🤖 这个问题超出了我的内置知识库</div>
        <div class="v" style="line-height:1.7;margin:4px 0 8px">内置知识库覆盖：45+术语、20+K线形态、9关76课内容、App使用问题。
        可以换个词再问（比如问具体指标名），或一键复制给 AI 教练深度解答：</div>
        <button class="btn small block" id="askCopy">📋 复制问题（去微信/AionUi 粘贴问 AI）</button></div>`;
      setTimeout(()=>{ const b=$('#askCopy'); if(b)b.addEventListener('click',()=>{
        const tabName={home:'首页',academy:'学院',drill:'练习',train:'训练场',mood:'情绪温度计',tools:'工具箱',mine:'我的'}[S.activeTab]||S.activeTab;
        const txt=`【盘感训练营·提问】${lastQ}\n（我当时在「${tabName}」页面）\n请用新手能懂的人话解答，A股学习语境，不荐股。`;
        (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('✅ 已复制，去粘贴给 AI 即可'),()=>toast('复制失败，手动选择问题文字复制'));
      }); },30);
    }
    return html||'<div class="t2">没找到答案，换个说法试试</div>';
  }
  return {open,submit};
})();
function openAsk(prefill){ ASK.open(prefill); }

(function(){
  const st=document.createElement('style');
  st.textContent=`

.ask-input-row input{flex:1}`;
  document.head.appendChild(st);
  function init(){
    const fab=document.createElement('div');
    fab.id='askFab'; fab.title='提问助手（快捷键 /）'; fab.textContent='💬';
    fab.addEventListener('click',()=>openAsk());
    document.body.appendChild(fab);
    document.addEventListener('keydown',e=>{
      const t=e.target||{};
      const tag=(t.tagName||'').toLowerCase();
      const typing=tag==='input'||tag==='textarea'||tag==='select'||t.isContentEditable;
      if(typing)return;
      if(e.key==='/'||((e.metaKey||e.ctrlKey)&&String(e.key).toLowerCase()==='k')){
        e.preventDefault(); openAsk();
      }
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
  else init();
})();

</script>

/* 情绪数据后台刷新（不阻塞首页） */
async function refreshSentimentBackground(){
  if(cacheGet('breadth',60*1000))return;
  try{
    const b=await loadBreadth(), lm=await loadLimitStats();
    const prev=S.sent.length?S.sent[S.sent.length-1]:null;
    const cls=classifySentiment({up:b.up,dn:b.dn,zt:lm.zt,dt:lm.dt,zb:lm.zb,amount:b.amount},prev);
    const today=todayStr();
    const st={date:today,score:cls.score,stage:cls.stage,up:b.up,dn:b.dn,zt:lm.zt,dt:lm.dt,zb:lm.zb,amount:b.amount};
    if(!prev||prev.date!==today){ S.sent.push(st); if(S.sent.length>120)S.sent=S.sent.slice(-120); }
    else { S.sent[S.sent.length-1]=st; }
    savePiece('sent');
    setStatus('live','已连接');
  }catch(e){ setStatus('err','离线模式'); }
}
function setStatus(kind,text){ const el=$('#dataStatus'); if(el){ el.className='status '+kind; el.textContent=text; } }

<script>/* ==== 31-pages-academy.js ==== */
'use strict';
/* ================= 学院：课程地图 / 复习队列 / 闯关考试 ================= */
PAGE.sub.academy=['map','review'];
PAGE.render.academy=function(){
  const sub=PAGE.subState.academy||'map';
  if(sub==='review')return renderReviewQueue();
  renderCourseMap();
};
function renderCourseMap(){
  const doneSet=new Set(CUR.flat.filter(ls=>S.lessons[ls.id]&&S.lessons[ls.id].done).map(ls=>ls.id));
  const passedCountLv=passedCount();
  let idx=0;
  const lvHtml=CUR.levels.map(lv=>{
    idx++;
    const d=lv.lessons.filter(ls=>doneSet.has(ls.id)).length;
    const ex=S.exams[lv.i];
    const unlocked=idx<=1||!!S.exams[CUR.levels[idx-2].i]?.passed||doneRatioOf(lv)>=0.4;
    return `<div class="lv-item ${d===lv.count?'done':''}" onclick="openLevel('${lv.i}')">
      <div class="lv-badge">${lv.icon}<small>第${idx}关</small></div>
      <div class="lv-info"><b>${esc(lv.n)}</b>
        <div class="t2">${lv.desc||''}</div>
        <div class="row" style="margin-top:5px"><div class="bar-track"><div class="bar-fill" style="width:${d/lv.count*100}%"></div></div>
        <span class="t2 num" style="font-size:.68rem">${d}/${lv.count}课</span></div></div>
      <div style="text-align:right">
        ${ex?`<span class="chip ${ex.passed?'down':'gold'}">${ex.passed?'✔已通过':'最好'+ex.best+'分'}</span>`:`<span class="chip">${unlocked?'可考试':'学习中'}</span>`}
        <button class="btn small gray" style="margin-top:5px" onclick="event.stopPropagation();startExam('${lv.i}')">🎓 考试</button>
      </div></div>`;
  }).join('');
  const fin=S.exams.final;
  const exBanner=(S.exam&&S.exam.qs)?`<div class="card" style="border-color:rgba(232,179,57,.5)"><div class="row between">
    <div><b>📝 有未完成的考试：${esc(S.exam.title)}</b>
    <div class="t2" style="font-size:.7rem;margin-top:2px">已答 ${(S.exam.answers||[]).filter(a=>a!=null).length}/${S.exam.qs.length} 题 · 剩约 ${Math.max(0,Math.ceil((S.exam.left||0)/60))} 分钟（考试中途可暂存退出，进度自动保存）</div></div>
    <button class="btn small" onclick="${S.exam.key==='final'?'startFinalExam()':'startExam(\''+S.exam.key+'\')'}">继续考试</button></div></div>`:'';
  $('#page-academy').innerHTML=`
    <div class="card"><div class="row between"><div>${rankHtml()}
      <div class="row" style="margin-top:6px;width:100%"><input type="text" id="lvSearch" placeholder="🔍 搜索课程关键词…" style="font-size:.78rem"></div>
      <div class="t2" style="font-size:.7rem;margin-top:4px">已通过 ${passedCountLv}/12 关${fin&&fin.passed?' · 🎖️ 结业盘手':''}</div></div>
      <button class="btn small blue" onclick="startFinalExam()">🏆 结业考试（50题）</button></div></div>
    ${exBanner}
    <div class="lv-map" id="lvMap">${lvHtml}</div>
    <div class="disclaimer">学习建议：按顺序学完一关的全部课程再考试；也支持自由跳关（点击任意关卡进入）。考试中途点「⏸ 暂存退出」可随时续考。</div>`;
  const si=$('#lvSearch');
  if(si)si.addEventListener('input',()=>{ const k=si.value.trim().toLowerCase();
    document.querySelectorAll('#lvMap .lv-item').forEach(it=>{ it.style.display=!k||it.innerText.toLowerCase().includes(k)?'':'none'; }); });
}
function doneRatioOf(lv){ const d=lv.lessons.filter(ls=>S.lessons[ls.id]&&S.lessons[ls.id].done).length; return d/lv.count; }
function openLevel(lvId){
  const lv=CUR.levels.find(x=>x.i===lvId); if(!lv)return;
  const items=lv.lessons.map(ls=>{
    const L=S.lessons[ls.id]||{};
    return `<div class="list-item clickable" onclick="viewLesson('${ls.id}')">
      <span class="pos-tag">${L.done?'✅':'▫️'}</span>
      <div class="li-main"><b style="font-size:.88rem">${esc(ls.t)}</b>
        <div class="t2" style="font-size:.68rem">${L.card&&!FS.isDue(L.card)?'已排期复习':(L.done?'该复习啦':'待学习')}</div></div>
      <span class="t2" style="font-size:.68rem">3题</span></div>`;
  }).join('');
  $('#page-academy').innerHTML=`
    <div class="card"><div class="row between"><h3 style="margin:0">${lv.icon} ${esc(lv.n)}</h3>
      <div class="row"><button class="btn small gray" onclick="renderCourseMap()">← 返回</button>
      <button class="btn small" onclick="startExam('${lv.i}')">🎓 闯关考试</button></div></div>
      <div class="t2" style="font-size:.74rem;margin-top:6px">${esc(lv.desc||'')}</div></div>
    <div class="card">${items}</div>`;
}
/* ---------- 课件阅读 ---------- */
function viewLesson(lid,fromReview){
  const ls=CUR.flat.find(x=>x.id===lid); if(!ls)return;
  $('#page-academy').innerHTML=`
    <div class="card"><div class="row between"><h3 style="margin:0">📖 ${esc(ls.t)}</h3>
      <button class="btn small gray" onclick="${fromReview?"renderReviewQueue()":"openLevel('"+ls.lvl+"')"}">← 返回</button></div>
      <div class="t2" style="font-size:.68rem;margin-top:2px">${esc(ls.levelName)} · 学完自动进入复习排期</div></div>
    <div class="card lesson-body">${ls.c}${typeof figListHtml==='function'?figListHtml(LESSON_FIG_MAP&&LESSON_FIG_MAP[ls.id]):''}
      <div class="lesson-tip">💡 <b>现实用法：</b>${esc(ls.tip)}</div></div>
    <div class="card"><h3>✍️ 巩固练习（3题）</h3><div id="lessonQuiz"></div></div>`;
  if(typeof renderLessonFigs==='function')renderLessonFigs($('#page-academy'));
  let rights=0;
  quizFlow($('#lessonQuiz'),ls.qs,{
    tagOf:()=>esc(ls.t),
    onEach:right=>{ rights+=right?1:0; recordQ(right,ls.id); },
    onFinish:results=>{
      const L=S.lessons[ls.id]||{qstat:{right:0,wrong:0}};
      L.done=true;
      L.qstat=L.qstat||{right:0,wrong:0};
      results.forEach(r=>r.right?L.qstat.right++:L.qstat.wrong++);
      L.card=FS.review(L.card||FS.newCard(), results.filter(r=>r.right).length===3?3:(results.filter(r=>r.right).length===2?2:1));
      L.lastAt=nowMs(); S.lessons[ls.id]=L; savePiece('lessons');
      const first=touchStreak();
      toast(`本课完成 ${rights}/3 ✅${first?' · 🔥 打卡+1':''}`);
      setTimeout(()=>{ fromReview?renderReviewQueue():openLevel(ls.lvl); },600);
    }
  });
}
/* ---------- 答题记录 ---------- */
function recordQ(right,lid){
  if(lid){ const L=S.lessons[lid]=S.lessons[lid]||{qstat:{right:0,wrong:0}};
    L.qstat=L.qstat||{right:0,wrong:0};
    right?L.qstat.right++:L.qstat.wrong++; }
  savePiece('lessons');
}
function markWrong(qid){
  const w=S.wrong[qid]||{n:0,streak:0,lastAt:0};
  w.n++; w.streak=0; w.lastAt=nowMs(); S.wrong[qid]=w; savePiece('wrong');
}
function markRight(qid){
  if(!S.wrong[qid])return;
  const w=S.wrong[qid]; w.streak=(w.streak||0)+1;
  if(w.streak>=2){ delete S.wrong[qid]; toast('✅ 错题连对2次，已从错题本消灭'); }
  savePiece('wrong');
}
/* ---------- 复习队列 ---------- */
function renderReviewQueue(){
  const due=CUR.flat.filter(ls=>S.lessons[ls.id]&&S.lessons[ls.id].done&&S.lessons[ls.id].card&&FS.isDue(S.lessons[ls.id].card));
  const soon=CUR.flat.filter(ls=>S.lessons[ls.id]&&S.lessons[ls.id].done&&S.lessons[ls.id].card&&!FS.isDue(S.lessons[ls.id].card))
    .sort((a,b)=>new Date(S.lessons[a.id].card.due)-new Date(S.lessons[b.id].card.due)).slice(0,8);
  $('#page-academy').innerHTML=`
    <div class="card"><div class="row between"><h3 style="margin:0">🔁 FSRS 复习队列</h3>
      <button class="btn small gray" onclick="renderCourseMap()">← 课程</button></div>
      <div class="t2" style="font-size:.74rem;margin-top:4px">按遗忘曲线（FSRS）排期：到期课程重做3道巩固题，记得牢的间隔变长、快忘的尽快重现。</div></div>
    <div class="card"><h3>今天该复习（${due.length}）</h3>
      ${due.length?due.map(ls=>`<div class="list-item clickable" onclick="viewLesson('${ls.id}',true)">
        <span class="pos-tag">🔴 到期</span><div class="li-main"><b style="font-size:.86rem">${esc(ls.t)}</b>
        <div class="t2" style="font-size:.68rem">${esc(ls.levelName)}</div></div><span class="chip purple">复习</span></div>`).join('')
      :'<div class="empty"><span class="em">🎉</span>没有到期的复习，去学新课吧</div>'}</div>
    ${soon.length?`<div class="card"><h3>📅 排期中</h3>${soon.map(ls=>{
      const d=new Date(S.lessons[ls.id].card.due);
      const days=Math.max(0,Math.ceil((d-new Date())/86400000));
      return `<div class="list-item"><div class="li-main"><b style="font-size:.85rem">${esc(ls.t)}</b>
        <div class="t2" style="font-size:.68rem">${esc(ls.levelName)}</div></div><span class="chip">${days===0?'明天':'约'+days+'天后'}</span></div>`;}).join('')}</div>`:''}`;
}
/* ---------- 闯关考试 ---------- */
function examPool(lvId){
  const qs=[];
  CUR.flat.filter(ls=>ls.lvl===lvId).forEach(ls=>ls.qs.forEach(q=>qs.push({...q})));
  window.__BANK_EXTRA__.filter(q=>q.lvl===lvId).forEach(q=>qs.push({...q}));
  return shuffle(qs).slice(0,20);
}
function clearExamState(){ if(S.exam){ S.exam=null; savePiece('exam'); } }
function examResumeFor(key){
  const saved=(S.exam&&S.exam.key===key&&S.exam.qs&&S.exam.qs.length>=10&&S.exam.answers)?S.exam:null;
  if(saved&&(saved.left==null||saved.left<=0))return null;
  return saved;
}
function startExam(lvId){
  const lv=CUR.levels.find(x=>x.i===lvId); if(!lv)return;
  const saved=examResumeFor(lvId);
  if(saved){
    const doneN=saved.answers.filter(a=>a!=null).length;
    if(confirm(`检测到未完成的「${lv.n}」考试：已答 ${doneN}/${saved.qs.length} 题，剩约 ${Math.max(0,Math.ceil((saved.left||0)/60))} 分钟。\n确定＝恢复继续；取消＝放弃旧进度重新开考。`)){
      runExam({title:lv.n,questions:saved.qs,seconds:saved.total||20*60,key:lvId,resume:saved,
        onDone:(score,passed)=>saveExam(lvId,score,passed,lvId)});
      return;
    }
    clearExamState();
  }
  const pool=examPool(lvId);
  if(pool.length<10)return toast('该关卡题库不足，请先学习');
  runExam({title:lv.n,questions:pool,seconds:20*60,key:lvId,
    onDone:(score,passed)=>saveExam(lvId,score,passed,lvId)});
}
function startFinalExam(){
  const saved=examResumeFor('final');
  if(saved){
    const doneN=saved.answers.filter(a=>a!=null).length;
    if(confirm(`检测到未完成的结业考试：已答 ${doneN}/${saved.qs.length} 题，剩约 ${Math.max(0,Math.ceil((saved.left||0)/60))} 分钟。\n确定＝恢复继续；取消＝放弃旧进度重新开考。`)){
      runExam({title:'🏆 结业综合考试',questions:saved.qs,seconds:saved.total||60*60,key:'final',resume:saved,
        onDone:(score,passed)=>saveExam('final',score,passed,'final')});
      return;
    }
    clearExamState();
  }
  const all=CUR.flat.flatMap(ls=>ls.qs.map(q=>({...q})));
  window.__BANK_EXTRA__.forEach(q=>all.push({...q}));
  const pool=shuffle(all).slice(0,50);
  runExam({title:'🏆 结业综合考试',questions:pool,seconds:60*60,key:'final',
    onDone:(score,passed)=>saveExam('final',score,passed,'final')});
}
function saveExam(key,score,passed,lvl){
  const prev=S.exams[key];
  S.exams[key]={passed:!!passed||(prev&&prev.passed)||false,best:Math.max(score,prev?prev.best:0),at:nowMs(),lvl};
  savePiece('exams');
}
function runExam(cfg){
  const resume=cfg.resume||null;
  const answers=resume&&resume.answers?resume.answers.slice():new Array(cfg.questions.length).fill(null);
  let cur=resume?clamp(resume.cur||0,0,cfg.questions.length-1):0;
  let left=resume&&resume.left!=null?resume.left:cfg.seconds;
  let timerId=null;
  function saveState(){
    if(!cfg.key)return;
    S.exam={key:cfg.key,title:cfg.title,qs:cfg.questions,answers,cur,left,total:cfg.seconds,at:nowMs()};
    savePiece('exam');
  }
  function tick(){
    left--;
    const m=String(Math.floor(left/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0');
    const el=$('#examTimer'); if(el){ el.textContent=m+':'+s; el.classList.toggle('hurry',left<=60); }
    if(left%15===0)saveState();
    if(left<=0){ toast('⏰ 时间到，自动交卷'); finish(); }
  }
  function render(){
    const q=cfg.questions[cur];
    $('#page-academy').innerHTML=`
      <div class="exam-timer"><div><b style="font-size:.85rem">${esc(cfg.title)}</b>
        <div class="t2" style="font-size:.66rem">第 ${cur+1}/${cfg.questions.length} 题 · ≥80分通过</div></div>
        <div class="row"><span class="timer-num" id="examTimer">${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}</span>
        <button class="btn small gray" id="examExit">⏸ 暂存退出</button>
        <button class="btn small gray" id="examSubmit">交卷</button></div></div>
      <div id="examQ"></div>
      <div class="card"><div class="anssheet">${cfg.questions.map((_,i)=>
        `<div class="cell ${answers[i]!=null?'done':''} ${i===cur?'cur':''}" onclick="examJump(${i})">${i+1}</div>`).join('')}</div></div>`;
    const cont=$('#examQ');
    const st={tag:'考试'};
    cont.innerHTML=qHtml(q,cur,cfg.questions.length,q.id,st);
    window._examOpts=q.t==='j'?2:(Array.isArray(q.o)?q.o.length:0);
    if(typeof drawQFigs==='function')drawQFigs(cont);
    else if(q.t==='c'&&q.p&&PATTERNS[q.p]){ renderPattern($('canvas',cont),PATTERNS[q.p].candles,110,null,PATTERNS[q.p].ma); }
    const card=$('.q-card',cont);
    bindQCard(card,q,right=>{ answers[cur]=right; cur++; saveState(); if(cur>=cfg.questions.length){ finish(); } else render(); });
    $('#examSubmit').addEventListener('click',()=>{
      if(answers.some(a=>a==null)&&!confirm('还有未作答的题目（按已答计分），确定交卷？'))return;
      finish();
    });
    $('#examExit').addEventListener('click',()=>{
      if(confirm('暂存并退出？已答的题目与剩余时间都会保存，随时回来继续。')){
        saveState(); clearInterval(timerId); toast('📝 考试已暂存，随时回来继续'); renderCourseMap();
      }
    });
  }
  window.examJump=i=>{ if(answers[cur]==null&&!confirmLeave())return; cur=i; render(); };
  function confirmLeave(){ return true; }
  function finish(){
    clearInterval(timerId); window._examActive=false;
    document.removeEventListener('keydown',examKey); window._examCleanup=null;
    clearExamState();
    const right=answers.filter(a=>a===true).length;
    const answered=answers.filter(a=>a!=null).length;
    const score=Math.round(right/answered*100)||0;
    const passed=score>=80;
    cfg.onDone(score,passed);
    $('#page-academy').innerHTML=`
      <div class="card exam-score"><div class="big ${passed?'pass':'fail'}">${score}分</div>
        <div style="font-size:1rem;margin:8px 0">${passed?'🎉 恭喜通过！':'再接再厉（≥80分通过）'}</div>
        <div class="t2" style="font-size:.76rem">答对 ${right}/${answered} 题${answered<cfg.questions.length?'（有未作答按已答计分）':''}</div>
        <div style="margin-top:14px;display:flex;gap:10px;justify-content:center">
          <button class="btn gray small" onclick="renderCourseMap()">返回课程</button>
          ${passed&&cfg.key!=='final'?'<button class="btn small blue" onclick="startFinalExam()">挑战结业考</button>':''}
        </div></div>
      ${rankHtml?`<div class="card" style="text-align:center">${rankHtml()}</div>`:''}`;
    if(passed&&cfg.key!=='final')toast('🎓 闯关成功！段位晋升');
    if(passed&&cfg.key==='final')toast('👑 结业达成！盘感大师');
  }
  $('#page-academy').innerHTML='<div class="card exam-score"><div class="big gold">…</div><div class="t2">考试加载中</div></div>';
  render();
  timerId=setInterval(tick,1000);
  window._examActive=true;
  window._examCleanup=()=>{ clearInterval(timerId); timerId=null; window._examActive=false;
    document.removeEventListener('keydown',examKey); };
  function examKey(e){
    const t=e.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
    if(e.key==='Enter'){ const n=document.querySelector('#examQ .act-next,#examQ .act-check'); if(n&&n.offsetParent)n.click(); return; }
    if(!window._examOpts)return;
    const i='abcd'.indexOf(e.key.toLowerCase());
    if(i>=0&&i<window._examOpts){ const o=document.querySelectorAll('#examQ .q-card .opt'); if(o.length>i)o[i].click(); return; }
    if(q&&q.t==='j'){ if(e.key==='1'){ const b=document.querySelectorAll('#examQ .opt-j[data-v="1"]'); if(b.length)b[0].click(); }
      if(e.key==='0'){ const b=document.querySelectorAll('#examQ .opt-j[data-v="0"]'); if(b.length)b[0].click(); } }
  }
  document.addEventListener('keydown',examKey);
}

</script>

<script>/* ==== 32-pages-drill.js ==== */
'use strict';
/* ================= 练习：每日一练 / 错题本 / 复盘日记 / 模拟盘 ================= */
PAGE.sub.drill=['daily','wrong','journal','paper'];
PAGE.render.drill=function(){
  const sub=PAGE.subState.drill||'daily';
  $('#page-drill').innerHTML=`
    <div class="subtabs">${PAGE.sub.drill.map(s=>`<div class="subtab ${s===sub?'on':''}" onclick="PAGE.subState.drill='${s}';PAGE.render.drill()">${{daily:'📝 每日一练',wrong:'❌ 错题本',journal:'📔 复盘日记',paper:'💼 模拟盘'}[s]}</div>`).join('')}</div>
    <div id="drillBody"></div>`;
  ({daily:renderDaily,wrong:renderWrong,journal:renderJournal,paper:renderPaper}[sub])();
};
/* ---------- 每日一练 ---------- */
function drillQueue(n){
  const t=todayStr();
  const pool=[];
  // 1) 错题优先
  Object.keys(S.wrong).forEach(qid=>{ const q=CUR.qmap[qid]||window.__BANK_EXTRA__.find(x=>x.id===qid); if(q)pool.push({...q,src:'wrong'}); });
  // 2) FSRS到期课程题
  const due=CUR.flat.filter(ls=>S.lessons[ls.id]&&S.lessons[ls.id].done&&S.lessons[ls.id].card&&FS.isDue(S.lessons[ls.id].card));
  due.forEach(ls=>pool.push(...ls.qs.map(q=>({...q,src:'review'}))));
  // 3) 未学的当前关课题
  const unlearned=CUR.flat.filter(ls=>!S.lessons[ls.id]||!S.lessons[ls.id].done);
  shuffle(unlearned).slice(0,20).forEach(ls=>pool.push(...ls.qs.map(q=>({...q,src:'new'}))));
  // 4) 补充通用池
  window.__BANK_EXTRA__.filter(q=>q.lvl==='all').forEach(q=>pool.push({...q,src:'mix'}));
  // 去重+洗牌
  const seen=new Set(); const out=[];
  for(const q of shuffle(pool)){ if(seen.has(q.id))continue; seen.add(q.id); out.push(q); if(out.length>=n)break; }
  return out;
}
function renderDaily(){
  const t=todayStr();
  const d=S.daily[t]=S.daily[t]||{done:0,target:S.settings.dailyTarget};
  if(d.done>=d.target){
    $('#drillBody').innerHTML=`<div class="card exam-score"><div class="big pass">✅</div>
      <div style="font-weight:700">今日 ${d.target} 题已完成</div>
      <div class="t2" style="font-size:.76rem;margin-top:4px">连续打卡 ${S.streak.count} 天 · 明天继续</div>
      <button class="btn gray small" style="margin-top:12px" onclick="drillExtra()">加练一组（+5题）</button></div>`;
    return;
  }
  const remain=d.target-d.done;
  const qs=drillQueue(remain);
  if(!qs.length){ $('#drillBody').innerHTML='<div class="empty"><span class="em">📝</span>题库加载中</div>'; return; }
  $('#drillBody').innerHTML=`<div class="card"><div class="row between"><b>📝 每日一练</b><span class="chip gold">今日 ${d.done}/${d.target}</span></div>
    <div class="t2" style="font-size:.72rem;margin-top:4px">错题优先 → 到期复习 → 新课巩固 · 答错自动进错题本，连对2次消灭</div></div><div id="drillQuiz"></div>`;
  quizFlow($('#drillQuiz'),qs,{
    tagOf:q=>({wrong:'错题重练',review:'到期复习',new:'新课',mix:'综合'})[q.src]||'',
    onEach:(right,q)=>{
      if(right){ recordQ(true,q.lid); markRight(q.id); } else { recordQ(false,q.lid); markWrong(q.id); }
      const dd=S.daily[todayStr()]=S.daily[todayStr()]||{done:0,target:S.settings.dailyTarget};
      dd.done++; savePiece('daily');
      if(touchStreak())toast('🔥 连续打卡 +1');
    },
    onFinish:results=>{
      const rightN=results.filter(r=>r.right).length;
      const dd=S.daily[todayStr()];
      $('#drillBody').innerHTML=`<div class="card exam-score">
        <div class="big ${rightN/results.length>=0.7?'pass':'fail'}">${Math.round(rightN/results.length*100)}分</div>
        <div style="font-weight:700">今日一练完成 ${rightN}/${results.length} 对</div>
        <div class="t2" style="font-size:.76rem;margin-top:4px">累计今日 ${dd.done}/${dd.target} 题 · 错题已进错题本</div>
        <div style="margin-top:12px;display:flex;gap:10px;justify-content:center">
          <button class="btn small" onclick="drillExtra()">加练5题</button>
          <button class="btn small gray" onclick="go('train')">去训练场 →</button></div></div>`;
    }
  });
}
function drillExtra(){
  const qs=drillQueue(5);
  if(!qs.length)return toast('题库加载中');
  $('#drillBody').innerHTML='<div id="drillQuiz"></div>';
  quizFlow($('#drillQuiz'),qs,{
    tagOf:()=>'加练',
    onEach:(right,q)=>{ right?(recordQ(true,q.lid),markRight(q.id)):(recordQ(false,q.lid),markWrong(q.id)); },
    onFinish:rs=>{ toast(`加练完成 ${rs.filter(r=>r.right).length}/${rs.length}`); renderDaily(); }
  });
}
/* ---------- 错题本 ---------- */
function renderWrong(){
  const entries=Object.entries(S.wrong).map(([qid,w])=>({qid,w,q:CUR.qmap[qid]||window.__BANK_EXTRA__.find(x=>x.id===qid)}))
    .filter(x=>x.q).sort((a,b)=>b.w.lastAt-a.w.lastAt);
  $('#drillBody').innerHTML=`
    <div class="card"><div class="row between"><h3 style="margin:0">❌ 错题本（${entries.length}）</h3>
      ${entries.length?'<button class="btn small" onclick="redoWrong()">重练全部</button>':''}</div>
      <div class="t2" style="font-size:.72rem;margin-top:4px">连对2次自动消灭 · 也可手动消灭</div></div>
    <div class="card">${entries.length?entries.slice(0,50).map(x=>`
      <div class="list-item"><div class="li-main"><div style="font-size:.8rem">${x.q.q.slice(0,46)}…</div>
        <div class="t2" style="font-size:.66rem;margin-top:2px">答错${x.w.n}次 · ${x.q.lvl&&x.q.lvl!=='all'?CUR.levels.find(l=>l.i===x.q.lvl)?.n||'':'综合池'}</div></div>
        <button class="btn small gray" onclick="killWrong('${x.qid}')">全懂</button></div>`).join('')
      :'<div class="empty"><span class="em">🎉</span>错题本是空的，保持住！</div>'}</div>`;
}
function killWrong(qid){ delete S.wrong[qid]; savePiece('wrong'); renderWrong(); toast('已从错题本消灭'); }
function redoWrong(){
  const qs=Object.keys(S.wrong).map(qid=>CUR.qmap[qid]||window.__BANK_EXTRA__.find(x=>x.id===qid)).filter(Boolean).slice(0,20);
  if(!qs.length)return;
  $('#drillBody').innerHTML='<div id="drillQuiz"></div>';
  quizFlow($('#drillQuiz'),shuffle(qs),{
    tagOf:()=>'错题重练',
    onEach:(right,q)=>{ right?(recordQ(true,q.lid),markRight(q.id)):(recordQ(false,q.lid),markWrong(q.id)); },
    onFinish:rs=>{ toast(`重练完成 ${rs.filter(r=>r.right).length}/${rs.length}`); renderWrong(); }
  });
}
/* ---------- 复盘日记 ---------- */
let journalMonth=new Date().toISOString().slice(0,7);
function renderJournal(){
  const [y,m]=journalMonth.split('-').map(Number);
  const first=new Date(y,m-1,1);
  const days=new Date(y,m,0).getDate();
  const startDow=first.getDay();
  let cells='';
  for(let i=0;i<startDow;i++)cells+='<div class="cal-d dim"></div>';
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=S.journal[ds];
    cells+=`<div class="cal-d ${has?'has':''} ${ds===todayStr()?'today':''}" onclick="openJournal('${ds}')">${d}${has?'<span class="dot"></span>':''}</div>`;
  }
  const recent=Object.entries(S.journal).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,5);
  $('#drillBody').innerHTML=`
    <div class="card"><div class="row between"><h3 style="margin:0">📔 复盘日记</h3>
      <div class="row"><button class="btn small gray" onclick="journalShift(-1)">←</button>
      <b style="font-size:.85rem">${journalMonth}</b>
      <button class="btn small gray" onclick="journalShift(1)">→</button></div></div>
      <div class="cal" style="margin-top:10px">${['日','一','二','三','四','五','六'].map(x=>`<div class="cal-h">${x}</div>`).join('')}${cells}</div>
      <button class="btn block" style="margin-top:12px" onclick="openJournal('${todayStr()}')">✍️ 写今天（盘后5分钟）</button></div>
    ${recent.length?`<div class="card"><h3>最近日记</h3>${recent.map(([ds,j])=>`
      <div class="list-item clickable" onclick="openJournal('${ds}')"><div class="li-main"><b style="font-size:.84rem">${ds}</b>
        <div class="t2" style="font-size:.68rem">${j.stage||''} ${esc((j.hot||'').slice(0,20))}</div></div><span class="pos-tag">查看</span></div>`).join('')}</div>`:''}`;
}
function journalShift(d){
  const [y,m]=journalMonth.split('-').map(Number);
  const dt=new Date(y,m-1+d,1); journalMonth=dt.toISOString().slice(0,7); renderJournal();
}
function openJournal(ds){
  const j=S.journal[ds]||{stage:'',hot:'',plan:'',note:'',imgs:[]};
  const sentToday=S.sent.find(s=>s.date===ds);
  openSheet(`<h3>📔 复盘日记 · ${ds}</h3>
    <label class="f">① 今日市场情绪阶段</label>
    <select id="jrStage"><option value="">（未记录）</option>${Object.entries(STAGE_META).map(([k,v])=>`<option value="${k}" ${j.stage===k||(!j.stage&&sentToday&&sentToday.stage===k)?'selected':''}>${v.n}${sentToday&&sentToday.stage===k?'（温度计）':''}</option>`).join('')}</select>
    <label class="f">② 今日热点板块 / 涨幅榜（轮动线索）</label>
    <textarea id="jrHot" placeholder="例：半导体放量领涨，XX连板3板…">${esc(j.hot||'')}</textarea>
    <label class="f">③ 自选股体检（均线三问/量价，可简写）</label>
    <textarea id="jrNote" placeholder="例：茅台站上MA5缩量回调=健康；XX放量破MA20=离场信号">${esc(j.note||'')}</textarea>
    <label class="f">④ 明日观察计划（写可验证的条件）</label>
    <textarea id="jrPlan" placeholder="例：若情绪分回到45以上且XX站回MA5，则关注…">${esc(j.plan||'')}</textarea>
    <label class="f">⑤ 贴图（K线截图，可选）</label>
    <input type="file" id="jrImg" accept="image/*" multiple style="font-size:.75rem">
    ${(j.imgs&&j.imgs.length)?`<div class="row wrap" style="margin-top:8px">${j.imgs.map((im,i)=>`<img src="${im}" style="width:72px;height:72px;object-fit:cover;border-radius:8px" onclick="toast('图${i+1}')">`).join('')}</div>`:''}
    <div style="margin-top:14px;display:flex;gap:10px">
      <button class="btn" onclick="saveJournal('${ds}')">保存</button>
      ${S.journal[ds]?'<button class="btn gray" onclick="delJournal(\''+ds+'\')">删除</button>':''}
      <button class="btn gray" onclick="closeSheet()">取消</button></div>`);
  $('#jrImg').addEventListener('change',async e=>{
    const files=[...e.target.files]; if(!files.length)return;
    const j2=S.journal[ds]=S.journal[ds]||{stage:'',hot:'',plan:'',note:'',imgs:[]};
    j2.imgs=j2.imgs||[];
    for(const f of files.slice(0,2)){
      const im=await compressImg(f);
      if(im)j2.imgs.push(im);
    }
    savePiece('journal'); toast('图片已加入，点保存完成');
  });
}
function compressImg(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{ const img=new Image();
      img.onload=()=>{ const w=Math.min(900,img.width), h=Math.round(img.height*w/img.width);
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        res(cv.toDataURL('image/jpeg',0.6)); };
      img.onerror=()=>res(null); img.src=r.result; };
    r.onerror=()=>res(null); r.readAsDataURL(file);
  });
}
function saveJournal(ds){
  S.journal[ds]={stage:$('#jrStage').value,hot:$('#jrHot').value.trim(),note:$('#jrNote').value.trim(),plan:$('#jrPlan').value.trim(),
    imgs:(S.journal[ds]&&S.journal[ds].imgs)||[]};
  S.journal[ds]._at=nowMs();
  savePiece('journal'); closeSheet(); renderJournal();
  if(ds===todayStr())touchStreak();
  toast('📔 复盘已保存'+(ds===todayStr()?' · 打卡+1':''));
}
function delJournal(ds){ delete S.journal[ds]; savePiece('journal'); closeSheet(); renderJournal(); }
/* ---------- 模拟盘 ---------- */
function getLatestPrice(secid){
  const bars=cacheGet('k_'+secid+'_280',30*60*1000);
  if(bars&&bars.length)return bars[bars.length-1].c;
  return null;
}
function paperMv(){
  let mv=0;
  for(const [secid,p] of Object.entries(S.paper.pos)){
    const px=getLatestPrice(secid)||p.cost; mv+=px*p.shares;
  }
  return mv;
}
function calcFees(amount,side){
  const f=S.settings.paperFee;
  let comm=Math.max(amount*f.comm,f.minComm);
  let stamp=side==='sell'?amount*f.stamp:0;
  let transfer=amount*f.transfer;
  return {comm,stamp,transfer,total:comm+stamp+transfer};
}
function renderPaper(){
  const mv=paperMv();
  const total=S.paper.cash+mv;
  const profit=total-1000000;
  const closed=S.paper.trades.filter(t=>t.side==='sell');
  const wins=closed.filter(t=>t.pnl>0).length;
  const eq=S.paper.eq.map(x=>x.v);
  $('#drillBody').innerHTML=`
    <div class="card"><h3>💼 模拟盘</h3>
      <div class="grid3">
        <div class="stat"><div class="v num">${fmtAmt(total)}</div><div class="k">总资产(100万起)</div></div>
        <div class="stat"><div class="v num ${profit>=0?'up':'down'}">${profit>=0?'+':''}${fmtAmt(profit)}</div><div class="k">累计盈亏</div></div>
        <div class="stat"><div class="v num">${closed.length?Math.round(wins/closed.length*100)+'%':'--'}</div><div class="k">平仓胜率</div></div>
      </div>
      ${eq.length>1?`<div class="chart-wrap" style="margin-top:10px"><canvas id="paperEq" data-h="90" style="width:100%"></canvas></div>
      <div class="t2" style="font-size:.66rem;text-align:center">净值曲线 · 最大回撤 ${maxDrawdown(eq)}%</div>`:''}
      <button class="btn block" style="margin-top:12px" onclick="openTrade()">➕ 新交易（理由必填）</button></div>
    <div class="card"><h3>持仓（${Object.keys(S.paper.pos).length}）</h3>
      ${Object.keys(S.paper.pos).length?Object.entries(S.paper.pos).map(([secid,p])=>{
        const px=getLatestPrice(secid)||p.cost;
        const pnl=(px-p.cost)*p.shares;
        return `<div class="list-item"><div class="li-main"><b style="font-size:.85rem">${esc(p.name||secid)}</b>
          <div class="t2 num" style="font-size:.68rem">${p.shares}股 · 成本${p.cost.toFixed(2)} 现价${px.toFixed(2)}</div></div>
          <span class="num ${pnl>=0?'up':'down'}" style="font-size:.82rem">${pnl>=0?'+':''}${fmtAmt(pnl)}</span></div>`;}).join('')

}
function normalizeSecid(input){
  const m=String(input).trim().match(/^(\d)\.(\d{6})$/);
  if(m)return m[1]+'.'+m[2];
  const code=String(input).trim().match(/(\d{6})/);
  if(code)return (code[1].startsWith('6')?'1.':'0.')+code[1];
  return null;
}
function doTrade(){
  const secid=normalizeSecid($('#tpSecid').value);
  const side=$('#tpSide').value;
  const shares=Math.floor(+$('#tpShares').value/100)*100;
  const px=+$('#tpPx').value;
  const stop=+$('#tpStop').value||null;
  const reason=$('#tpReason').value.trim();
  const tag=$('#tpTag').value;
  if(!secid)return toast('代码格式不对：6位代码或 1.600519 格式');
  if(!shares||shares<=0)return toast('股数要≥100');
  if(!px||px<=0)return toast('请填写价格');
  if(reason.length<6){ $('#tpReason').classList.add('field-err'); return toast('理由至少6个字：这笔交易的依据是什么？'); }
  const name=(S.watchMeta[secid]&&S.watchMeta[secid].name)||POOL.find(p=>p[0]===secid)?.[1]||secid;
  const amount=px*shares;
  const fee=calcFees(amount,side).total;
  let trade;
  if(side==='buy'){
    if(amount+fee>S.paper.cash)return toast('现金不足');
    S.paper.cash-=amount+fee;
    const p=S.paper.pos[secid]=S.paper.pos[secid]||{name,shares:0,cost:0};
    p.cost=(p.cost*p.shares+amount)/(p.shares+shares); p.shares+=shares;
    if(stop)p.stop=stop;
    trade={side:'buy',secid,name,shares,px,fee,reason,tag,stop,d:todayStr()};
  } else {
    const p=S.paper.pos[secid];
    if(!p||p.shares<shares)return toast('没有足够持仓');
    const pnl=(px-p.cost)*shares-fee;
    S.paper.cash+=amount-fee;
    p.shares-=shares;
    if(p.shares<=0){ delete S.paper.pos[secid]; }
    trade={side:'sell',secid,name,shares,px,fee,pnl,reason,tag,stop,d:todayStr()};
  }
  S.paper.trades.push(trade);
  S.paper.eq.push({t:nowMs(),v:S.paper.cash+paperMv()});
  if(S.paper.eq.length>500)S.paper.eq=S.paper.eq.slice(-500);
  savePiece('paper'); closeSheet(); renderPaper();
  toast((side==='buy'?'✅ 已买入':'✅ 已卖出')+' '+name+' '+shares+'股'+(side==='sell'&&trade.pnl!=null?(trade.pnl>=0?' · 盈利':' · 亏损'):''));
}

let labSecid='1.600519', labOpts={ma:[5,10,20,60],boll:false,vol:true,turn:true,macd:false};
const LAB_EXPS=[
 {n:'实验1 · MA5是什么',set:{ma:[5],boll:false,vol:true,turn:false,macd:false},q:'只留一条MA5：观察股价与它的关系。强势段的回踩是不是总在MA5附近获得支撑？',
  a:'MA5 = 最近5个交易日收盘价的平均值 = 近5天买入者的平均成本。所以强势段回踩到MA5附近常获得支撑：持仓者成本就在附近，抛压小、有人愿意接。<br><b>但要配合量能看</b>：缩量回踩MA5 = 抛压轻，支撑可靠；放量砸破MA5 = 支撑失效的警示信号。<br><b>注意反例</b>：单边下跌里MA5是压制线不是支撑线——反弹到MA5附近常被压回。均线角色随趋势方向互换（第2关第7课）。'},
 {n:'实验2 · 加上MA20看趋势',set:{ma:[5,20],boll:false,vol:true,turn:false,macd:false},q:'MA5金叉/死叉MA20的位置在哪？之后走势如何？数一数信号滞后了几根K线。',
  a:'金叉 = MA5上穿MA20（短期成本超过中期成本 = 近期买入意愿增强），死叉反之。<br><b>关键观察：滞后性</b>。等MA5完全上穿MA20时，价格往往已经涨了一段——通常滞后几根到十几根K线。你数出来的滞后根数，就是均线类指标的"天生慢半拍"。<br><b>正确用法</b>：金叉/死叉用来确认「环境已经变了」，而不是当买卖点去追——追金叉常买在短期高点（第2关第6课）。'},
 {n:'实验3 · 量能确认',set:{ma:[5,20],boll:false,vol:true,turn:true,macd:false},q:'打开换手率副图：突破日的量能与换手率相比之前放大了多少？没量的突破表现如何？',
  a:'经验值：相对5日均量 ≥1.4倍算放量、≤0.75倍算缩量。<br><b>有效突破</b>通常伴随量能放大+换手率抬升——说明有真金白银推动，不是画的线。<br><b>无量突破</b>（缩量）多数走不远，容易回落成假突破。<br><b>例外</b>：筹码高度锁定、股东结构稳定的强势股，缩量上涨也能持续——但新手先按「无量的突破不可信」执行，例外留给经验去识别（第3关第1课）。'},
 {n:'实验4 · BOLL收口与开口',set:{ma:[],boll:true,vol:true,turn:false,macd:false},q:'找出布林带最窄（收口）的位置——之后是否出现了大波动？方向朝哪边开口？',
  a:'布林带收口 = 20日波动率被压缩到极低 = 多空暂时平衡、市场在「蓄势」。多数大行情启动前都有收口阶段。<br><b>开口方向</b>通常跟随突破方向：向上开口若配合放量更可信；向下开口常从收口末端的一根放量长阴开始。<br><b>规律</b>：收口持续时间越长、越窄，开口后的行情级别往往越大——但方向由突破那一刻的量价决定，收口本身不预测方向（第6关BOLL课程）。'},
 {n:'实验5 · MACD动能',set:{ma:[5,20],boll:false,vol:false,turn:false,macd:true},q:'价格创新高时MACD红柱是否变矮（顶背离）？金叉出现在零轴上方还是下方？',
  a:'<b>顶背离</b>：价格创新高而MACD红柱反而变矮 = 上涨动能在衰减。它是「风险提示」而非「立即下跌」信号——背离可以连续出现多次才真正转折，所以背离后要先减仓观察而非直接清仓。<br><b>零轴位置</b>：零轴上方的金叉 = 多头环境里的动能修复，可信度高；零轴下方的金叉多属于下跌中的反弹，谨慎对待。<br>指标是价格的「慢镜头」：永远滞后于价格，用来确认、不用来预测（第6关第2课）。'},

function renderCalc(){
  $('#toolsBody').innerHTML=`
    <div class="card"><h3>📐 仓位计算器</h3>
      <div class="t2" style="font-size:.7rem;margin-bottom:6px">单笔风险法则：单笔最大亏损 ≤ 总资金2% → 反推该买多少股</div>

      <div class="result-panel" id="pcOut" style="display:none"></div></div>
