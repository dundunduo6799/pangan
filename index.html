      <div class="grid2">
        <div><label class="f">入场价</label><input type="number" id="rrEntry" step="0.01"></div>
        <div><label class="f">止损价</label><input type="number" id="rrStop" step="0.01"></div>
        <div><label class="f">目标价</label><input type="number" id="rrTarget" step="0.01"></div>
        <div><label class="f">预期胜率（%）</label><input type="number" id="rrWin" value="50" step="5"></div></div>
      <button class="btn block blue" style="margin-top:12px" onclick="calcRR()">这笔值得做吗？</button>
      <div class="result-panel" id="rrOut" style="display:none"></div></div>
    <div class="card"><h3>💰 交易成本计算器</h3>
      <label class="f">单笔金额（元）</label><input type="number" id="tcAmt" value="50000" step="1000">
      <button class="btn block gray" style="margin-top:10px" onclick="calcCost()">算一算</button>
      <div class="result-panel" id="tcOut" style="display:none"></div></div>`;
}
function calcPos(){
  const cap=+$('#pcCap').value, risk=+$('#pcRisk').value, en=+$('#pcEntry').value, st=+$('#pcStop').value;
  if(!cap||!risk||!en||!st||st>=en)return toast('请填写完整（止损价需低于买入价）');
  const dist=(en-st)/en;
  const shares=Math.floor(cap*risk/100/(en-st)/100)*100;
  const amt=shares*en;
  const loss=shares*(en-st);
  const pos=amt/cap*100;
  $('#pcOut').style.display='block';
  $('#pcOut').innerHTML=`可买 <b class="gold">${shares}</b> 股（${fmtAmt(amt)}元，占总资金 <b>${pos.toFixed(1)}%</b>）<br>
    触发止损时亏损 <b class="up">${fmtAmt(loss)}</b> 元（总资金的 ${risk}%）<br>
    <span class="t2" style="font-size:.7rem">止损距离 ${fmtPct(-dist*100)}。距离越近可买越多，但别为凑仓位而把止损设得离谱近。</span>`;
}
function calcRR(){
  const en=+$('#rrEntry').value, st=+$('#rrStop').value, tg=+$('#rrTarget').value, win=+$('#rrWin').value/100;
  if(!en||!st||!tg||st>=en||tg<=en)return toast('请填写：止损价<入场价<目标价');
  const r=(tg-en)/(en-st);
  const exp=win*r-(1-win);
  $('#rrOut').style.display='block';
  $('#rrOut').innerHTML=`盈亏比 <b class="${r>=2?'down':r>=1.5?'gold':'up'}">1 : ${r.toFixed(2)}</b><br>
    期望值（按胜率${Math.round(win*100)}%）：<b class="${exp>0?'down':'up'}">${exp>=0?'+':''}${exp.toFixed(2)}R</b><br>
    ${r>=2?'✅ 达到2:1标准，这笔结构值得做。':r>=1.5?'⚠️ 盈亏比一般，需要更高胜率或更好的位置支撑。':'❌ 低于2:1——放弃这次机会，会不做单才算入门。'}`;
}
function calcCost(){
  const amt=+$('#tcAmt').value;
  if(!amt)return toast('输入金额');
  const f=calcFees(amt,'sell');
  const rate=f.total/amt*100;
  const perYear=rate*250;
  $('#tcOut').style.display='block';
  $('#tcOut').innerHTML=`单笔往返成本：<b class="up">${f.total.toFixed(2)}元</b>（佣金${f.comm.toFixed(1)} + 印花税${f.stamp.toFixed(1)} + 过户费${f.transfer.toFixed(2)}）<br>
    占比 <b>${rate.toFixed(3)}%</b> —— 若每个交易日全仓进出一次，一年成本约 <b class="up">${perYear.toFixed(0)}%</b> 本金<br>
    <span class="t2" style="font-size:.7rem">${perYear>30?'🚨 这个频率下，成本本身就是最大的亏损来源。':perYear>10?'⚠️ 频率偏高，收益大部分在给成本打工。':'✅ 频率可控。'}</span>`;
}

        const startLvl=right>=4?'l3':right>=2?'l2':'l1';
        S.onboarding=true; savePiece('onboarding');
        $('#obBody').innerHTML=`<div style="text-align:center"><div class="em">🎓</div>
          <h2 style="font-size:1rem">定级完成：答对 ${right}/5</h2>
          <p style="margin:8px 0">推荐从 <b class="gold">${CUR.levels.find(l=>l.i===startLvl).n}</b> 开始${right>=4?'（你有一定基础，可先跳关）':''}${right<2?'（零基础起点，跟着课程走就行）':''}</p>
          <div style="text-align:left;background:var(--surface2);border-radius:10px;padding:10px;margin-top:10px">
            <div style="font-size:.8rem;font-weight:600">☁️ 顺手绑定云同步（推荐，可跳过）</div>
            <div class="t2" style="font-size:.68rem;margin:2px 0 6px">名字+密码 → 手机电脑进度互通，AES加密存储</div>
            <div class="row"><input type="text" id="obCn" placeholder="名字" maxlength="20" style="flex:1">
            <input type="password" id="obCp" placeholder="密码≥6位" style="flex:1"></div>
            <div class="t2 warn" style="font-size:.64rem;margin-top:4px" id="obCm"></div>
            <button class="btn block small" style="margin-top:8px" id="obCgo">绑定并进入训练营</button>
            <button class="btn gray block small" style="margin-top:6px" onclick="closeModal(true);go('home')">跳过，直接进入</button>
          </div></div>`;
        $('#obCgo').addEventListener('click',async()=>{
          $('#obCgo').disabled=true; $('#obCm').textContent='处理中…';
          try{
            const r=await cloudLogin($('#obCn').value,$('#obCp').value,'auto');
            closeModal(true); go('home'); toast('☁️ '+r);
          }catch(e){ $('#obCm').textContent=e.message; $('#obCgo').disabled=false; }
        });
      }
    });
  }
}
document.addEventListener('DOMContentLoaded',()=>{ boot().catch(e=>{ console.error(e); document.body.insertAdjacentHTML('afterbegin','<div style="padding:20px;color:#f0524f">启动异常：'+esc(e.message)+'</div>'); }); });

</script>

</body>
</html>
