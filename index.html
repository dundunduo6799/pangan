 {t:'c',p:'bear_engulf',q:'图中最后一根是长阴线且完全包住前一根阳线，这种形态通常说明？',o:['买方力量强势反转','卖方力量强势反转','即将涨停','没有意义'],a:1,e:'阴吞阳（阴包阴前的阳线）是典型的卖方强势信号，特别是出现在高位时。',oe:['吞没看第二根的方向：长阴包阳＝卖方完胜，正是本题答案','长阴完全包住前阳＝空头一举收复并反超，卖方强势反转','涨停是制度性拉到上限，与吞没形态无关','任何形态都有含义——「没有意义」本身就是错误认知']},
 {t:'j',q:'美股行情软件的颜色习惯与A股相同，红色代表上涨。',a:false,e:'美股习惯绿涨红跌，与A股相反。看美股时不要用A股的颜色直觉。'}]},
{id:'k03',t:'影线：上方的卖压与下方的承接',c:`<p>K线实体上下的细线叫<b>影线</b>。上影线 = 冲高后被打了回来（${termSpan('上影线')}长说明上方卖压重）；下影线 = 杀下去又被买回来（${termSpan('下影线')}长说明下方有资金承接）。</p>
<ul><li><b>长上影线</b>：冲高回落——有人想拉高却遇到大量抛售，常见于冲顶或试盘</li>
<li><b>长下影线</b>：探底回升——跌下去有资金积极买入，常见于探底</li>
<li>影线长短要结合<b>位置</b>看：高位长上影是危险信号，低位长下影可能是见底信号</li></ul>`,
tip:'复盘时留意"高位放巨量+长上影"的组合，这是经典的出货信号，第七关案例会详细讲。',
qs:[
 {t:'s',q:'一根K线收盘价远低于当日最高价，留下很长的上影线，最直接的含义是？',o:['下方承接力量强','冲高后遇到卖压回落','当天没有成交','即将除权'],a:1,e:'上影线=最高价与收盘价之间的距离，越长说明冲高回落幅度越大，上方卖压越重。'},
 {t:'c',p:'hammer',q:'图中这根K线出现在一段下跌之后，长下影+小实体，它叫什么？传统含义是？',o:['流星线·看跌','锤子线·可能见底','十字星·无意义','一字板·涨停'],a:1,e:'锤子线：长下影探底回升，出现在下跌末段时提示下方有承接，可能见底（需次日确认）。'},
 {t:'j',q:'低位出现的长下影线通常比高位出现的长上影线更值得作为"可能见底"的观察信号。',a:true,e:'位置决定含义：低位长下影=下方有承接（见底线索），高位长上影=上方有抛压（见顶线索）。'}]},
{id:'k04',t:'十字星：多空平衡点',c:`<p>开盘价和收盘价几乎一样（实体极小），只有影线——这就是${termSpan('十字星')}。它代表当天<b>多空打平</b>。</p>
<ul><li><b>低位十字星</b>：下跌中出现，可能是空方力竭、多方试探，变盘信号</li>
<li><b>高位十字星</b>：上涨中出现，可能是多方乏力，警示信号</li>
<li>十字星本身<b>不指示方向</b>，它只是说"平衡即将被打破"——方向要看第二天选择哪边</li></ul>
<p>记忆法：十字星是"中场哨声"，不是"终场哨声"。谁赢要看下半场。</p>`,
tip:'训练场模式A里，看到十字星别急着猜涨跌，重点看它之前是涨势还是跌势。',
qs:[
 {t:'s',q:'十字星（开盘≈收盘，实体极小）最核心的含义是？',o:['确定明天涨停','多空平衡、可能变盘','当天停牌','成交量必然萎缩'],a:1,e:'十字星代表多空打平，方向未定，需要结合出现位置和次日走势判断变盘方向。'},
 {t:'c',p:'doji',q:'图中形态是十字星，它出现在一波明显上涨之后。比较合理的解读是？',o:['多方继续强势，必然大涨','多方力量可能衰竭，警惕变盘','当天成交额为零','典型的底部确认信号'],a:1,e:'高位十字星提示多空分歧加大、上涨动能可能衰竭，是警示信号而非买入信号。',oe:['「必然大涨」不存在——十字星只说明打平，方向要次日选择','高位十字星＝多方推不动了、分歧加大，警惕变盘最合理','A股几乎不可能零成交（集合竞价也有成交）','十字星本身不指方向：低位才可能见底，高位恰是警示']},
 {t:'j',q:'十字星本身就能明确指示后市是涨还是跌。',a:false,e:'十字星只说明多空平衡，不指示方向。方向需结合位置、量能与次日走势。'}]},
{id:'k05',t:'锤子线与上吊线：同一张脸，两种性格',c:`<p>有一种K线：小实体在顶部、长长的下影线（像锤子）。它出现在<b>不同位置有完全相反的名字和含义</b>：</p>
<ul><li><b>锤子线</b>：出现在<b>下跌后</b>——空头砸盘被多头接住，可能见底回升</li>
<li><b>上吊线</b>：出现在<b>大涨后</b>——盘中被打下去又拉回，形似"上吊"，警示顶部</li>
<li>确认规则：锤子线/上吊线后第二天走势同向确认，可靠性更高</li></ul>
<p>这就是K线学的精髓：<b>形态+位置</b>才等于含义，单看形状没有意义。</p>`,
tip:'背口诀："底下锤子可能底，头上吊人要小心"。',
qs:[
 {t:'s',q:'同样的"长下影+小实体"K线，出现在大涨之后应称为？',o:['锤子线·看涨','上吊线·警示见顶','流星线·看涨','启明星·看涨'],a:1,e:'位置决定名字与含义：涨后出现叫上吊线（警示），跌后出现叫锤子线（可能见底）。'},
 {t:'c',p:'hanging',q:'图中长下影小实体K线出现在一段大涨之后，正确的风险意识是？',o:['立即满仓买入','视为警示信号，观察次日是否走弱','当天必跌停','与趋势无关'],a:1,e:'大涨后的长下影小实体是上吊线，提示盘中曾遭遇抛压，应警惕见顶，等待确认。',oe:['大涨后追高满仓＝最危险的动作——上吊线正是高位风险警讯','上吊线提示盘中曾遭大幅抛压，先观察次日是否走弱确认','「当天必跌停」无人能预知——风险警示不等于确定下跌','同一形态在高位叫上吊线、低位叫锤子线——脱离位置谈形态没有意义']},
 {t:'j',q:'锤子线出现后，次日收出阳线并超过锤子线实体，见底信号的可靠性提高。',a:true,e:'形态学中"确认"原则：反转形态后第二天同向确认，信号可靠性显著提高。'}]},
{id:'k06',t:'吞没形态：力量的彻底反转',c:`<p>第二根K线的实体<b>完全包住</b>前一根K线实体——${termSpan('吞没形态')}。</p>
<ul><li><b>阳吞没（看涨）</b>：下跌中出现，大阳线完全包住前一根阴线——多头一举收复失地</li>
<li><b>阴吞没（看跌）</b>：上涨中出现，大阴线完全包住前一根阳线——空头反戈一击</li>
<li>吞没力度看三点：第二根实体越长越强、伴随<b>放量</b>更可信、出现在明显高位/低位更有效</li></ul>`,
tip:'训练场模式D里会经常遇到"放量阴吞阳"的场景——那是量价课的重点内容。',
qs:[
 {t:'c',p:'bull_engulf',q:'图中形态出现在下跌之后，第二根阳线实体完全包住前一根阴线。这个形态叫？',o:['阴吞没·看跌','阳吞没·看涨','黄昏之星','三只乌鸦'],a:1,e:'阳吞没：多头强力反攻、收复前日全部失地，下跌中出现是看涨反转信号。'},
 {t:'m',q:'吞没形态的可信度判断，以下哪些能增强信号？（多选）',o:['第二根实体越长越强','伴随成交量放大','出现在明显的低位或高位','第二根是十字星'],a:[0,1,2],e:'吞没力度看实体长度、量能配合和位置。第二根若是十字星，说明反转力量并不强。',oe:['实体越长＝反攻越彻底，吞没的可信度越高','放量＝有真金白银推动反转，信号更可靠','低位阳吞没是见底、高位阴吞没是见顶——位置决定意义','十字星实体极小＝反攻乏力，反而削弱吞没信号']},
 {t:'j',q:'阴吞没出现在上涨高位时，提示空头力量反转，是常见的顶部信号之一。',a:true,e:'对。高位阴吞没意味着空头一次性吞掉多头前日全部成果，是经典顶部警示。'}]},
{id:'k07',t:'乌云盖顶与曙光初现',c:`<p>两个两根K线的反转组合：</p>
<ul><li><b>${termSpan('乌云盖顶')}（看跌）</b>：涨势中，第一天长阳，第二天高开但收出长阴、<b>深入前一根阳线实体一半以下</b>——高开诱多后被打回原形</li>
<li><b>曙光初现（看涨）</b>：跌势中，第一天长阴，第二天低开但收出长阳、深入前一根阴线一半以上——低开恐慌后绝地反击</li>
<li>插入越深（超过2/3），反转信号越强</li></ul>`,
tip:'看到"高开+收大阴"先想到乌云盖顶，但一定要等收盘确认，盘中可能假摔。',
qs:[
 {t:'s',q:'乌云盖顶的第二根K线特征是？',o:['低开高走收长阳','高开低走收长阴且深入前阳实体','收十字星','放量涨停'],a:1,e:'乌云盖顶：第二天高开（诱多）后走低收长阴，收盘深入前一根阳线实体一半以下。'},
 {t:'c',p:'pierce',q:'图中形态出现在下跌后：长阴+低开长阳深入前阴实体。这是？',o:['乌云盖顶·看跌','曙光初现·看涨','流星线','十字星'],a:1,e:'曙光初现与乌云盖顶互为镜像：跌势中低开高走收长阳、切入前阴实体过半，提示反转向上。'},
 {t:'j',q:'第二根K线插入前一实体越深，乌云盖顶/曙光初现的反转信号越强。',a:true,e:'插入深度代表反转力量：过半是及格线，深入2/3以上信号更强。'}]},
{id:'k08',t:'早晨之星与黄昏之星',c:`<p>三根K线组成的经典反转组合：</p>
<ul><li><b>${termSpan('早晨之星')}（见底）</b>：①长阴线 → ②小实体/十字星（向下跳空，多空犹豫）→ ③长阳线收复大半失地——黑夜将尽，黎明将至</li>
<li><b>黄昏之星（见顶）</b>：①长阳线 → ②向上跳空的小实体/十字星 → ③长阴线——日落前的最后辉煌</li>
<li>中间那根星线与两侧K线之间有跳空缺口时信号更强；第三根最好放量</li></ul>`,
tip:'三根K线组合比单根K线可靠得多，但仍要结合位置和量能——训练场里验证。',
qs:[
 {t:'s',q:'早晨之星的第三根K线理想特征是？',o:['长阴线','放量长阳、收复前日大部分跌幅','十字星','一字跌停'],a:1,e:'早晨之星的确认来自第三根放量长阳，证明多头接管，反转成立概率大增。'},
 {t:'c',p:'morning',q:'图中"长阴—星线—长阳"组合是？',o:['黄昏之星·见顶','早晨之星·见底','红三兵','乌云盖顶'],a:1,e:'长阴、低位星线、放量长阳——标准早晨之星结构，下跌末段的见底组合。'},
 {t:'m',q:'让早晨之星信号更强的因素包括？（多选）',o:['星线与前日之间有跳空','第三根阳线放量','组合出现在明显下跌之后','星线实体很小'],a:[0,1,2,3],e:'跳空显示情绪断裂、放量确认反转、位置决定意义、星线小代表犹豫充分——全部加分。',oe:['跳空＝情绪断裂，多空转换更坚决','放量长阳确认买方真正进场，反转才作数','低位才有「见底」意义——位置是形态的第一属性','星线越小＝多空犹豫越充分，积蓄的反转能量越多']}]},
{id:'k09',t:'红三兵与三只乌鸦',c:`<p>连续形态（趋势延续信号）：</p>
<ul><li><b>${termSpan('红三兵')}（看涨）</b>：连续三根中小阳线，收盘价节节升高——多头稳步推进，常见于上涨初期</li>
<li><b>${termSpan('三只乌鸦')}（看跌）</b>：连续三根阴线，收盘节节走低——空头持续施压，常见于下跌初期或高位破位</li>
<li>注意位置：涨了很久之后才出现的"三连阳"，可能是强弩之末；三连阴出现在低位，可能接近阶段底部</li></ul>`,
tip:'红三兵出现在底部区域启动时最有意义；高位三连阳反而要防"最后疯狂"。',
qs:[
 {t:'c',p:'three_black',q:'图中连续三根阴线节节走低且出现在高位破位处，该形态叫？',o:['红三兵·看涨','三只乌鸦·看跌','上升三法·看涨','早晨之星'],a:1,e:'三只乌鸦：连续三阴、逐级下移，高位出现提示空头持续施压、趋势转弱。'},
 {t:'j',q:'红三兵无论出现在什么位置，都一定是买入信号。',a:false,e:'位置决定意义：底部启动的红三兵最有价值；大涨后的三连阳可能是强弩之末。'},
 {t:'s',q:'三只乌鸦形态提示的核心信息是？',o:['多头稳步推进','空头连续施压、趋势走弱','多空平衡','即将涨停'],a:1,e:'三连阴逐级下移=空头持续占优，高位或破位处出现尤其要警惕。'}]},
{id:'k10',t:'K线学的边界：形态不是圣杯',c:`<p>最后一课泼点冷水，这是新手保护课：</p>
<ul><li>任何K线形态<b>都可能失败</b>——形态是概率线索，不是确定性预言</li>
<li>形态必须结合：<b>位置</b>（高位/低位）、<b>量能</b>（放量/缩量）、<b>趋势</b>（均线方向）</li>
<li>单一形态出现就重仓买入 = 赌博。正确用法：形态给你"警觉"，量能与趋势给你"证据"，仓位管理给你"退路"</li>
<li>同一个形态，100次里可能60次按剧本走——你要的是长期概率优势，不是每次都对</li></ul>
<p>学完本关，去训练场模式A用真实历史K线验证你学到的形态——这是本App的核心方法论：<b>学了就练，练完就复</b>。</p>`,
tip:'本关全部课程学完后，去"学院"页面挑战第1关闯关考试（20题），通过即解锁下一关。',
qs:[
 {t:'s',q:'K线形态给出买入线索后，正确的下一步是？',o:['立即重仓买入','结合量能、趋势与位置确认，并用仓位管理控制风险','卖出所有股票','删除软件'],a:1,e:'形态=线索，量能与趋势=证据，仓位管理=退路。三者齐备再行动，单形态不下重注。'},
 {t:'j',q:'K线形态是确定性预言，出现反转形态就必然反转。',a:false,e:'形态是概率线索，可能失败。长期靠概率优势+纪律赚钱，不靠单次预测。'},
 {t:'m',q:'判断一个K线形态是否值得重视，应该结合哪些维度？（多选）',o:['出现位置（高位/低位）','成交量配合','所处趋势（均线方向）','形态出现当天是不是周五'],a:[0,1,2],e:'位置、量能、趋势是三大确认维度。"周五"与形态有效性无关。',oe:['同一形态在高位和低位含义相反——位置是第一判断维度','量能决定信号真实性：放量反转可信，缩量要存疑','均线方向给出大环境，逆势形态的胜率要打折','星期几与形态有效性毫无关系——那是迷信不是分析']}]}
]},
{ i:'l2', n:'第2关 · 均线系统', icon:'📈', desc:'五日线（MA5）是你的第一条生命线', lessons:[
{id:'m01',t:'均线是什么：N天的平均成本',c:`<p>${termSpan('均线')}（MA）= 最近N个交易日<b>收盘价的平均值</b>连成的线。</p>
<ul><li>${termSpan('五日线')} MA5 = 最近5天收盘价的平均——大约是"这一周买入的人的平均成本"</li>
<li>MA20 = 最近一个月（20个交易日）的平均成本；MA60 = 一个季度的平均成本</li>
<li>均线的本质：<b>把噪点抹平，让趋势显形</b>。单日涨跌是噪音，均线走向是趋势</li></ul>
<p>人话：价格在均线上方=近期买入的人平均在赚钱；在下方=平均在亏钱。人气旺不旺、套牢盘多不多，均线一看便知。</p>`,
tip:'在指标实验室里打开任意一只股票，叠加MA5/20/60，感受"均线抹平噪点"的效果。',
qs:[
 {t:'s',q:'MA5的计算方式是？',o:['最近5天的最高价平均','最近5个交易日收盘价的平均值','5天的成交量平均','每天涨5%的连线'],a:1,e:'MA5=最近5个交易日收盘价的算术平均，可近似理解为"这一周买入者的平均成本"。'},
 {t:'j',q:'均线的作用之一是过滤单日波动噪音，让趋势更容易看清。',a:true,e:'均线通过平均抹平短期噪点，是观察趋势的基础工具。'},
 {t:'s',q:'股价运行在MA5上方，最贴近的人话解读是？',o:['最近一周买入的人平均是赚钱的','这只股票要好几年才涨','当天一定涨停','公司业绩一定很好'],a:0,e:'MA5≈最近一周的平均买入成本，价格在其上方=近期买入者平均获利，短线人气偏强。'}]},
{id:'m02',t:'五日线（MA5）：短线生命线',c:`<p><b>MA5是短线交易者用得最多的一条线</b>，约等于一周的持仓成本线。</p>
<ul><li><b>强势股的典型走法</b>：股价沿MA5上行，回调到MA5附近就获得支撑继续涨——"五日线不破，趋势不改"</li>
<li><b>跌破MA5</b>：短线走弱的第一个警示，强势股跌破五日线且收不回来，短线趋势告一段落</li>
<li><b>乖离过大</b>：股价远高于MA5（如偏离20%+），随时可能回踩均线——追高容易买在短期山顶</li>
<li>配合量能：回踩MA5时<b>缩量</b>=健康（抛压小），<b>放量跌破</b>=危险</li></ul>`,
tip:'训练场模式B专门练"当前价与MA5的关系"。口诀：强不破五，破五要跑；回踩缩量是机会，放量跌破要警惕。',
qs:[
 {t:'s',q:'强势股沿五日线上行的典型特征是？',o:['每天跌停','回调至MA5附近缩量企稳后继续上行','永远不触碰MA5','MA5持续向下'],a:1,e:'强势股回踩五日线时缩量（抛压小），获得支撑后继续上行，这是"五日线不破，趋势不改"。'},
 {t:'j',q:'股价大幅高于MA5（乖离很大）时追高买入，容易买在短期高点。',a:true,e:'乖离过大后价格常向均线回归（回踩），此时追高短期风险高。'},
 {t:'c',p:'ma5_rise',q:'图中股价连续上行并站稳MA5上方。若次日缩量回踩MA5附近，更合理的短线解读是？',o:['趋势破坏，立即清仓','常见的健康回踩，观察是否获支撑','必然跌停','与均线无关'],a:1,e:'上升趋势中缩量回踩五日线是常见的健康走势，重点观察均线支撑是否有效。',oe:['缩量回踩没有破坏任何结构——「立即清仓」是把正常回调当灾难','强势段缩量回踩MA5＝最经典的健康回调，观察支撑是否有效即可（正确）','「必然跌停」无人能预知——健康回调与跌停没有必然联系','这题的全部逻辑都建立在MA5上——怎么会与均线无关']}]},
{id:'m03',t:'MA10与MA20：波段分界线',c:`<p><b>MA10</b>（双周线）和<b>MA20</b>（月线，约22个交易日）是<b>波段操作</b>最常用的两条线：</p>
<ul><li>MA5反映"本周"，MA10反映"两周"，MA20反映"一个月"——周期越长，越稳定但也越迟钝</li>
<li>波段视角：股价在MA20上方运行 = 月线级别偏强；跌破MA20且收不回 = 波段走弱</li>
<li>常见节奏：强势股沿MA5走；一般强势股沿MA10走；中线趋势股沿MA20走</li>
<li>三线发散向上（5>10>20）是最顺的上涨结构</li></ul>`,
tip:'打开指标实验室，切换看同一只股票沿MA5、MA10还是MA20走——不同股票的"脾气"不同。',
qs:[
 {t:'s',q:'MA20大约对应多长时间的市场平均成本？',o:['一周','两周','一个月（约22个交易日）','一年'],a:2,e:'MA20=20个交易日≈一个月，称为月线，是波段分界的重要参考。'},
 {t:'j',q:'均线周期越长（如MA60），对价格变化越不敏感、越滞后。',a:true,e:'周期越长平均越多天数据，越平滑也越滞后——稳定性和灵敏度是一对矛盾。'},
 {t:'s',q:'"三线发散向上"指的最顺上涨结构是？',o:['MA5>MA10>MA20且都向上','MA20>MA10>MA5','三条线黏在一起','MA5在MA60下方'],a:0,e:'短中长均线自上而下排列且同向上行（多头排列），是上涨趋势最顺畅的结构。'}]},
{id:'m04',t:'MA60与长期均线：牛熊分界',c:`<p><b>MA60</b>（季线）、<b>MA120</b>（半年线）、<b>MA250</b>（年线）看中长期趋势：</p>
<ul><li>股价站上/跌破年线（MA250），常被视为<b>牛熊分界的参考</b>——年线上方是多头市场，下方是空头市场</li>
<li>长期均线的特点：<b>极稳极慢</b>。它不会骗你方向，但反应迟钝，不适合短线择时</li>
<li>实战组合：短线看MA5/MA10，波段看MA20，趋势看MA60/MA250——不同周期回答不同问题</li></ul>`,
tip:'在指标实验室打开一只老牌白马股，加上MA250，看看过去几年它在年线上下穿越时的行情变化。',
qs:[
 {t:'s',q:'通常被称为"年线"的是？',o:['MA5','MA20','MA60','MA250'],a:3,e:'一年约250个交易日，MA250即年线，常作为牛熊分界的参考线。'},
 {t:'m',q:'关于长期均线（MA60/MA250），正确的说法有？（多选）',o:['对方向判断参考价值大','对短线择时不敏感','信号出现次数少但权重高','适合用来抓每天的买卖点'],a:[0,1,2],e:'长期均线稳而慢：适合判断大势，不适合每天进出。短线择时要靠短均线+量价。',oe:['MA60/MA250代表半年/年线级别方向，是判断牛熊的标尺','长期均线反应慢，对日内和波段择时帮助很小','年线上下穿越几年才有一次，每次都是大级别信号','长期均线太慢，拿来做每日买卖点会频繁失效']},
 {t:'j',q:'股价站上年线且年线走平转向上，往往被中线投资者视为趋势转强的参考。',a:true,e:'年线上方+年线拐头，是中长期趋势转强的经典参考条件之一。'}]},
{id:'m05',t:'金叉与死叉：均线的交叉信号',c:`<p>短期均线上穿/下穿长期均线，产生两个经典信号：</p>
<ul><li><b>${termSpan('金叉')}</b>：短均线自下而上穿越长均线（如MA5上穿MA20）——短期成本超过中期成本，买方力量增强的信号</li>
<li><b>${termSpan('死叉')}</b>：短均线自上而下穿越长均线——走弱信号</li>
<li><b>位置决定质量</b>：低位（长期下跌后）的金叉质量高；高位（大涨后）的金叉可能是诱多。金叉+<b>放量</b>+多头排列初成，才是好信号</li>
<li>均线黏合后的第一次发散方向，往往是大行情起点</li></ul>`,
tip:'训练场模式B会出"金叉/死叉识别"题。记住：金叉不是买入按钮，是"注意力开关"。',
qs:[
 {t:'s',q:'MA5向上穿越MA20形成的信号叫？',o:['死叉','金叉','黏合','背离'],a:1,e:'短期均线上穿长期均线=金叉，提示短期买方力量转强。'},
 {t:'j',q:'大涨之后高位出现的金叉，质量通常低于长期下跌后低位出现的金叉。',a:true,e:'位置决定信号质量：低位金叉胜率高，高位金叉常是趋势末端或诱多。'},
 {t:'m',q:'提高金叉信号可靠性的条件包括？（多选）',o:['金叉时伴随成交量放大','出现在长期下跌后的低位','金叉后均线呈多头排列发散','金叉当天是涨停板'],a:[0,1,2],e:'量能、位置、结构是三大确认。是否涨停与金叉质量无关。',oe:['放量金叉＝有资金推动；缩量金叉常是假突破','低位金叉才是启动信号，大涨后的金叉多是最后一冲','金叉后三线发散向上＝趋势真正展开的确认','是否涨停与金叉质量无关，两个概念别混谈']}]},
{id:'m06',t:'多头排列与空头排列',c:`<p>把MA5/MA10/MA20/MA60从上到下排个队：</p>
<ul><li><b>${termSpan('多头排列')}</b>：MA5＞MA10＞MA20＞MA60，全部向上发散——所有周期的买入者都在赚钱，最健康的上涨结构，"持股不折腾"</li>
<li><b>${termSpan('空头排列')}</b>：MA5＜MA10＜MA20＜MA60，全部向下——所有周期的买入者平均被套，下跌趋势未完，"不抄底不接飞刀"</li>
<li><b>均线黏合</b>：几条线缠绕在一起——变盘前夜，等待方向选择</li></ul>`,
tip:'一眼看趋势的顺序：先看排列（多头/空头/黏合），再看价格与MA5的位置，最后看量能。',
qs:[
 {t:'s',q:'MA5＜MA10＜MA20＜MA60且全部向下，这个结构叫？',o:['多头排列','空头排列','均线黏合','金叉'],a:1,e:'短中长期均线自下而上排列且向下发散=空头排列，所有周期买入者平均被套，下跌趋势中。'},
 {t:'j',q:'空头排列的股票出现小反弹就重仓抄底，符合趋势交易原则。',a:false,e:'空头排列=趋势向下，逆势抄底是接飞刀。要等排列修复、量能配合再考虑。'},
 {t:'s',q:'均线黏合缠绕意味着？',o:['趋势强健','即将退市','多空平衡、面临变盘选择','必然暴涨'],a:2,e:'黏合=各周期成本趋同、方向未定，是变盘前的典型形态，等待放量选择方向。'}]},
{id:'m07',t:'均线的支撑与压力',c:`<p>均线为什么会有"魔力"？因为它代表<b>一批人的平均成本</b>——成本决定行为：</p>
<ul><li><b>支撑</b>：上升趋势中股价回落到MA5/MA10/MA20附近，持币者觉得"回到我的成本附近可以买"，产生买盘 → 回踩获支撑</li>
<li><b>压力</b>：下跌趋势中股价反弹到均线附近，套牢者想"回本就卖"，产生卖盘 → 反弹受阻</li>
<li><b>角色互换</b>：跌破的均线从支撑变压力（${termSpan('支撑压力互换')}），收复后压力又变回支撑</li>
<li>判断支撑/压力是否有效，看<b>量能</b>：缩量回踩=抛压小，支撑可靠性高；放量砸破=支撑失效</li></ul>`,
tip:'训练场模式B的核心题型就是"这里是支撑还是压力"。要素：趋势方向+价格与均线关系+量能。',
qs:[
 {t:'s',q:'上升趋势中股价缩量回踩MA5附近并企稳，最合理的解读是？',o:['支撑有效，抛压不大','即将破产退市','必须立即清仓','均线失去意义'],a:0,e:'上升趋势+缩量回踩均线=典型的健康支撑测试：卖压小，买方惜售，趋势大概率延续。'},
 {t:'j',q:'股价放量跌破MA20后，该均线由支撑转为压力的可能性增大。',a:true,e:'支撑压力互换：有效跌破后，原支撑位聚集的套牢盘会在反弹时卖出，形成压力。'},
 {t:'m',q:'判断均线支撑是否有效，关键观察？（多选）',o:['回踩时的量能（缩量更好）','趋势方向（上行趋势的支撑更可靠）','是否放量砸破','股票代码好不好听'],a:[0,1,2],e:'量能与趋势是判断支撑压力的核心；代码与行情无关。',oe:['缩量回踩＝抛压轻、支撑更可靠；放量砸向支撑要警惕','上行趋势的支撑有人接；下跌趋势中的支撑常失效','放量跌破＝支撑失效警报，必须机械执行纪律','股票代码与行情没有任何关系']}]},
{id:'m08',t:'乖离率：涨太远会回头',c:`<p><b>${termSpan('乖离率')}（BIAS）= (收盘价 − MA) / MA × 100%</b>，衡量价格偏离均线的程度。</p>
<ul><li>价格远离均线 → 近期买入成本远低于现价 → 获利盘随时可能兑现 → <b>回归压力</b></li>
<li>正乖离过大（如对MA5偏离15%+）：短线过热，追高风险大，等回踩</li>
<li>负乖离过大：超跌，可能出现技术性反弹（但下跌趋势中超跌反弹不是抄底理由）</li>
<li>乖离是"弹簧"：拉得越远，回缩力越强。但强趋势里乖离可以长期保持高位——别单独用</li></ul>`,
tip:'训练场模式A里，看到"股价远高于MA5+高位放量"的组合，猜跌的胜率会显著提升——自己验证。',
qs:[
 {t:'s',q:'股价相对MA5的正乖离率达到15%以上（平时约3%），短线最需要警惕的是？',o:['退市风险','乖离过大，随时可能回踩均线','必然继续大涨','成交量消失'],a:1,e:'正乖离过大=短期获利盘巨大，价格向均线回归的压力大，追高短线风险高。'},
 {t:'j',q:'负乖离过大说明可能超跌，出现技术性反弹的概率增加，但不能单独作为抄底依据。',a:true,e:'超跌反弹是概率现象；下跌趋势中超跌反弹后往往继续下跌，需结合趋势与量能。'},
 {t:'s',q:'乖离率BIAS对MA5的计算公式是？',o:['(收盘价−MA5)/MA5×100%','MA5/收盘价','收盘价×MA5','(最高价−最低价)/收盘价'],a:0,e:'BIAS=(收盘价−均线值)/均线值×100%，衡量价格偏离均线（平均成本）的程度。'}]},
{id:'m09',t:'均线的滞后性：后视镜原理',c:`<p>均线是<b>后视镜</b>：它反映的是"已经发生"的平均成本，永远慢半拍。</p>
<ul><li>周期越长的均线越滞后：MA5当天就能反应，MA250要几个月才拐头</li>
<li>滞后性的代价：<b>买不到最低点，也卖不到最高点</b>——均线信号注定"右侧交易"</li>
<li>滞后性换来的东西：<b>不追涨杀跌</b>。均线过滤掉了大部分假信号，让你只在趋势确认后行动</li>
<li>参数别乱改：新手用默认参数（5/10/20/60）就够，频繁调参=曲线拟合自欺</li></ul>`,
tip:'有人调MA3/MA7想更快——结果假信号翻倍。先练好默认参数，一年后再谈优化。',
qs:[
 {t:'j',q:'均线是右侧交易工具，信号注定滞后于价格底部和顶部。',a:true,e:'均线由历史收盘价计算，天然滞后。它换来的是过滤假信号、顺应趋势。'},
 {t:'s',q:'关于自定义均线参数，对新手的建议是？',o:['每天换一套参数','优先用默认参数（5/10/20/60）并练熟','参数越怪越赚钱','必须用MA13'],a:1,e:'频繁调参是曲线拟合自欺。默认参数是市场共识，共识本身产生支撑压力效应。'},
 {t:'s',q:'MA250比MA5滞后得多的根本原因是？',o:['计算量更大','它平均了250天的历史数据，对单日变化更不敏感','它只属于长线庄家','软件显示延迟'],a:1,e:'周期越长，单日价格在平均值中权重越小，均线变化越缓慢滞后。'}]},
{id:'m10',t:'均线实战三问（本关总结）',c:`<p>任何时刻看盘，用均线系统问自己三个问题：</p>
<ul><li><b>第一问·趋势</b>：均线什么排列？（多头/空头/黏合）→ 决定你站在哪一边</li>
<li><b>第二问·位置</b>：价格在MA5/MA20之上还是之下？乖离多大？→ 决定现在是追、等回踩、还是观望</li>
<li><b>第三问·信号</b>：最近有没有金叉/死叉/支撑压力测试？量能配合吗？→ 决定具体关注点</li></ul>
<p>三问都答完，你对这只股票的"短线体检报告"就出来了。把它用在训练场模式A：先回答三问，再猜明天。</p>`,
tip:'本关学完，去挑战第2关闯关考试。通过后你在训练场的难度可以升到L2（加入换手率与量比）。',
qs:[
 {t:'m',q:'均线实战三问包括？（多选）',o:['趋势：均线什么排列？','位置：价格与均线的关系和乖离？','信号：金叉死叉与量能配合？','明天必涨还是必跌？'],a:[0,1,2],e:'均线系统回答趋势、位置、信号三个结构问题；"必涨必跌"是市场无法回答的问题。',oe:['第一问方向：均线排列决定多空环境','第二问位置：价格与均线的距离（乖离）决定追还是等','第三问信号：交叉与量能配合确认时机','「明天必涨必跌」市场无法回答——问错问题是亏损的开始']},
 {t:'s',q:'均线三问中，"多头排列+价格乖离过大"最合理的应对思路是？',o:['趋势健康立即追高','趋势向上但短线过热，等回踩均线再观察','立即清仓做空','与均线无关'],a:1,e:'趋势与位置冲突时：方向可以对，但要等更好的位置——顺势而不追高。'},
 {t:'j',q:'先看排列定方向，再看位置定节奏，最后看信号找确认——这个顺序符合均线分析框架。',a:true,e:'先框架后细节：排列→位置→信号，是从宏观到微观的正确顺序。'}]}
]},
{ i:'l3', n:'第3关 · 量价关系', icon:'📊', desc:'成交量是市场的汽油表：价格会骗人，量很难骗人', lessons:[
{id:'v01',t:'成交量：市场的体温',c:`<p>${termSpan('成交量')}=当天成交的股票总数（手）。它是当天<b>参与的活跃资金总量</b>，市场的体温计。</p>
<ul><li>量大=分歧大：想买的和想卖的都很多，真金白银在换手</li>
<li>量小=分歧小：要么都惜售（涨不动也没人卖），要么都没兴趣（没人买也没人卖）</li>
<li>注意：A股成交量按"买入方和卖出方各记一次"统计，1000手成交=买入1000手+卖出1000手</li>
<li>${termSpan('成交额')}=成交量×成交价，更真实反映资金参与度（高价股1手抵低价股10手）</li></ul>`,
tip:'看量永远用"对比"：今天 vs 昨天之前5天的平均。绝对值没有意义，变化才有意义。',
qs:[
 {t:'s',q:'成交量突然放大到近5日平均的2倍，最直接的含义是？',o:['公司发布新产品','当天买卖分歧显著加大，真金白银大量换手','交易软件故障','必然要涨'],a:1,e:'放量=参与资金激增=分歧加大。方向要看价格与位置配合，放量大涨与放量大跌含义完全不同。'},
 {t:'j',q:'同样的成交量数值，成交额更大的股票说明参与资金更"重"。',a:true,e:'成交额=价格×数量，高价股同样的手数占用更多资金，成交额更真实反映资金规模。'},
 {t:'s',q:'为什么看量要"对比近期平均"而不是看绝对数值？',o:['绝对数值单位不统一','不同股票流通盘差异巨大，只有相对变化才有可比性','软件只显示百分比','绝对值会每天清零'],a:1,e:'小盘股与大盘股的量级差千倍，绝对值无意义。相对自身近期水平的变化才是信号。'}]},
{id:'v02',t:'放量与缩量',c:`<p>把今天的量和近5日均量比一比：</p>
<ul><li><b>放量</b>：明显高于均量（如1.5倍以上）——有新的大规模资金进出，趋势获得"燃料"或面临"分歧"</li>
<li><b>缩量</b>：明显低于均量（如0.7倍以下）——参与热情降温</li>
<li><b>关键认知</b>：放量本身无好坏——<b>放量的位置和方向</b>决定含义：
<br>· 低位放量上涨=资金进场　· 高位放量滞涨/下跌=资金出逃
<br>· 上涨中缩量回调=健康　· 上涨中缩量滞涨=动能衰竭</li></ul>`,
tip:'训练场模式D就是量价关系识别，把本课的四种组合练成本能反应。',
qs:[
 {t:'s',q:'高位出现"放量但价格不涨"（放量滞涨），最需要警惕的是？',o:['即将涨停','大量资金在高位换手出逃','成交量系统错误','缩量洗盘'],a:1,e:'高位放量滞涨=买盘接走了大量抛售=常见出货特征，是经典的风险信号。'},
 {t:'j',q:'上升趋势中的缩量回调（下跌但量很小）通常属于健康回调。',a:true,e:'缩量回调=卖压轻，只是买方暂歇，未出现恐慌性抛售，常见于健康趋势中。'},
 {t:'m',q:'以下属于"健康"量价组合的有？（多选）',o:['低位放量上涨','上涨中缩量回调','高位放量滞涨','下跌中缩量阴跌不止'],a:[0,1],e:'低位放量上涨=进场；缩量回调=抛压轻。高位放量滞涨是出货信号；持续阴跌量虽小但趋势坏。',oe:['低位放量上涨＝资金进场推动，最健康的启动结构','缩量回调＝卖压轻，上升趋势未被破坏','高位放量滞涨＝有人借高位派发，危险信号','缩量阴跌不止＝趋势持续走坏——量虽小但方向坏']}]},
{id:'v03',t:'量比：开盘后的热度计',c:`<p>${termSpan('量比')}= 开盘后每分钟平均成交量 ÷ 过去5个交易日每分钟平均成交量。</p>
<ul><li>量比>1：当前热度高于近期；<b>量比>2.5：显著放量</b>；量比>5：异常放量（大事发生）</li>
<li>量比主要在<b>盘中实时观察</b>用：开盘半小时量比3倍以上，说明今天资金关注度明显异于往常</li>
<li>量比低（<0.5）：今天市场对该股冷淡</li>
<li>注意：量比随时间推移逐渐"失真"（越到收盘越接近1），上午看更有意义</li></ul>`,
tip:'盘中看一只股票异动，先看量比再看涨幅：量比2.5+的上涨比量比0.8的上涨可信得多。',
qs:[
 {t:'s',q:'量比2.5表示？',o:['当前每分钟成交是过去5日同期均量的2.5倍','股价涨了2.5%','换手率2.5%','当天成交2.5亿'],a:0,e:'量比=当前每分钟均量/过去5日每分钟均量，2.5倍=显著放量。'},
 {t:'j',q:'量比在收盘前会自然趋近于1，所以上午的量比参考价值更高。',a:true,e:'越接近收盘，当日累计越完整、与均量的差异越小，量比钝化，上午观察更有意义。'},
 {t:'s',q:'开盘半小时量比只有0.6且股价微跌，说明？',o:['资金关注度低、走势平淡','即将涨停','主力正在扫货','必然放量'],a:0,e:'量比<1=当前热度低于近期常态，资金参与冷淡，多半是随波逐流的平淡走势。'}]},
{id:'v04',t:'换手率：筹码换手的温度（重点课）',c:`<p><b>${termSpan('换手率')}= 当日成交量 ÷ 流通股本 × 100%</b>——今天有多少比例的流通筹码换了主人。这是A股短线最重要的单一指标之一。</p>
<ul><li><b>&lt;3%</b>：冷清，随波逐流　<b>3%~7%</b>：相对活跃　<b>7%~15%</b>：高度活跃，资金博弈激烈</li>
<li><b>&gt;15%</b>：极端换手——高位出现=筹码大转移（常见主力出货或剧烈分歧）；低位出现=可能是筹码集中过程</li>
<li>同量级比较才有意义：大盘蓝筹换手2%已算活跃，小盘次新常日换手20%+</li>
<li>换手率与位置结合才是王道：<b>低位放量高换手=关注机会；高位放量高换手=高度警惕</b></li></ul>`,
tip:'把"换手率×位置"刻进本能：训练场A模式里，高位+换手率15%+的题，答案往往藏在分歧二字里。',
qs:[
 {t:'s',q:'一只主板股票连涨50%后，某天换手率达到18%，最典型的解读是？',o:['筹码高度锁定','高位极端换手，筹码大转移，警惕主力出货','即将除权','成交系统故障'],a:1,e:'高位+极端换手=大量获利筹码换手离场，是最经典的风险组合之一。'},
 {t:'j',q:'换手率7%~15%区间表示筹码高度活跃，资金博弈激烈，需结合位置判断多空含义。',a:true,e:'7-15%是高度活跃区，方向含义取决于位置与价格配合。'},
 {t:'m',q:'关于换手率，正确的说法有？（多选）',o:['=成交量/流通股本×100%','>15%属于极端换手','大盘蓝筹与小盘股的"活跃"标准不同','换手率越高越好'],a:[0,1,2],e:'换手率高低本身无好坏，位置与配合决定含义，且不同股性股票的标准不同。',oe:['定义即公式：当日成交量÷流通股本×100%','超过15%＝筹码极端换手，常见于妖股爆炒或高位出货','大盘蓝筹3%已算活跃、小盘股10%才起步——标准因股性而异','换手率无好坏：高位高换手常是出货，低位高换手可能是启动']}]},
{id:'v05',t:'价涨量增：健康的上涨',c:`<p><b>价涨量增</b>（涨+放量）：上涨有真实买盘推动，是最"健康"的上涨组合。</p>
<ul><li><b>低位启动</b>：底部区域价涨量增=资金进场信号，值得重点关注</li>
<li><b>中段</b>：趋势中量价齐升=趋势健康，持股</li>
<li><b>高位</b>：涨了很多之后突然巨量长阳——小心！那可能是"最后的疯狂"（接盘踊跃，主力借机出货）</li>
<li>理想的量价节奏：涨时放量、调时缩量，一波比一波高</li></ul>`,
tip:'同样是价涨量增，位置不同含义天差地别——这是训练场D的核心考点。',
qs:[
 {t:'s',q:'底部横盘很久的股票，放量突破上涨，最合理的解读是？',o:['主力出货','低位价涨量增，资金进场的启动信号','成交异常','即将退市'],a:1,e:'低位+放量上涨=有资金真金白银进场推动，是底部启动的经典形态。'},
 {t:'j',q:'涨幅巨大之后出现的巨量长阳，仍可无条件视为健康信号。',a:false,e:'高位巨量长阳可能是最后的疯狂：买盘踊跃恰好方便获利盘大量兑现，要高度警惕。'},
 {t:'s',q:'健康上升趋势的量价理想节奏是？',o:['涨时缩量、跌时放量','涨时放量、调时缩量','量价毫无关系','每天成交量固定'],a:1,e:'涨有量=买盘真实，调缩量=抛压轻——这是教科书级的健康量价结构。'}]},
{id:'v06',t:'价涨量缩：要打问号的上涨',c:`<p><b>价涨量缩</b>（涨+缩量）：价格上涨但买盘没跟上，持续性打问号。</p>
<ul><li>一般情况：缩量上涨=买方犹豫，涨得勉强，容易回吐</li>
<li><b>例外</b>：筹码高度锁定的强势股/一字涨停板——没人卖所以量小，反而是强</li>
<li>判断方法：看<b>是否持续</b>。偶尔一天缩量上涨没意义；连续缩量滞涨+涨幅收窄=动能衰竭</li></ul>`,
tip:'缩量上涨的"强"只属于极少数锁仓股。新手把它一律当弱处理，胜率反而更高。',
qs:[
 {t:'j',q:'连续多日缩量上涨且涨幅收窄，通常提示上涨动能衰竭。',a:true,e:'量能持续萎缩+涨幅收窄=买力不足，上涨难以为继。'},
 {t:'s',q:'哪种情况下"缩量上涨"反而代表强？',o:['筹码高度锁定、持筹者惜售的强势股','每天成交几千手的冷门股','刚上市的次新股','跌停板上的股票'],a:0,e:'锁仓股无人卖、少量买盘即可推升价格，缩量反而是强势标志——但这需要其他证据（如沿均线强势）配合。'},
 {t:'m',q:'判断缩量上涨是否值得信任，应观察？（多选）',o:['是否连续多日缩量','涨幅是否持续收窄','是否属于筹码锁定型强势股','是否伴随高位换手率放大'],a:[0,1,2,3],e:'连续性、涨幅变化、股性、换手配合都是判断缩量上涨质量的维度。',oe:['一次性缩量上涨意义有限；连续多日缩量上移才是筹码锁定','涨幅持续收窄＝买力衰减，信任度要下调','筹码高度锁定的强势股，缩量上涨也能有效','若同时高位换手放大＝筹码在松动，要警惕']}]},
{id:'v07',t:'价跌量缩：正常的回调',c:`<p><b>价跌量缩</b>（跌+缩量）：下跌时卖压不重，多为正常回调。</p>
<ul><li>上升趋势中的缩量回调：抛压轻，趋势大概率延续——回调到均线缩量企稳是经典买点结构</li>
<li>下跌趋势中的缩量阴跌：虽然量小，但趋势向下，说明买盘同样稀少（没人卖也没人买）——缩量阴跌可以跌很久</li>
<li>低位长期缩量横盘：市场遗忘的角落，等待放量选择方向</li></ul>`,
tip:'别把"缩量跌"直接当"跌不动"——要看它处于什么趋势。趋势向下的缩量跌，跌起来没完没了。',
qs:[
 {t:'s',q:'下跌趋势中连续缩量阴跌，正确的理解是？',o:['抛压小即将反转','买盘同样稀少，趋势未改，可能持续阴跌','主力锁仓','必然暴涨'],a:1,e:'缩量阴跌=买卖双方都冷淡，没有反转动能，下跌趋势中可持续很久。'},
 {t:'j',q:'上升趋势中回调至MA20附近且缩量，是经典的风险较低的关注结构。',a:true,e:'趋势向上+回踩均线+缩量=抛压轻且支撑临近，是趋势跟踪者重点观察的结构。'},
 {t:'s',q:'"缩量下跌说明没人卖所以安全"，这句话错在哪？',o:['没说错','忽略了买盘——没人买的价格会阴跌不止','缩量必然伴随放量','只适用于大盘股'],a:1,e:'价格由买卖双方决定。缩量下跌若同时无人买，价格会持续阴跌，"没人卖"不等于"安全"。'}]},
{id:'v08',t:'价跌量增：警惕的下跌',c:`<p><b>价跌量增</b>（跌+放量）：大量筹码在下跌中换手，抛压沉重。</p>
<ul><li><b>高位放量下跌</b>：主力出货或恐慌踩踏——最危险的组合之一，破位（跌破MA20/关键均线）时必须警惕</li>
<li><b>低位放量下跌</b>：恐慌宣泄的最后阶段（卖压释放），或利空兑现——常接近阶段底部，但要等止跌信号</li>
<li>判断口诀：<b>位置+是否破位</b>。高位放量破位=跑；低位放量长阴后止跌企稳=关注</li></ul>`,
tip:'训练场A模式中，"高位+放量长阴+跌破MA20"三要素齐备时，未来5天偏跌的历史胜率明显更高——去验证。',
qs:[
 {t:'s',q:'高位股票某天放量长阴跌破MA20，教科书式的应对思路是？',o:['立即全仓抄底','视为趋势破坏的危险信号，控制风险','加仓摊薄成本','当作没看见'],a:1,e:'高位+放量+破位三要素齐备=趋势破坏信号，优先控制风险而非抄底摊平。'},
 {t:'j',q:'低位放量长阴若随后止跌企稳，可能是恐慌宣泄接近尾声的信号。',a:true,e:'低位恐慌性放量下跌=卖压集中释放，若止跌企稳，阶段底部概率增加（仍需确认）。'},
 {t:'m',q:'"高位放量下跌"的危险性来自？（多选）',o:['获利盘集中兑现','可能主力出货','若破位则趋势破坏','下跌必然很快反转'],a:[0,1,2],e:'高位放量下跌的三重风险：获利兑现、出货嫌疑、破位破坏趋势。反转并非必然。',oe:['高位获利盘丰厚，放量下跌＝集中兑现离场','主力出货常以放量下跌完成，接盘者高位站岗','放量跌破关键位＝趋势结构被破坏，必须离场','「必然很快反转」不存在——跌势接飞刀是新手大忌']}]},
{id:'v09',t:'量价背离：趋势的疲劳预警',c:`<p><b>${termSpan('量价背离')}</b>：价格创新高/新低，量能却没跟上——趋势"后继无人"。</p>
<ul><li><b>顶背离（量）</b>：价格创新高，成交量一波比一波小——买盘衰竭，上涨动力不足（注意：这与MACD指标背离概念不同但精神相通）</li>
<li><b>底背离（量）</b>：价格创新低，但下跌的量能一波比一波小——卖压衰竭，接近阶段底部</li>
<li>背离是<b>预警</b>不是<b>指令</b>：背离出现后趋势可能还会延续一段时间，"背离可以再背离"</li></ul>`,
tip:'指标实验室打开MACD，对比价格新高时MACD红柱的高度变化——那是另一种背离（指标背离），第6关细讲。',
qs:[
 {t:'s',q:'股价连续创新高，但对应每波上涨的成交量一波比一波小，这是？',o:['量价齐升','量价顶背离：买盘衰竭的预警','健康上涨','缩量洗盘必然大涨'],a:1,e:'价新高量萎缩=买盘后继无力，是趋势疲劳的经典预警，但不是立即反转的指令。'},
 {t:'j',q:'出现量价顶背离后应立即清仓所有仓位。',a:false,e:'背离是预警不是指令，趋势可能在背离后延续（背离可再背离）。应提高警惕、收紧风控，而非机械操作。'},
 {t:'s',q:'量能底背离的特征是？',o:['价创新低但下跌量能一波比一波小','价量同创新低','量增价稳','涨停板增多'],a:0,e:'价创新低而量能递减=卖压衰竭，提示阶段性底部临近（需确认信号）。'}]},
{id:'v10',t:'天量天价与地量地价（本关总结）',c:`<p>量能的两个极端：</p>
<ul><li><b>${termSpan('天量天价')}</b>：历史罕见的巨量出现在高位——筹码大规模换手，往往是重要转折区域（"天量见天价"）。注意：天量之后可能还有更高价，但风险收益比已很差</li>
<li><b>${termSpan('地量地价')}</b>：量能萎缩到极致——没人卖也没人买，抛压枯竭，常对应底部区域（"地量见地价"）。地量之后可能继续地量很久，需要放量确认启动</li>
<li><b>本关总结口诀</b>：量在价先看分歧，位置高低定乾坤；涨量跌缩是健康，天量地量看转折</li></ul>`,
tip:'第3关学完去闯关考试！通过后训练场解锁L2难度（叠加换手率/量比维度）。',
qs:[
 {t:'s',q:"'天量见天价'的核心逻辑是？",o:['成交量大会自动拉高价格','极端巨量意味着筹码大规模换手，常出现在重要转折区域','天量是软件显示错误','天量后必然跌停'],a:1,e:'历史级巨量=巨量分歧=筹码大换手，统计上常对应重要顶部/转折区域，但不能机械套用。'},
 {t:'j',q:'地量说明抛压枯竭，但见底还需要放量启动的确认信号。',a:true,e:'地量=卖压枯竭但买盘未必进场，可能长期地量横盘。等待放量确认才是完整的底部判断。'},
 {t:'m',q:'本关口诀"位置高低定乾坤"指的是？（多选）',o:['同样的放量，低位是进场、高位是出逃','同样的高换手，位置决定多空含义','量能分析必须结合价格位置','位置不重要量能最重要'],a:[0,1,2],e:'量能信号的方向含义高度依赖价格位置——这是量价分析第一原则。',oe:['低位放量＝进场，高位放量＝出逃——同样的量，相反的含义','同样是高换手：低位是启动、高位是派发','脱离价格位置谈量能，都是空中楼阁','这是反例：只看量不看位置，正是新手亏钱的常见原因']}]}
]}
]);

<script>/* ==== 21-curriculum2.js ==== */
'use strict';
/* ================= 课程数据 第4-9关 ================= */
CURRICULUM_add([
{ i:'l4', n:'第4关 · 分时图与盘口', icon:'⏱️', desc:'一天内部的战斗细节：分时线、均价线、盘口', lessons:[
{id:'f01',t:'分时图：一天的心电图',c:`<p>日K线是"一天的总结"，${termSpan('分时线')}则是"一天的过程"——把每分钟的成交价连成线，左边竖轴是价格，下面是每分钟成交量。</p>
<ul><li>分时线在<b>均价线</b>（黄线，当天成交的平均价格）上方运行=全天买方占优</li>
<li>分时线始终压在均价线下方=全天卖方占优，反弹到均价线附近常被压回</li>
<li>分时线的形态（冲高回落/低开高走/横盘）告诉你<b>当天资金的行为模式</b>，这是日K线看不到的细节</li></ul>`,
tip:'收盘后复盘不要只看日K，把当天的分时图调出来看一遍——它告诉你大阳线是早盘冲的还是尾盘拉的（含义完全不同）。',
qs:[
 {t:'s',q:'分时图中那条黄色曲线（均价线）代表？',o:['过去5日平均价','当天已成交的平均价格（加权）','昨天的收盘价','涨停价'],a:1,e:'均价线=当天截至当前时刻所有成交的加权平均价，代表今天买入者的平均成本。'},
 {t:'j',q:'分时线全天运行在均价线下方，说明当天买入的投资者大部分处于浮亏。',a:true,e:'现价低于当天平均成交价=今天买入的人平均被套，是当天卖方占优的表现。'},
 {t:'s',q:'同样是收大阳线，"尾盘半小时急拉"与"全天放量稳步上行"相比？',o:['尾盘急拉更可信','尾盘急拉的含金量通常更低，需警惕次日回落','两者完全等价','都与量能无关'],a:1,e:'尾盘急拉耗时短、量能常常不足，可能是做收盘价行为，持续性通常弱于全天放量上行。'}]},
{id:'f02',t:'分时量能：脉冲与缩量',c:`<p>分时图下方的成交量柱是"当天的汽油表"：</p>
<ul><li><b>脉冲式放量</b>：某一两分钟突然巨量——大资金进出场动作，要看脉冲后价格站不站得住</li>
<li><b>温和放量</b>：量柱逐级抬升、价格稳步上行——最健康的分时上涨形态</li>
<li><b>无量阴跌/无量横盘</b>：全天缩量——关注度低，走势多半随大盘</li>
<li>看分时量口诀：<b>涨要有量，跌可缩量；脉冲看后续，温和最踏实</b></li></ul>`,
tip:'盘中看到巨量脉冲先别追：等脉冲结束看价格能否站稳脉冲高点，站不稳多是诱多。',
qs:[
 {t:'s',q:'分时图上出现一两分钟的巨量脉冲，正确的观察方式是？',o:['立即追入','等脉冲结束后观察价格能否站稳高点再判断','脉冲代表必然涨停','脉冲是系统错误'],a:1,e:'巨量脉冲=大资金动作，真假要看后续：站稳脉冲高点=承接有效；快速跌回=诱多或出货。'},
 {t:'j',q:'分时图上量柱温和放大配合价格稳步上行，是当天较健康的上涨形态。',a:true,e:'温和放量上行=买盘持续进场，没有极端脉冲，是教科书式的健康分时。'},
 {t:'s',q:'全天分时量能极度萎缩的股票，当天的走势多半是？',o:['暴涨','随大盘波动的平淡走势','跌停','连续脉冲'],a:1,e:'无量=无资金关注，走势缺乏自身动力，多半跟随大盘随波逐流。'}]},
{id:'f03',t:'内外盘：主动买与主动卖',c:`<p><b>${termSpan('内盘外盘')}</b>统计的是成交的"主动性"：</p>
<ul><li><b>外盘</b>：以<b>卖一价及以上</b>成交（买方主动抬高价格买）——买方主动性强</li>
<li><b>内盘</b>：以<b>买一价及以下</b>成交（卖方主动压低价格卖）——卖方主动性强</li>
<li>常规解读：外盘大于内盘=买方主动；内盘大于外盘=卖方主动</li>
<li><b>常见误读</b>：内外盘可被"对倒"操纵，且涨停时全是外盘、跌停时全是内盘（价格封死没有选择）——只做参考，不当依据</li></ul>`,
tip:'内外盘要结合价格位置：低位外盘持续放大=吸筹迹象之一；高位外盘虚大+价格滞涨=对倒诱多嫌疑。',
qs:[
 {t:'s',q:'外盘的含义是？',o:['以卖一价及以上成交的量（买方主动）','以买一价成交的量','过去的成交量','外国的交易量'],a:0,e:'外盘=买方主动提价成交的部分，反映买方主动性；内盘反之反映卖方主动性。'},
 {t:'j',q:'股票涨停封死时，内外盘数据失去常规参考意义。',a:true,e:'涨停价上只有买盘挂着、成交全记外盘，比例失真，此时内外盘不再反映常态的主动性对比。'},
 {t:'s',q:'高位股票外盘很大但价格涨不动，合理的怀疑是？',o:['买盘极强','对倒放量诱多，虚高的外盘掩护出货','即将除权','数据错误'],a:1,e:'外盘大价滞涨=有人主动买但价格不动，常是对倒制造活跃假象，高位出现要警惕出货。'}]},
{id:'f04',t:'五档盘口：挂单的博弈',c:`<p><b>${termSpan('五档盘口')}</b>= 买一到买五、卖一到卖五的挂单价格与数量，是"还没成交的意愿"：</p>
<ul><li>买盘挂大单托住价格=有人愿意接（托单）；卖盘挂大单压住价格=有人想出货（压单）</li>
<li><b>挂单可以撤</b>：大单挂着不成交随时可能撤掉——"托单诱多、压单吓筹"都是常见手法</li>
<li>真正有意义的不是单笔大单，而是<b>持续的模式</b>：卖压是否不断被吃掉、买盘是否不断上移</li>
<li>新手要点：盘口是"意愿"不是"结果"，成交（内外盘、分时量）才是结果</li></ul>`,
tip:'看盘口先看结果（成交）再看意愿（挂单）：价格持续上移+卖档不断被吃=真强；大托单+价格阴跌=假托。',
qs:[
 {t:'j',q:'盘口挂单是尚未成交的意愿，随时可以撤销，不能直接当作真实供需。',a:true,e:'挂单可撤可改，大单诱多/吓筹常见。挂单是意愿，成交才是结果。'},
 {t:'s',q:'价格持续上行且卖一至卖五的挂单不断被成交吃掉，说明？',o:['买方力量真实强劲','卖方强大','即将跌停','挂单全被撤光了'],a:0,e:'卖档被持续吃掉=主动买盘真实成交，价格上移有真实买力支撑。'},
 {t:'s',q:'买五位置挂着巨大托单但价格持续阴跌，最可能的解读是？',o:['托单必然守住价格','托单可能只是意愿展示，实际成交冷淡，警惕假托','即将涨停','系统卡顿'],a:1,e:'大托单+价格阴跌=挂单未转化为成交支撑，是典型的假托形态，不可依赖。'}]},
{id:'f05',t:'集合竞价：开盘价的诞生',c:`<p><b>${termSpan('集合竞价')}</b>决定开盘价，规则要记牢：</p>
<ul><li><b>9:15-9:20</b>：可挂单、<b>可撤单</b>——这期间的"虚假挂单"最多，参考价值低</li>
<li><b>9:20-9:25</b>：可挂单、<b>不可撤单</b>——这段的量价才是真金白银</li>
<li><b>9:25</b>：撮合出开盘价；9:25-9:30 可挂单但不撮合</li>
<li>看开盘强度：9:20-9:25 期间价格稳步抬升+量能放大=真实买盘；9:15 高挂、9:20 前撤光=诱多假象</li></ul>`,
tip:'想看懂开盘：直接看9:20之后的竞价走势，别被9:15-9:20的挂单骗了。',
qs:[
 {t:'s',q:'集合竞价中挂单后不可撤销的时间段是？',o:['9:15-9:20','9:20-9:25','14:57-15:00','全天'],a:1,e:'9:20-9:25只接受挂单不可撤单，因此这段的竞价量价最真实。'},
 {t:'j',q:'9:15-9:20期间的高价挂单可能在9:20前撤掉，制造虚假的强势开盘预期。',a:true,e:'可撤单时段的大单高挂是常见诱多手法，9:20前撤单后实际开盘可能很弱。'},
 {t:'s',q:'判断开盘强度，最应关注的是？',o:['9:15的挂单量','9:20-9:25的竞价价量变化','昨天收盘价','新闻数量'],a:1,e:'不可撤单时段的竞价才是真实供需，9:20-9:25的价格与量能决定开盘质量。'}]},
{id:'f06',t:'高开、低开与缺口',c:`<p>开盘价与昨日收盘价的对比是<b>隔夜情绪的温度计</b>：</p>
<ul><li><b>高开</b>：隔夜利多或资金抢筹；高开幅度大（如3%+）要小心"高开低走"的诱多</li>
<li><b>低开</b>：隔夜利空或抛压；低开高走收阳=承接有力</li>
<li><b>${termSpan('缺口')}</b>：开盘价与昨日最高/最低价之间的空档（跳空）。<b>向上跳空缺口</b>常成为后续回调的支撑；<b>向下跳空缺口</b>常成为反弹的压力</li>
<li>缺口三问：跳空原因？放量还是缩量？回补了吗？"放量跳空+不回补"是强趋势特征</li></ul>`,
tip:'训练场B模式会考"向上跳空缺口的支撑判断"：缺口+缩量回踩不破=强势支撑结构。',
qs:[
 {t:'s',q:'放量向上跳空缺口形成后一直不回补，通常说明？',o:['弱势特征','跳空买盘真实强劲，缺口区域构成支撑','必然大跌','成交异常'],a:1,e:'放量跳空=真金白银抢筹，不回补说明缺口位置有强承接，是强势特征。'},
 {t:'j',q:'大幅高开后全天持续走低收长阴（高开低走），常是诱多出货的分时形态。',a:true,e:'高开吸引跟风盘后全天派发=经典诱多出货走势，配合高位与放量时风险最大。'},
 {t:'s',q:'向下跳空缺口对后续反弹的作用通常是？',o:['支撑位','压力位','无关','必然回补后涨停'],a:1,e:'向下跳空区域套牢大量筹码，反弹至缺口处面临解套抛压，常构成压力。'}]},
{id:'f07',t:'尾盘异动：最后30分钟的秘密',c:`<p>14:30以后的走势有特殊意义——<b>尾盘是全天多空的"摊牌时刻"</b>：</p>
<ul><li><b>尾盘拉升</b>：可能是资金为次日高开做铺垫（真护盘），也可能是做收盘价的"画线"行为——看量：放量真拉、缩量假拉</li>
<li><b>尾盘跳水</b>：隔夜谨慎情绪或资金出逃，往往预示次日低开概率大</li>
<li><b>14:57-15:00</b>：沪深收盘集合竞价，收盘价由此产生——尾盘竞价异动直接影响日K线形态</li>
<li>规律：尾盘的动作对<b>次日开盘</b>有较强的惯性提示，但不是必然</li></ul>`,
tip:'复盘日历里记录"今天尾盘发生了什么"，一周后你就能体会到尾盘动作的惯性价值。',
qs:[
 {t:'s',q:'尾盘放量拉升与缩量拉升相比？',o:['缩量拉升更真实','放量拉升更可能有真实买盘，缩量拉升更像画线','两者无区别','都必然诱多'],a:1,e:'量是行为的证据：放量尾拉有真买盘；缩量尾拉只需少量资金即可画高收盘价，持续性差。'},
 {t:'j',q:'尾盘半小时持续跳水，往往预示次日开盘承压的概率较大。',a:true,e:'尾盘跳水反映资金离场避险情绪，对次日开盘有负面惯性提示（非必然）。'},
 {t:'s',q:'沪深市场的收盘价由什么产生？',o:['最后一笔成交','14:57-15:00收盘集合竞价撮合','主力随便定','次日开盘价'],a:1,e:'沪深收盘价由14:57-15:00的收盘集合竞价产生，尾盘竞价直接决定日K收盘形态。'}]},
{id:'f08',t:'分时实战三看（本关总结）',c:`<p>盘中任何时刻打开一只股票，按顺序三看：</p>
<ul><li><b>一看结果</b>：分时线与均价线的关系+分时量能形态——当天谁占优？量真不真？</li>
<li><b>二看意愿</b>：五档盘口的挂单模式+内外盘——意愿与结果一致吗？</li>
<li><b>三看位置</b>：当前价格在日K的什么位置（均线/前高/缺口）+大盘环境（情绪温度计）——个股行为放在市场背景里解读</li></ul>
<p>结果→意愿→位置，三步之后你对"此刻"的判断就有了完整框架。第9关的每日复盘会把它和日K框架合并成一套完整流程。</p>`,
tip:'第4关学完去闯关考试。分时盘口是"看盘的手感"，考试重点考概念与误读识别。',
qs:[
 {t:'m',q:'分时实战三看的正确顺序是？（多选，按顺序选前三项）',o:['一看结果：分时与均价线+量能','二看意愿：盘口挂单+内外盘','三看位置：日K位置+大盘环境','四看星座运势'],a:[0,1,2],e:'先看已发生的结果，再看挂单意愿，最后放进日线位置与市场背景——由实到虚的完整框架。',oe:['第一步看结果：分时与均价线、量能的客观状态','第二步看意愿：盘口挂单与内外盘揭示买卖决心','第三步放位置：放进日线位置与大盘环境定性质','星座运势与行情无关——练的是框架不是玄学']},
 {t:'s',q:'分时线与均价线的关系主要回答什么问题？',o:['公司基本面','当天多空谁占优','明年走势','涨停价是多少'],a:1,e:'分时与均价线=当天内部的强弱对比，是"当天谁占优"的最直接证据。'},
 {t:'j',q:'个股的分时行为需要放在大盘环境（市场情绪）中解读，脱离大盘看个股容易误判。',a:true,e:'90%的个股跟随大盘节奏。同样的分时形态，牛市与熊市中的含义完全不同。'}]}
]},
{ i:'l5', n:'第5关 · 市场情绪与涨跌停', icon:'🌡️', desc:'情绪是A股短线的天气预报：冰点、回暖、高潮、退潮', lessons:[
{id:'s01',t:'涨跌家数：市场的广度',c:`<p><b>${termSpan('涨跌家数')}</b>（市场宽度）= 全市场上涨/下跌股票的数量比。它比指数更真实——指数可能被权重股拉红，但涨跌家数骗不了人。</p>
<ul><li><b>上涨家数 &gt; 3000</b>：普涨日，赚钱效应广</li>
<li><b>涨跌各半</b>：结构性行情，指数涨跌参考意义弱化</li>
<li><b>下跌家数 &gt; 3500</b>：普跌日，指数微跌也藏不住亏钱效应</li>
<li><b>关键背离</b>：指数涨但下跌家数占多数（"指数失真"）——权重护盘、个股普跌，短线情绪实际偏弱</li></ul>`,
tip:'每天收盘记一下涨跌家数（情绪温度计会自动帮你记），一个月后你对"什么是正常的一天"就有体感了。',
qs:[
 {t:'s',q:'指数微涨但全市场下跌家数超过3000家，合理的解读是？',o:['普涨行情','指数失真：权重护盘掩盖了个股普跌，实际情绪偏弱','市场极强','数据错误'],a:1,e:'指数与宽度背离=权重拉动下的虚假强势，多数持仓实际在跌，短线情绪弱。'},
 {t:'j',q:'上涨家数反映赚钱效应的广度，比指数涨跌更能代表散户的真实体感。',a:true,e:'散户持有的大多是中小市值个股，涨跌家数比权重指数更贴近真实盈亏体感。'},
 {t:'m',q:'市场宽度（涨跌家数）数据可以帮助判断？（多选）',o:['当天是否普涨/普跌','指数涨跌的"含金量"','赚钱效应的广度','某公司的盈利能力'],a:[0,1,2],e:'宽度是市场层面的情绪指标，与个股基本面无关。',oe:['涨跌家数比直接反映当天普涨还是普跌','指数涨而家数跌＝权重拉的虚涨，宽度戳穿含金量','上涨家数占比就是赚钱效应的广度','公司盈利是基本面问题，与市场宽度无关']}]},
{id:'s02',t:'涨跌停制度：A股的特色战场',c:`<p><b>${termSpan('涨跌停板')}</b>限制单日最大波动：</p>
<ul><li><b>主板 ±10%</b>　<b>创业板/科创板 ±20%</b>　<b>北交所 ±30%</b>　<b>主板ST股 ±5%</b>（创业/科创板的ST仍为20%）</li>
<li><b>新股上市初期（前5个交易日）不设涨跌幅限制</b></li>
<li>涨停的意义：买方意愿强到"愿意排队买不到"；卖方惜售。涨停价上有巨量买单封住=<b>封单</b>，封单越大越强</li>
<li>涨停≠安全：封单可能被砸开（${termSpan('炸板')}），涨停次日也可能高开低走</li></ul>`,
tip:'涨停是A股情绪的原子弹：涨停数量是情绪温度计的核心输入之一。',
qs:[
 {t:'s',q:'创业板股票的日常涨跌幅限制是？',o:['±5%','±10%','±20%','±30%'],a:2,e:'创业板2020年注册制改革后为±20%；科创板同为±20%；主板±10%；北交所±30%。'},
 {t:'j',q:'主板ST股票的涨跌幅限制是±5%。',a:true,e:'主板ST类股票风险警示，涨跌幅限制收窄为±5%（创业板/科创板的ST仍为20%）。'},
 {t:'m',q:'关于"封单"，正确的理解有？（多选）',o:['封单=涨停价上的买单总量','封单越大买方意愿越强','封单可能被卖压砸开导致炸板','封单保证第二天必然涨停'],a:[0,1,2],e:'封单反映买方意愿强度，但可以被消耗（炸板），且不保证次日走势。',oe:['封单＝挂在涨停价上的买单总量，反映买方排队意愿','封单越大＝想买而买不到的资金越多，意愿越强','封单会被卖压逐步消耗，砸开就是炸板','封单只描述当下，对次日走势没有任何保证']}]},
{id:'s03',t:'涨停开板与打板',c:`<p><b>${termSpan('打板')}</b>= 在股票冲击涨停的瞬间买入，赌次日溢价。这是A股独有的短线打法，风险极高：</p>
<ul><li><b>涨停开板</b>：封住的涨停被卖压打开。开板后回封=分歧后一致（较强）；开板不回封=买力衰竭（危险）</li>
<li><b>炸板率</b>：当天冲击涨停后失败的占比。炸板率高=接力资金亏钱，情绪转弱信号</li>
<li>打板的数学：赚的是次日溢价（常常几个点），亏的是炸板+次日低开（可能十几个点）——盈亏比天然差，新手禁止碰</li>
<li>本课立场：<b>理解打板是理解情绪的必修课，但实操上新手永远不打板</b></li></ul>`,
tip:'训练场C模式会考"炸板率高说明什么"。记住：我们学打板是为了读懂情绪，不是为了去打板。',
qs:[
 {t:'s',q:'炸板率升高（冲击涨停失败的比例增加），通常说明？',o:['情绪走强','接力资金开始亏钱，情绪转弱','涨停变多了','指数必然上涨'],a:1,e:'炸板=追涨者被套。炸板率升高意味着短线接力亏钱效应扩散，情绪转弱。'},
 {t:'j',q:'涨停开板后快速回封，比开板后无力回封的走势更强。',a:true,e:'开板回封=经历分歧后买方重新掌控（分歧转一致）；开板不回封=买力衰竭。'},
 {t:'s',q:'本课程对新手参与打板的态度是？',o:['鼓励每天打板','理解其原理用于读情绪，实操上不参与（盈亏比差、风险极高）','打板稳赚不赔','打板是唯一正确方法'],a:1,e:'打板盈亏比天然失衡（赚小亏大），是高阶玩法。新手学习它是为了理解情绪机制，不是参与。'}]},
{id:'s04',t:'连板与连板梯队',c:`<p><b>${termSpan('连板')}</b>= 连续多天涨停。连板股构成当天的<b>梯队</b>：</p>
<ul><li><b>连板高度</b>：当天市场最高的连板数（如最高5连板）。高度=情绪的天花板：高度越高情绪越亢奋</li>
<li><b>梯队完整</b>：5板-3板-2板-首板各层级都有股票=情绪生态健康（"梯队不断层"）</li>
<li><b>断层</b>：高位板全断、只剩首板=高度坍塌，退潮信号</li>
<li>情绪温度计把"最高连板高度"作为核心输入：高度抬升期=情绪上行；高度坍塌期=退潮开始</li></ul>`,
tip:'每天看一眼"最高板是几板"，连续记录一周，你对情绪周期立刻就有体感——这是最快的情绪入门法。',
qs:[
 {t:'s',q:'"连板高度"指的是？',o:['涨停股的股价高度','当天市场最高连续涨停天数','指数涨幅','成交量高度'],a:1,e:'连板高度=当天最高连板数，是情绪天花板的直观度量。'},
 {t:'j',q:'连板梯队出现断层（高位板断裂、只剩首板）通常是情绪退潮的信号。',a:true,e:'高位板断裂=接力资金溃败，情绪生态坍塌，是退潮期的典型特征。'},
 {t:'s',q:'连板高度从4板抬升到6板的过程，对应的情绪阶段多半是？',o:['冰点','上行/高潮阶段','退潮','与情绪无关'],a:1,e:'高度抬升=赚钱效应正反馈加强，情绪处于上行至高潮阶段。'}]},
{id:'s05',t:'情绪周期：四季轮回',c:`<p><b>${termSpan('情绪周期')}</b>= 市场情绪的循环：像四季一样轮回，每个阶段有典型的数据特征：</p>
<ul><li><b>冰点期</b>：涨停少跌停多、连板高度1-2、炸板率高、缩量——亏钱效应顶峰，人人绝望</li>
<li><b>回暖期</b>：首板增多、出现2-3板、红盘家数回升——先知先觉资金试仓</li>
<li><b>高潮期</b>：涨停潮、高度5板+、放量——赚钱效应顶峰，人人亢奋</li>
<li><b>退潮期</b>：高位板炸板/断层、亏钱效应扩散——高位接力者开始亏钱</li>
<li>循环往复：退潮的尽头是冰点，冰点之后有回暖。情绪不会永远亢奋，也不会永远冰冻</li></ul>`,
tip:'情绪温度计的四个阶段标签就来自本课。每天开盘前看一眼当前阶段，再决定今天的"学习姿势"。',
qs:[
 {t:'s',q:'涨停稀少、跌停很多、连板高度只有1-2板、市场缩量，这是？',o:['高潮期','冰点期','回暖期','正常波动'],a:1,e:'涨停少+跌停多+高度坍塌+缩量=冰点期的典型数据特征。'},
 {t:'j',q:'情绪周期退潮期的尽头往往是冰点，冰点之后逐渐回暖，周而复始。',a:true,e:'情绪像四季轮回：退潮→冰点→回暖→高潮→再退潮，不看见底也不看见顶。'},
 {t:'m',q:'高潮期的典型数据特征包括？（多选）',o:['涨停数量大增','连板高度抬升','两市放量','跌停数量远超涨停'],a:[0,1,2],e:'高潮期=涨停潮+高度抬升+放量。跌停多于涨停是冰点期特征。',oe:['涨停家数大增＝赚钱效应扩散到最多个股','连板高度抬升＝情绪亢奋的标志性指标','两市显著放量＝场外资金蜂拥进场','跌停远超涨停是冰点期的特征，与高潮正好相反']}]},
{id:'s06',t:'冰点的机会与回暖的确认',c:`<p>情绪分析的价值在于"位置感"：</p>
<ul><li><b>冰点的意义</b>：恐慌盘集中释放后，抛压衰竭——历史上大级别反弹常从情绪冰点后启动。但冰点可能连续多日（"冰点有惯性"），抄底冰点不能急</li>
<li><b>回暖的确认信号</b>：①红盘家数连续回升 ②首板数量回升且炸板率下降 ③出现带动人气的2-3板 ④成交量温和放大——多个信号共振才算确认</li>
<li><b>新手策略</b>：不做预测，只做记录——每天记录情绪阶段，等你看懂了三轮完整的"冰点→回暖→高潮→退潮"，再谈利用周期</li></ul>`,
tip:'情绪温度计的30天历史曲线就是给你的"周期日记"。先看懂，再谈用。',
qs:[
 {t:'j',q:'情绪冰点出现后可以立即重仓抄底，因为冰点之后必然回暖。',a:false,e:'冰点有惯性，可能连续多日冰点。冰点只是"位置提示"，回暖需要多个信号确认。'},
 {t:'s',q:'以下属于"回暖确认信号"的是？',o:['跌停数量创新高','首板数量回升+炸板率下降+红盘家数连续回升','连板高度归零','两市成交极度萎缩'],a:1,e:'回暖确认需要多信号共振：红盘回升、首板增多且炸板率降、人气板出现、量温和放大。'},
 {t:'s',q:'本课建议新手利用情绪周期的正确姿势是？',o:['冰点满仓抄底','高潮满仓追涨','先每天记录观察，看懂完整周期后再谈利用','完全忽略情绪'],a:2,e:'先记录→看懂→再利用。没有三轮完整周期的观察，任何"抄底逃顶"都是赌博。'}]},
{id:'s07',t:'板块轮动：资金的水往低处流',c:`<p><b>${termSpan('板块轮动')}</b>= 资金在不同板块间循环迁移，像水流一样：</p>
<ul><li>典型路径：主线板块高潮→资金溢出→流向低位的关联板块（补涨）→主线退潮→资金寻找新主线</li>
<li><b>轮动信号</b>：主线板块滞涨+低位板块开始放量补涨=轮动进行中</li>
<li><b>一致性验证</b>：真主线=板块内个股普涨（广度大）；假主线=只有龙头独涨（广度小，难以持续）</li>
<li>复盘要点：每天记录"今天哪些板块涨幅前列+是否放量"，两周后你就能看出轮动节奏</li></ul>`,
tip:'情绪温度计页面会显示当天板块涨幅榜（数据来自行情接口），配合涨跌家数一起看。',
qs:[
 {t:'s',q:'主线板块滞涨、低位关联板块开始放量补涨，说明？',o:['轮动进行中','主线将永远上涨','市场要关闭','个股基本面突变'],a:0,e:'资金从高位主线溢出流向低位板块=板块轮动的典型过程。'},
 {t:'j',q:'只有一只龙头独涨、板块内其他股票不跟的"主线"，持续性通常较差。',a:true,e:'没有广度（板块普涨）的主线缺乏资金共识基础，难以持续，容易一日游。'},
 {t:'m',q:'判断一个板块是真主线还是一日游，可观察？（多选）',o:['板块内个股是否普涨','板块是否放量','是否出现板块内连板梯队','板块名字是否好听'],a:[0,1,2],e:'广度、量能、梯队是判断主线成色的三板斧；名字与行情无关。',oe:['板块内普涨＝资金成建制进入，不是只拉一只做诱饵','板块整体放量＝共识度高，持续性更强','出现连板梯队（龙头+跟风）＝主线的重要标志','板块名字与行情没有任何关系']}]},
{id:'s08',t:'龙头效应：羊群的头羊',c:`<p><b>${termSpan('龙头效应')}</b>：每个主线板块中涨得最早、最猛、辨识度最高的股票称为<b>龙头股</b>：</p>
<ul><li>龙头特征：最先涨停、连板最高、每次板块异动它都先动（"辨识度"）</li>
<li>板块内的资金分配规律：龙头吸走大部分资金与关注度，跟风股的涨幅与持续性显著弱于龙头</li>
<li><b>龙头的信号意义</b>：龙头见顶/断板往往先于板块走弱——龙头是板块情绪的"温度计中的温度计"</li>
<li>新手立场：学龙头效应是为了理解板块内部强弱结构，<b>不是让你去追龙头</b>（追高龙头是新手的头号亏损来源之一）</li></ul>`,
tip:'复盘时给每个活跃板块找出它的龙头，观察"龙头断板之日板块怎么了"——这是理解龙头效应最快的方法。',
qs:[
 {t:'s',q:'龙头股在板块中的典型特征是？',o:['涨得最慢','最先启动、连板最高、每次板块异动先动','成交量最小','永远不会跌'],a:1,e:'龙头=板块内辨识度最高的股票：先启动、高度最高、每次异动都打头阵。'},
 {t:'j',q:'板块龙头断板/见顶往往领先于板块整体走弱，因此龙头可作为板块情绪的先行指标。',a:true,e:'龙头是板块资金的核心载体，龙头的强弱变化领先于板块整体，是先行信号。'},
 {t:'s',q:'本课程对"追高买入龙头股"的立场是？',o:['鼓励新手追龙头','理解龙头效应用于分析，不追高（新手头号亏损来源之一）','龙头必涨','龙头与散户无关'],a:1,e:'龙头效应是分析工具；追高龙头盈亏比极差，是新手的典型亏损行为。'}]},
{id:'s09',t:'北向资金：聪明的钱？',c:`<p><b>${termSpan('北向资金')}</b>= 通过沪深股通买入A股的境外资金，历史上被称为"聪明钱"：</p>
<ul><li>历史意义：北向偏好大盘蓝筹与核心资产，其持续流入流出曾被视为中期风向标</li>
<li><b>重要变化</b>：2024年8月起，交易所已不再披露盘中实时北向净买入数据——"盘中北向流向"已成为历史，现在只能看到日度成交总额、定期持股数据等</li>
<li>正确姿势：别再找"实时北向资金"软件数据（那是估算或已停发）；看定期披露的持股变动与成交总额，作为中长期参考</li>
<li>同理：<b>${termSpan('两融余额')}</b>（融资融券余额）仍在每日盘后公布——融资余额上升=杠杆资金进场意愿增强，下降=去杠杆，是有效的风险偏好指标</li></ul>`,
tip:'旧教程里"看盘中北向资金"的方法已失效——本课帮你把认知更新到2026年。',
qs:[
 {t:'j',q:'2024年8月以来，交易所不再披露盘中实时北向净买入数据，所谓"实时北向流向"已不可得。',a:true,e:'沪深股通实时买卖净额披露已取消，仅保留日度成交总额与定期持股等披露。'},
 {t:'s',q:'现在观察外资动向，更可靠的方式是？',o:['看盘中实时北向净买入（已停发）','看定期披露的持股变动与成交总额','看自媒体估算','看运气'],a:1,e:'实时数据已停发，定期持股与成交总额是当前可得的合规观察口径。'},
 {t:'s',q:'两融余额持续上升，通常反映？',o:['杠杆资金风险偏好增强','市场关闭','外资撤离','成交量归零'],a:0,e:'融资余额上升=借钱炒股的资金增加=杠杆资金看多意愿增强，是风险偏好指标。'}]},
{id:'s10',t:'涨停基因与情绪放大器',c:`<p>为什么涨停板能放大情绪？因为它同时制造<b>稀缺性</b>和<b>示范效应</b>：</p>
<ul><li><b>稀缺性</b>：涨停买不到=想买的人排队=需求被"冻结"，次日开盘集中释放（溢价来源）</li>
<li><b>示范效应</b>：一只股票连板赚钱→模仿者涌入同板块→板块涨停潮→媒体传播→更多散户进场——正反馈循环</li>
<li>正反馈的尽头：最后一批进场的资金没有新接力者→正反馈断裂→退潮（跌得比涨得快，因为踩踏）</li>
<li>理解了这个循环，你就理解了为什么情绪总是"涨过头、跌过头"——<b>情绪的本质是正反馈与负反馈的交替</b></li></ul>`,
tip:'把涨停-正反馈-退潮的循环讲给朋友听，能讲明白就说明你真懂了情绪周期。',
qs:[
 {t:'s',q:'涨停次日溢价的来源主要是？',o:['公司分红','涨停当日需求被冻结，想买而未买到的资金次日集中买入','手续费下降','指数上涨'],a:1,e:'涨停封死=部分需求未成交=需求延后到次日释放，这是涨停溢价的机制来源。'},
 {t:'j',q:'情绪正反馈（赚钱效应吸引新资金→继续涨）断裂时，退潮往往比上涨更急促。',a:true,e:'下跌伴随踩踏式负反馈（亏钱效应→割肉→再跌），速度通常快于正反馈上涨。'},
 {t:'m',q:'涨停板的情绪放大机制包括？（多选）',o:['制造稀缺性（买不到）','示范效应（模仿盘涌入）','媒体与口口相传的扩散','降低公司市盈率'],a:[0,1,2],e:'稀缺+示范+传播构成正反馈三件套；市盈率与情绪放大无关。',oe:['涨停买不进＝制造稀缺性，强化「明天更高」的预期','龙头涨停有示范效应，模仿盘涌入同板块','媒体与口口相传把情绪向场外扩散','涨停改变的是情绪不是公司估值，与市盈率无关']}]},
{id:'s11',t:'把情绪数据变成判断：温度计的算法',c:`<p>本App情绪温度计的计算逻辑（简化版），你可以照着手工算：</p>
<ul><li>输入：涨跌家数比（权重最大）、涨停数-跌停数、炸板率、连板高度、两市成交额变化</li>
<li>输出：<b>0-100情绪分</b>。50为中位；65+高潮区；25以下冰点区</li>
<li>阶段判定：分数+与昨日的变化方向（升=回暖倾向、降=退潮倾向）</li>
<li><b>练习方法</b>：连续20个交易日，先自己给当天情绪打分（0-100），再对比温度计的分数——误差稳定在10分以内，你就出师了</li></ul>`,
tip:'训练场C模式（情绪推断）用的就是这套逻辑出题。20天打分练习+20道C模式题=情绪盘感速成。',
qs:[
 {t:'s',q:'情绪分65以上且较昨日上升，温度计最可能标注的阶段是？',o:['冰点期','高潮期','退潮期','无法判断'],a:1,e:'65+进入高潮区，配合升势标注高潮期（或高潮持续）。'},
 {t:'j',q:'情绪分从70降到55（跌破高潮线但仍在50上方），温度计会倾向提示退潮风险。',a:1,e:'大幅回落+跌破高潮区=退潮预警，这正是"分数+变化方向"的判定逻辑。'},
 {t:'s',q:'训练自己情绪盘感的方法是？',o:['每天猜涨跌停个股','连续20日先自评情绪分再对照温度计校准','只看指数','靠感觉'],a:1,e:'自评+对照校准是技能训练的标准闭环：先预测、再反馈、后修正。'}]},
{id:'s12',t:'情绪运用总纲（本关总结）',c:`<p>第5关总结，情绪数据的三层用法：</p>
<ul><li><b>第一层·感知</b>：每天知道市场处于什么阶段（温度计直接给）——这是底线，必须做到</li>
<li><b>第二层·校准</b>：用阶段校准自己的操作冲动——冰点期想抄底的冲动、高潮期想追涨的冲动，都要先过一遍"现在是情绪的什么位置"</li>
<li><b>第三层·等待</b>：高手用情绪定节奏——冰点观察名单、回暖试仓、高潮管住手、退潮空仓学。注意：这仍是概率思维，不是确定性指令</li>
<li><b>红线重申</b>：情绪分析是"天气预报"不是"指令"。它提高的是胜率，不保证单次结果</li></ul>`,
tip:'第5关内容最多（12课），学完去闯关考试，通过后训练场C模式（情绪推断）会重点强化。',
qs:[
 {t:'m',q:'情绪数据的三层用法是？（多选）',o:['感知：知道当前阶段','校准：用阶段约束操作冲动','等待：用周期定观察节奏','赌：冰点满仓抄底'],a:[0,1,2],e:'感知→校准→等待是渐进的学习路径；"赌"恰恰是情绪分析要防止的行为。',oe:['第一层感知：先分清当前处于哪个阶段','第二层校准：用阶段约束自己的操作冲动','第三层等待：用周期规律安排观察与出手节奏','冰点满仓抄底＝把情绪分析当赌博借口，恰是要防止的']},
 {t:'s',q:'高潮期最需要对抗的心理冲动是？',o:['抄底冲动','追涨冲动','空仓冲动','销户冲动'],a:1,e:'高潮期赚钱效应顶峰，追涨冲动最强，而这正是风险最大时刻——用"阶段意识"对抗冲动。'},
 {t:'j',q:'情绪分析提高的是长期胜率，不保证任何单次判断的结果。',a:true,e:'概率思维是本App的底色：任何分析工具都只改变概率分布，不决定单次结果。'}]}
]},
{ i:'l6', n:'第6关 · 技术指标', icon:'🧮', desc:'MACD、RSI、KDJ、BOLL：指标是价格的"导数"，先懂原理再用', lessons:[
{id:'i01',t:'MACD的构成：DIF、DEA与柱',c:`<p><b>${termSpan('MACD')}</b>是最常用的趋势类指标，由三部分组成：</p>
<ul><li><b>DIF（白线/快线）</b>：12日指数均线 − 26日指数均线——短期与长期动能的差值，反映<b>动能的方向与强弱</b></li>
<li><b>DEA（黄线/慢线）</b>：DIF的9日平均——DIF的平滑版</li>
<li><b>柱状线</b>：(DIF−DEA)×2——DIF与DEA的差距，柱子放大=动能增强，柱子缩短=动能减弱</li>
<li>人话总结：MACD回答的问题是"上涨/下跌的<b>动能</b>是在增强还是衰竭"</li></ul>`,
tip:'在指标实验室打开MACD副图，对着一段上涨行情观察：柱子最长的地方往往不是价格最高点——动能领先于价格。',
qs:[
 {t:'s',q:'MACD中DIF的计算是？',o:['12日EMA−26日EMA','9日均线','收盘价的方差','成交量比值'],a:0,e:'DIF=12日指数均线−26日指数均线，衡量短长期动能差。'},
 {t:'j',q:'MACD柱状线持续缩短（即使价格仍在涨），提示上涨动能正在减弱。',a:true,e:'柱=DIF−DEA的差距，持续缩短=动能衰减，是趋势疲劳的领先提示。'},
 {t:'s',q:'MACD本质上回答的问题是？',o:['公司赚不赚钱','趋势动能的增强与衰竭','明天开盘价','市盈率高低'],a:1,e:'MACD是动能指标：通过均线差值刻画趋势的"油门"与"刹车"。'}]},
{id:'i02',t:'MACD金叉死叉与零轴',c:`<p>MACD的信号规则：</p>
<ul><li><b>金叉</b>：DIF上穿DEA——动能转强信号；<b>死叉</b>：DIF下穿DEA——动能转弱</li>
<li><b>零轴的意义</b>：DIF在零轴上方=短期均线在长期均线上方（多头环境）；零轴下方=空头环境</li>
<li><b>位置决定质量</b>：零轴上方附近的金叉（"零上金叉"）质量高；深跌后的零下金叉多为反弹信号</li>
<li>注意滞后：MACD信号比K线形态更慢（两次平滑），适合确认趋势，不适合抓拐点</li></ul>`,
tip:'指标实验室里把MACD打开，找出最近一次零上金叉，看看之后5-20天的表现——建立自己的统计感。',
qs:[
 {t:'s',q:'"零轴上方的金叉"比"零轴下方的金叉"通常质量更高，因为？',o:['颜色更好看','零上=多头环境中的动能转强，趋势背景支持','参数更大','随机波动'],a:1,e:'零轴上方=均线多头环境，此时金叉是顺势信号；零下金叉多为下跌中的反弹。'},
 {t:'j',q:'MACD经过双重平滑，信号滞后性比单均线更明显，适合确认趋势而非抓拐点。',a:true,e:'两次平滑换取稳定，代价是更滞后——MACD是"确认型"指标。'},
 {t:'s',q:'DIF跌破零轴意味着？',o:['12日EMA下穿26日EMA，短周期均势转空','涨停','成交量放大','除权'],a:0,e:'DIF=12EMA−26EMA，跌破零轴即短期均线下穿长期均线，均势转空。'}]},
{id:'i03',t:'MACD背离：价格与动能的分歧',c:`<p><b>${termSpan('指标背离')}</b>是MACD最有价值的应用：</p>
<ul><li><b>顶背离</b>：价格创新高，MACD（DIF或柱）一波比一波低——涨价的"油"在减少，上涨动力透支的预警</li>
<li><b>底背离</b>：价格创新低，MACD一波比一波高——下跌动能衰竭的预警</li>
<li>背离是<b>预警不是指令</b>："背离之后还有背离"，强趋势中顶背离可以连续出现多次而价格继续涨</li>
<li>提高可靠性：背离+量价背离（第3关）+高位置，三者共振时预警价值大增</li></ul>`,
tip:'指标实验室找出一段历史顶背离（价新高+MACD降低），统计它之后10天的表现——大多数时候你会看到"警惕是对的，但不立即跌"。',
qs:[
 {t:'s',q:'价格创出新高但MACD的DIF一波比一波低，这是？',o:['MACD金叉','顶背离：上涨动能衰竭的预警','底部信号','正常现象无意义'],a:1,e:'价新高+动能降低=顶背离，提示上涨透支，是预警信号。'},
 {t:'j',q:'出现顶背离后应立即清仓，因为背离必然导致下跌。',a:false,e:'强趋势中背离可连续多次出现而价格续涨。背离是预警，应提高警惕而非机械操作。'},
 {t:'m',q:'让背离预警更可靠的条件包括？（多选）',o:['与量价背离同时出现','出现在明显高位/低位','多个指标同时背离','背离当天是周五'],a:[0,1,2],e:'共振（量价+指标+位置）是可靠性的来源；星期几无关。',oe:['指标背离与量价背离同时出现＝双重确认','高位顶背离/低位底背离才有大意义，半山腰的背离常失效','多个指标同时背离时，预警价值大增','星期几与背离有效性毫无关系']}]},
{id:'i04',t:'RSI：相对强弱与超买超卖',c:`<p><b>${termSpan('RSI')}</b>（相对强弱指标）衡量一段时间内<b>上涨力量占比</b>（常用14日，范围0-100）：</p>
<ul><li>RSI&gt;70：超买区——涨得急了，回调风险累积（强趋势中可长期钝化在70上方）</li>
<li>RSI&lt;30：超卖区——跌得急了，反弹概率累积</li>
<li>RSI=50中轴：多空平衡</li>
<li><b>钝化警告</b>：真正的强趋势中RSI可以"钝化"——在超买区停留几周而价格继续涨。超买≠立刻跌，超卖≠立刻涨</li>
<li>RSI的背离用法与MACD类似：价创新高+RSI降低=顶背离预警</li></ul>`,
tip:'震荡市里RSI的70/30规则胜率高；单边趋势里RSI钝化严重——先判断市场是趋势还是震荡，再决定信不信RSI。',
qs:[
 {t:'s',q:'RSI进入70以上的超买区，正确的理解是？',o:['必然立即下跌','涨势急促、回调风险在累积，但强趋势中可能长期钝化','马上涨停','指标坏了'],a:1,e:'超买=短期涨速过快的统计状态，是风险提示；趋势行情中RSI钝化是常见现象。'},
 {t:'j',q:'震荡市中RSI超买超卖的回归规律比单边趋势中更有效。',a:true,e:'震荡市价格围绕中枢波动，超买回落/超卖反弹的规律兑现率高；趋势市钝化严重。'},
 {t:'s',q:'RSI=50附近代表？',o:['多空力量平衡','超买','超卖','停牌'],a:0,e:'50是多空中轴，附近代表上涨与下跌力量大体均衡。'}]},
{id:'i05',t:'KDJ：敏感的短线摆动指标',c:`<p><b>${termSpan('KDJ')}</b>是最敏感的常用摆动指标（基于9日最高最低价的相对位置）：</p>
<ul><li>K线、D线在0-100间摆动：<b>80以上超买、20以下超卖</b>；J值可超出0-100（J&gt;100极端超买、J&lt;0极端超卖）</li>
<li>信号：K上穿D金叉（超卖区金叉价值大）、K下穿D死叉</li>
<li><b>特点双刃剑</b>：敏感=拐点反应快，但<b>假信号多</b>（频繁金叉死叉），必须配合趋势过滤——只做顺势方向的KDJ信号</li>
<li>与RSI/MACD的分工：KDJ管"短期拐点"、MACD管"趋势动能"、RSI管"涨跌力度占比"</li></ul>`,
tip:'新手用KDJ只记一条：下跌趋势中的KDJ金叉不看，上升趋势中回踩出现的KDJ金叉才值得看。',
qs:[
 {t:'s',q:'KDJ指标最大的特点是？',o:['非常迟钝','灵敏但假信号多，需配合趋势过滤','只能用于周线','与价格无关'],a:1,e:'KDJ敏感=拐点反应快+假信号多。过滤方法是只认顺势方向的信号。'},
 {t:'j',q:'下跌趋势中出现的KDJ金叉，单独作为买入依据的可靠性较低。',a:true,e:'逆势信号假信号率高。KDJ金叉需趋势背景支持（如上升趋势的回踩金叉）。'},
 {t:'s',q:'J值超过100通常代表？',o:['极端超买的短期过热状态','必然涨停','成交活跃','无意义'],a:0,e:'J值超出0-100范围代表短期的极端状态，J>100为极端超买，短线回调概率累积。'}]},
{id:'i06',t:'BOLL布林带：波动的轨道',c:`<p><b>${termSpan('BOLL')}</b>（布林带）= 中轨（20日均线）± 2倍标准差，构成价格波动的"统计轨道"：</p>
<ul><li><b>统计含义</b>：约95%的收盘价落在带内——触及上轨=短期偏热，触及下轨=短期偏冷</li>
<li><b>收口与开口</b>：带宽收窄（收口）=波动率压缩，往往是变盘前夜；开口放大=新一轮波动开始</li>
<li><b>轨道用法分市</b>：震荡市——上轨压力下轨支撑，区间操作思路；趋势市——价格沿轨道"爬带"（沿上轨上涨），中轨是趋势的生命线</li>
<li>与均线的关系：BOLL中轨就是MA20——布林带本质是"会呼吸的MA20"</li></ul>`,
tip:'指标实验室打开BOLL，找一段"长期收口后开口"的行情——多数大行情启动前都有收口阶段（波动率压缩）。',
qs:[
 {t:'s',q:'布林带显著收口（带宽变窄）通常提示？',o:['波动率压缩、市场积蓄变盘能量','必然大涨','趋势极强','成交放大'],a:0,e:'收口=波动率压缩到极致，历史统计上常对应变盘前的蓄势阶段（方向由突破决定）。'},
 {t:'j',q:'布林带中轨就是20日均线，趋势行情中价格回踩中轨常获得支撑。',a:true,e:'中轨=MA20。趋势市中中轨是趋势生命线，回踩中轨缩量企稳是经典结构。'},
 {t:'m',q:'关于布林带的正确用法有？（多选）',o:['震荡市参考上轨压力/下轨支撑','趋势市看价格沿轨道爬带','收口后关注开口方向','碰到上轨必然做空'],a:[0,1,2],e:'分市使用是关键：震荡用轨道、趋势用中轨、变盘看收口开口；机械"触上轨就反手"是误用。',oe:['震荡市：上轨压力、下轨支撑，用区间思路','趋势市：价格沿轨道「爬带」，中轨是趋势生命线','收口＝波动压缩蓄势，开口方向跟随突破的量价','「碰上轨必然做空」是误用——趋势市沿上轨爬带会被反复打脸']}]},
{id:'i07',t:'筹码分布：成本的地图',c:`<p><b>${termSpan('筹码分布')}</b>（成本分布）估算各价位上堆积的持仓量，是一张"全体持仓者的成本地图"：</p>
<ul><li><b>密集峰</b>：筹码大量堆积的价格区。当前价在密集峰上方=峰区是支撑（套牢盘已解放，获利者惜售）；在下方=峰区是压力（解套抛压）</li>
<li><b>获利比例</b>：当前价下方的筹码占比。获利盘90%+的高位=随时可兑现的获利筹码巨大；获利盘10%的低位=抛压接近枯竭</li>
<li><b>筹码转移</b>：低位峰消失、高位峰形成=筹码从低位持有者转移到高位接盘者（出货完成的标志）</li>
<li>注意：筹码分布是<b>估算</b>（基于历史成交换手的数学模型），不是真实数据——看结构，别抠数字</li></ul>`,
tip:'筹码分布与换手率是绝配：第3关学的"高位极端换手"在筹码图上的表现就是低位峰→高位峰的转移。',
qs:[
 {t:'s',q:'股价运行到上方筹码密集峰下方受阻，该峰区构成的是？',o:['支撑','压力（解套抛压区）','无影响','涨停板'],a:1,e:'上方密集峰=套牢盘集中区，价格反弹至此面临解套卖出压力，构成压力。'},
 {t:'j',q:'筹码分布图是基于换手数据的估算模型，应关注其结构形态而非精确数值。',a:true,e:'筹码分布由历史成交按算法估算得出，非真实持仓，看结构（峰的位置与转移）才有意义。'},
 {t:'s',q:'高位获利比例达到90%以上，最主要的风险含义是？',o:['安全垫厚','巨额获利筹码随时可兑现，回调兑现压力大','即将除权','主力锁仓'],a:1,e:'高位+获利盘90%=几乎人人赚钱，卖出兑现的动机与能力兼备，回调压力最大。'}]},
{id:'i08',t:'指标使用总则：本关总结',c:`<p>所有技术指标的共同点与使用纪律：</p>
<ul><li><b>指标都是价格的衍生</b>：MACD/RSI/KDJ/BOLL全部由价格（或量）计算而来——它们不是新信息，是价格的另一种"视角"（动能、位置、波动）</li>
<li><b>滞后性</b>：除KDJ等摆动指标略领先外，多数指标滞后于价格——指标确认趋势，价格才是本体</li>
<li><b>共振原则</b>：单一指标信号不行动；趋势（均线）+量能（量价）+指标（动能）三者共振，胜率才显著</li>
<li><b>不过度拟合</b>：改参数"优化"出完美历史曲线=自欺。默认参数练一年，胜过每月换参数</li>
<li><b>本App的指标观</b>：指标是第三优先级证据——第一是趋势位置（均线），第二是量价，第三才是指标。别把顺序搞反</li></ul>`,
tip:'第6关学完闯关考试！指标实验室的5个引导实验建议全做一遍——亲手开关指标比看十篇文章都有用。',
qs:[
 {t:'s',q:'技术指标的本质是？',o:['未来的预言','价格/成交量数据的另一种数学视角（动能、位置、波动）','主力资金的内部数据','独立于价格的新信息'],a:1,e:'所有指标都由价格量能计算而来，是衍生视角，不含未来信息。'},
 {t:'j',q:'本App的证据优先级：趋势位置（均线）>量价关系>技术指标。',a:true,e:'指标是第三优先级：先看趋势与位置，再看量价配合，指标只做动能确认。'},
 {t:'m',q:'指标使用的纪律包括？（多选）',o:['单一指标信号不单独行动','追求三者共振','不频繁调参过度拟合','指标信号出现立即满仓'],a:[0,1,2],e:'共振、克制、防拟合是指标纪律；"信号即满仓"是典型误用。',oe:['单一指标噪音多，不据此单独行动','追求趋势+量价+指标三者共振再动手','参数反复调到「历史最优」＝过拟合，实盘会失效','信号出现立即满仓＝没有仓位的赌博，不是纪律']}]}
]},
{ i:'l7', n:'第7关 · 交易成本与防骗', icon:'🛡️', desc:'先学会不亏在成本和骗子手里：新手最重要的4课', lessons:[
{id:'c01',t:'你的每一笔交易都在交税：佣金、印花税、过户费',c:`<p>交易的三项主要成本：</p>
<ul><li><b>${termSpan('佣金')}</b>：给券商的手续费，买卖双边收。常见约万分之2.5（0.025%）左右，可协商；<b>多数券商单笔最低5元</b>——小资金交易的实际费率被最低5元大幅抬高（1万元交易收5元=实际0.05%）</li>
<li><b>${termSpan('印花税')}</b>：给国家，<b>只在卖出时收</b>，目前为成交金额的万分之5（0.05%）——是最大的一笔</li>
<li><b>${termSpan('过户费')}</b>：成交金额的万分之0.1（0.001%），买卖双边收，金额很小</li>
<li><b>一买一卖的完整成本</b>：约0.1%~0.15%（含最低佣金影响）——看起来不多？一天进出一次，一年250个交易日就是25%+</li></ul>`,
tip:'打开工具箱的"交易成本计算器"，输入你的真实资金规模，看看频繁交易一年吃掉多少本金——大多数新手看完会沉默。',
qs:[
 {t:'s',q:'印花税的现行规则是？',o:['买卖双边各收0.05%','只在卖出时收0.05%','已取消','只对ST股收取'],a:1,e:'印花税仅在卖出环节收取，税率0.05%（2023年8月起减半征收后的标准）。'},
 {t:'j',q:'1万元的交易被"单笔最低5元佣金"抬高实际费率至0.05%，小资金频繁交易成本更高。',a:true,e:'最低佣金对小额交易的实际费率有显著放大效应，频繁交易的小资金最受伤害。'},
 {t:'s',q:'一买一卖合计交易成本约占0.1%~0.15%，若每天买卖一次，一年的成本约为本金的？',o:['忽略不计','约25%以上','约1%','负数'],a:1,e:'0.1%×250个交易日=25%+。频繁交易的成本长期看足以吞噬大部分收益。'}]},
{id:'c02',t:'T+1与频繁交易的数学陷阱',c:`<p><b>${termSpan('T+1')}</b>制度：今天买入的股票<b>明天才能卖出</b>（今天卖出得到的资金今天可继续买）。</p>
<ul><li>T+1的意义：买入当天你无法止损逃跑——每一笔买入都带着"隔夜风险"，所以买入前的思考必须比卖出更慎重</li>
<li><b>频繁交易的数学陷阱</b>：胜率55%的短线客，若盈亏比只有1:1，扣完成本后是<b>稳定亏损</b>——成本是胜率的天敌</li>
<li>算一笔账：胜率55%、每次赚亏都是2%、日频交易：期望=55%×2%−45%×2%−0.12%成本=0.08%/次 → 看似微利，但胜率波动几个点就会变成稳定亏损</li>
<li>结论：<b>降低频率本身就是收益率</b>。新手把"每天交易"换成"每周复盘"，收益曲线会明显改善</li></ul>`,
tip:'模拟盘里故意做两组对照实验：一组每天交易、一组每周只动一次，一个月后对比两条收益曲线——亲手验证比听课有用。',
qs:[
 {t:'s',q:'A股实行T+1制度，意味着？',o:['当天买入的股票最快次日才能卖出','当天买当天可卖','只能持有一个月','卖出资金次日到账'],a:0,e:'T+1=买入当日不可卖。卖出获得的资金当日可用于再买入。'},
 {t:'j',q:'胜率55%且盈亏比1:1的日内频繁交易者，扣除交易成本后期望收益接近零甚至为负。',a:true,e:'55%×盈−45%×亏≈0.1%毛利，被0.1%+成本吃光。胜率没有明显优势时，频率就是毒药。'},
 {t:'s',q:'T+1制度下，买入决策相比卖出决策应当？',o:['更随意','更慎重（买入后当天无法止损，承担隔夜风险）','无所谓','只看消息'],a:1,e:'买入当天丧失逃跑能力，隔夜风险不可控，买入前的检查清单必须更严格。'}]},
{id:'c03',t:'荐股群与"杀猪盘"：骗局的解剖',c:`<p>新手最大的亏损来源往往不是市场，而是<b>人</b>。典型骗局解剖：</p>
<ul><li><b>养鱼阶段</b>：免费拉你进"股票交流群"，群里"老师"每天晒收益、助理嘘寒问暖——建立信任</li>
<li><b>喂甜头阶段</b>：给几次准确"预测"（实为群内分角色演戏：托儿众多，有人晒盈利截图）——让你尝到甜头</li>
<li><b>宰杀阶段</b>：诱导转战"内部平台/APP"（非正规券商）入金，前期让你小额提现成功，大额入金后平台跑路或"亏光"——这就是${termSpan('杀猪盘')}</li>
<li><b>变种</b>：直播间喊单、公众号带单、社交平台"股神"私聊、以" excessive 收益截图"诱惑的都不是例外</li>
<li><b>识别铁律</b>：①承诺收益=骗子 ②拉你入非正规平台=骗子 ③晒收益截图=可伪造 ④真正的投顾有牌照且不承诺收益</li></ul>`,
tip:'把"承诺收益=骗子"这条铁律讲给家人。A股历史年化顶尖水平也就15-25%区间，宣称月收益10%+的都是骗局。',
qs:[
 {t:'s',q:'"老师"在群里承诺每月收益20%并带你操作，这是？',o:['正规投顾','典型骗局信号：承诺收益本身就违法且必为骗局','运气好的股神','可以小额试试'],a:1,e:'承诺具体收益=违法违规+骗子标配。正规投顾不承诺收益。任何"保证收益"直接拉黑。'},
 {t:'j',q:'引导你下载非正规渠道"内部交易APP"并入金的，几乎可以确定是诈骗平台。',a:true,e:'正规交易只通过持牌券商官方渠道。任何"内部平台"都是杀猪盘的宰杀场。'},
 {t:'m',q:'识别股票骗局的铁律包括？（多选）',o:['承诺收益=骗子','非正规平台入金=骗子','收益截图可伪造','群里有很多人都赚钱=可信'],a:[0,1,2],e:'群里的"盈利晒单"多由托儿批量伪造——"大家都赚钱"恰恰是骗局氛围营造手段。',oe:['承诺收益直接违反证券法规——说这话的必是骗子','正规券商之外的平台入金，钱进的是骗子口袋','收益截图可以批量伪造，不构成任何证据','群里「晒盈利」的多是托儿——大家都赚钱恰恰是骗局氛围']}]},
{id:'c04',t:'正规投顾与非法荐股：合规边界',c:`<p>荐股服务有严格的合规边界：</p>
<ul><li><b>合法投顾</b>：必须持有证监会颁发的证券投资咨询牌照，且<b>不得承诺收益、不得代客操作、不得分成</b>——三条红线全无的"服务"都有问题</li>
<li><b>非法荐股常见形态</b>：无牌照收费荐股、直播间喊单分成、社交平台带单、"会员制"炒股群</li>
<li><b>官方核验渠道</b>：中国证监会官网、中国证券业协会官网可查询持牌机构与人员名单——遇到"老师"先查牌照，查无此人即骗子</li>
<li><b>本App立场</b>：本App是学习工具，不荐股、不给出任何买卖指令、不承诺任何收益——这是合规红线也是课程红线</li></ul>`,
tip:'收到任何"荐股服务"推销，第一步：去中国证券业协会官网查牌照。十秒钟避免一场灾难。',
qs:[
 {t:'s',q:'正规证券投资顾问的合规红线是？',o:['可以承诺收益','不得承诺收益、不得代客操作、不得收益分成','可以代客炒股','可以随时电话催单'],a:1,e:'持牌投顾三不得：不承诺收益、不代客操作、不分成。违反任一条即违规。'},
 {t:'j',q:'遇到荐股服务可在中国证监会或中国证券业协会官网查询其牌照资质。',a:true,e:'持牌机构与人员均可官方查询。查无此人的"老师"一律当骗子处理。'},
 {t:'s',q:'"会员费8888元进群，老师每日荐股，涨幅分成30%"的模式是？',o:['正规投顾服务','典型非法荐股：收费荐股+收益分成双重违规','慈善行为','银行理财'],a:1,e:'无牌照收费荐股本身违法，收益分成更触碰投顾红线。双重违规=标准骗局结构。'}]}
]},
{ i:'l8', n:'第8关 · 风险与纪律', icon:'⚖️', desc:'活下来永远排在赚钱前面：仓位、止损、盈亏比与心理', lessons:[
{id:'r01',t:'仓位管理：新手的第一护身符',c:`<p><b>${termSpan('仓位管理')}</b>= 决定"买多少"的规则。它比"买什么"更重要：</p>
<ul><li><b>为什么仓位第一</b>：买什么决定单次输赢，仓位决定你能否活到下次。满仓一错即重伤，轻仓十错可恢复</li>
<li><b>新手仓位参考</b>：单只个股不超过总资金的20-30%；总仓位随情绪周期调节（冰点可半仓试、高潮期降低仓位、退潮期以学习为主）</li>
<li><b>仓位与确定性挂钩</b>：证据越足（趋势+量价+情绪共振）仓位可略高；只有单一证据时必须轻仓——"证据给多少，仓位给多少"</li>
<li><b>永远保留现金</b>：满仓=放弃所有后续机会与纠错能力。空仓也是一种仓位</li></ul>`,
tip:'工具箱的仓位计算器会把"单笔最大亏损不超过总资金2%"变成精确的股数——把纪律交给计算器，别交给情绪。',
qs:[
 {t:'s',q:'仓位管理优先于选股的原因是？',o:['仓位决定单次输赢','仓位决定你能否在连续错误后存活并等到下一次机会','选股不重要','规则要求'],a:1,e:'选股影响单次结果，仓位决定生存能力。活得久才有复利，活着是第一目标。'},
 {t:'j',q:'证据越充分（趋势、量价、情绪共振），对应的仓位可以相应提高；单一证据必须轻仓。',a:true,e:'"证据给多少，仓位给多少"——把仓位与确定性挂钩是纪律化的核心。'},
 {t:'s',q:'满仓操作的最大代价是？',o:['手续费增加','丧失纠错能力与所有后续机会','无法打新','看盘时间变长'],a:1,e:'满仓=现金为零=跌了无法补、机会来了没钱买、错了无法调。空仓本身也是仓位选择。'}]},
{id:'r02',t:'止损：给每笔交易装安全气囊',c:`<p><b>${termSpan('止损')}</b>= 亏损达到预设幅度时机械卖出。它是唯一能保证你"活下来"的工具：</p>
<ul><li><b>止损位的设定逻辑</b>：不是"亏几个点心疼"，而是"<b>买入理由被破坏的位置</b>"——依据MA5买入，跌破MA5=理由消失=离场；依据支撑位买入，破位=离场</li>
<li><b>预设,不改</b>：买入前写下止损位，触发即执行。盘中"再等等"是亏损扩大的万能配方</li>
<li><b>单笔风险2%法则</b>：单笔交易的最大亏损控制在总资金的1-2%——仓位=2%÷止损距离。止损5%则仓位40%封顶，止损2%仓位可至100%（新手仍建议减半）</li>
<li>止损后股价反弹很正常——止损的意义不是每次都卖在最低，而是<b>切断那一次致命的大亏</b>。十次止损九次反弹，第十次救你一命</li></ul>`,
tip:'模拟盘强制要求每笔交易记录"止损价"——把这个习惯带到真实账户之前，先在模拟盘练50笔。',
qs:[
 {t:'s',q:'设定止损位的正确逻辑是？',o:['亏5%就心疼','设在"买入理由被破坏"的关键位置（如跌破买入依据的均线/支撑）','随机设定','越高越好'],a:1,e:'止损位=买入逻辑的失效点。理由破坏即离场，与"心疼程度"无关。'},
 {t:'j',q:'止损十次九次止损后股价反弹，说明止损是无用功。',a:false,e:'止损的价值在切断尾部风险：一次未止损的大亏可以吞掉九次小止损的反弹。活着才有下次。'},
 {t:'s',q:'总资金10万，单笔风险2%，止损距离5%，最大仓位应为？',o:['10万全仓','约4万（2%×10万÷5%=4万）','1万','20万'],a:1,e:'仓位=单笔风险额÷止损距离=2000÷5%=4万。工具箱的仓位计算器就是这条公式。'}]},
{id:'r03',t:'止盈：把浮盈变成真盈的纪律',c:`<p><b>${termSpan('止盈')}</b>的难点：卖飞了懊悔、卖晚了回吐——解法是<b>分批+规则</b>：</p>
<ul><li><b>移动止盈（跟踪止损）</b>：盈利后把止损位跟着趋势上移（如跌破MA5/MA10离场）——让利润奔跑，趋势破坏才下车。趋势股的主流方法</li>
<li><b>目标止盈</b>：买入时设定目标位（如前高/压力位/盈亏比3:1对应位置），到位分批兑现。震荡股的主流方法</li>
<li><b>分批原则</b>：如涨10%兑现1/3、涨20%再兑现1/3、剩余用移动止损跟随——兼得"落袋"与"奔跑"</li>
<li><b>禁止的行为</b>：盈利后把止损位"放宽"（把止盈单变成扛单）；凭感觉全清或全留</li></ul>`,
tip:'模拟盘交易时先写下止盈规则再下单——一周后回看：有规则的交易和没规则的交易，心情和结果都不同。',
qs:[
 {t:'s',q:'趋势股最常用的止盈方法是？',o:['涨1%就卖','移动止盈：止损位跟随趋势上移（如跌破MA10离场）','永不卖出','跌了再买'],a:1,e:'趋势股让利润奔跑，用移动止损跟随趋势；趋势破坏才离场。'},
 {t:'j',q:'盈利后将止损位向下放宽以"给股票更多空间"，本质是把纪律单变成扛单，风险巨大。',a:true,e:'放宽止损=推翻原有风控。浮盈回吐成亏损是"放宽止盈"的典型恶果。'},
 {t:'m',q:'止盈的分批策略优点包括？（多选）',o:['部分利润落袋安心里','保留部分仓位让利润奔跑','减少"卖飞/卖晚"的情绪折磨','保证卖在最高点'],a:[0,1,2],e:'分批=在确定与奔跑间取平衡；"保证最高点"是任何方法都做不到的。',oe:['先卖一部分落袋，浮盈变真盈，心态更稳','留底仓让利润奔跑，不与大趋势作对','分批把「卖飞/卖晚」两难拆成几次小决定，情绪负担小','没有任何方法能保证卖在最高点——那是幻想不是策略']}]},
{id:'r04',t:'盈亏比：胜率之外的另一半',c:`<p><b>${termSpan('盈亏比')}</b>= 平均单笔盈利 ÷ 平均单笔亏损。它与胜率共同决定长期盈亏：</p>
<ul><li>期望值 = 胜率×平均盈利 − 败率×平均亏损。<b>胜率50%+盈亏比2:1=稳定盈利</b>；胜率70%+盈亏比0.5:1=可能亏损</li>
<li><b>低胜率高盈亏比</b>（趋势跟踪）：十次对三次，但每次赚3份亏1份——活得很好，但需要忍受连续止损（心理难度大）</li>
<li><b>高胜率低盈亏比</b>（高频短线）：九次小赚一次大亏——体验舒服，但一次大亏吞掉全部，且成本杀伤力最大</li>
<li>下单价公式：目标位距入场 ≥ 2×止损距离才值得做（盈亏比≥2）；达不到就放弃这次机会——<b>会不做单，才算入门</b></li></ul>`,
tip:'工具箱的盈亏比计算器：入场价、止损价、目标价三个数字，一眼看出这笔交易值不值得做。',
qs:[
 {t:'s',q:'胜率50%、盈亏比2:1的策略长期期望是？',o:['稳定亏损','稳定盈利（0.5×2−0.5×1>0）','必然爆仓','无法判断'],a:1,e:'期望=0.5×2R−0.5×1R=+0.5R/笔。胜率一半也能盈利，这就是盈亏比的力量。'},
 {t:'j',q:'胜率70%但盈亏比只有0.5:1（赚小亏大）的策略，扣除成本后仍可能整体亏损。',a:1,e:'0.7×0.5−0.3×1=+0.05R毛利，微弱优势被交易成本与情绪化执行轻易摧毁。'},
 {t:'s',q:'入场价10元、止损9.7元，目标价至少多少才满足盈亏比2:1？',o:['10.3元','10.6元','10.1元','11元'],a:1,e:'止损距离0.3元，2倍即0.6元，目标≥10.6元。不足2:1的机会应当放弃。'}]},
{id:'r05',t:'最大回撤：账户的心脏承受力',c:`<p><b>${termSpan('最大回撤')}</b>= 账户净值从最高点跌到最低点的最大幅度。它是衡量风险的终极指标：</p>
<ul><li><b>回撤的数学残酷性</b>：亏50%需要涨100%才回本；亏20%只需涨25%。<b>深回撤是复利的坟墓</b></li>
<li>回撤来源：重仓单票（集中风险）、无止损（尾部风险）、情绪化加仓（越亏越买）</li>
<li><b>风控目标</b>：新手把账户最大回撤控制在15%以内——达成手段正是前四课：分散仓位+单笔2%+机械止损+不逆势加仓</li>
<li>模拟盘的净值曲线会自动统计你的最大回撤——先在模拟盘把回撤练进15%以内，再谈真钱</li></ul>`,
tip:'查看"我的"页的模拟盘统计：最大回撤超过15%说明风控有漏洞，回去检查仓位与止损执行率。',
qs:[
 {t:'s',q:'账户亏损50%后，回本需要的涨幅是？',o:['50%','100%','25%','75%'],a:1,e:'1→0.5需涨回1.0即+100%。回撤越深回本越难，深回撤是复利的坟墓。'},
 {t:'j',q:'控制最大回撤的手段包括分散持仓、单笔风险限额、机械止损、不逆势加仓。',a:true,e:'四件套对应四类回撤来源：集中、尾部、无纪律、情绪化。'},
 {t:'s',q:'模拟盘净值从最高点回撤了20%，按照本课目标应当？',o:['加大仓位尽快回本','视为风控警报：检查仓位、止损执行率与情绪化操作','无视它','销户重来'],a:1,e:'回撤超限=风控故障信号。加大仓位"快速回本"是回撤扩大的标准剧本。'}]},
{id:'r06',t:'散户三大心理偏差',c:`<p>行为金融学总结的三大亏损心理，人人都有，先认识再对抗：</p>
<ul><li><b>${termSpan('损失厌恶')}</b>：亏1万的痛苦≈赚2万的快乐——导致"不愿止损"（不卖就不算亏）+ "过早止盈"（落袋心安）。对策：机械止损+分批止盈，把决策交给规则</li>
<li><b>追涨杀跌（羊群效应）</b>：涨了怕错过（FOMO）追高、跌了恐慌割肉——高买低卖的机制根源。对策：交易计划前置（第8关第7课），情绪温度计做"冲动刹车"</li>
<li><b>确认偏误</b>：买入后只看利好、屏蔽利空——持仓改变判断。对策：每笔持仓写下"什么情况说明我错了"（即止损位），定期找反方证据</li>
<li><b>元规则</b>：情绪出现=风险时刻。手痒、心慌、亢奋时：不看盘，只执行已有计划</li></ul>`,
tip:'复盘日记里加一栏"今天的情绪状态"——两个月后你会发现：亏损最大的交易，90%发生在情绪最激动的日子。',

{id:'r07',t:'交易计划：把冲动关进流程',c:`<p><b>${termSpan('交易计划')}</b>= 买入前必须写完的检查清单。没写完，不许下单：</p>
<ul><li><b>计划六要素</b>：①买入理由（依据哪个指标/结构）②仓位（按2%法则算出）③止损位（理由破坏点）④目标位/止盈规则 ⑤失效条件（什么情况主动认错离场）⑥情绪自评（今天状态1-5分，低于3分禁止交易）</li>
<li><b>执行纪律</b>：盘中只执行计划，不产生新计划（盘中起意=情绪交易）。每天收盘后统一复盘与制定次日计划</li>
<li><b>复盘闭环</b>：每笔平仓后回填"计划执行度"——按计划执行但亏了=好交易（流程正确）；没按计划赚了=坏交易（强化坏习惯）</li>
<li><b>本App对应</b>：模拟盘强制填写理由与止损=交易计划的落地训练</li></ul>`,
tip:'模拟盘每笔交易的"理由必填"设计就来自本课——先在模拟盘把流程跑成本能。',
qs:[
 {t:'m',q:'交易计划六要素包括？（多选）',o:['买入理由与仓位','止损位与止盈规则','失效条件与情绪自评','明天大盘必然涨跌的预测'],a:[0,1,2],e:'计划管的是"自己怎么做"，不是"市场怎么走"。预测不是计划的必要项。',oe:['为什么买、买多少——理由与仓位是计划的地基','错了在哪走（止损）、对了怎么兑现（止盈规则）','什么信号证明逻辑失效＋写下当时情绪，供复盘对照','预测明天涨跌不是计划要素——计划管自己，不管市场']},

{id:'r08',t:'幸存者偏差与回测局限（本关总结）',c:`<p>最后一课是最重要的清醒剂：</p>
<ul><li><b>${termSpan('幸存者偏差')}</b>：你看到的"成功案例"（股神、晒单、涨停复盘）是从小部分幸存者中筛选出来的——同期死掉的大量失败者不会发声。晒单群里"月赚20%"的老师，背后是统计上必然存在的运气者</li>
<li><b>回测局限</b>：本App训练场的历史回放成绩再好，也存在——①幸存者偏差（训练池以现存热门股为主，退市股不在池中）②未来函数（你知道这是"历史"）③无情绪干扰（真钱下注的心理压力完全不同）④样本有限</li>
<li><b>正确的定位</b>：训练场练的是"读盘的技能"，不是"赚钱的保证"。技能迁移到实盘还要过三关：真钱心理关、仓位纪律关、成本关</li>
<li><b>本关总结</b>：风控四件套（仓位/止损/盈亏比/回撤）+心理三防（损失厌恶/追涨杀跌/确认偏误）+流程一道（交易计划）=活下来的完整体系。<b>学完本关，你已具备散户中最稀缺的东西：纪律框架</b></li></ul>`,
tip:'第8关学完闯关考试。这一关的分数比任何技术分析关都重要——它决定你能不能活到用技术的那天。',
qs:[
 {t:'s',q:'"晒单群里月赚20%的老师"最合理的解释是？',o:['真实水平','幸存者偏差：大量失败者不发声，运气好者被筛选出来展示','内幕消息','数学必然'],a:1,e:'任何大群体中必然存在连续运气好者。展示幸存者、隐藏死掉者=幸存者偏差的教科书应用。'},

 {t:'m',q:'风控体系的组成部分包括？（多选）',o:['仓位管理','机械止损','盈亏比筛选','凭感觉重仓'],a:[0,1,2],e:'四件套+心理防线+交易计划构成完整体系；"凭感觉重仓"是体系的天敌。',oe:['仓位管理＝第一护身符，决定单笔最大损失','机械止损＝给每笔交易装安全气囊','盈亏比筛选＝只做值得做的结构','凭感觉重仓是风控体系的天敌']}]}

{ i:'l9', n:'第9关 · 综合实战', icon:'🏆', desc:'把九关所学串成一套每日流程：复盘、盘前、案例', lessons:[
{id:'z01',t:'每日复盘五步法',c:`<p>收盘后15分钟，按五步走（本App"练习→复盘日记"就是按这个流程做的模板）：</p>
<ul><li><b>第一步·市场体检</b>（2分钟）：情绪温度计阶段？涨跌家数？两市量能与昨日比？——给今天的市场定性</li>
<li><b>第二步·热点扫描</b>（3分钟）：涨幅榜板块哪些放量？哪些板块有梯队？龙头是谁？——记录轮动线索</li>
<li><b>第三步·自选体检</b>（5分钟）：每只自选股过"均线三问"（排列/位置/信号）+量价关系——更新健康度</li>
<li><b>第四步·交易核对</b>（3分钟）：今天（或模拟盘）的操作是否按计划执行？情绪自评几分？</li>
<li><b>第五步·明日计划</b>（2分钟）：写下明天要观察的1-3个具体信号（不是"看看"，是可验证的条件）</li></ul>`,
tip:'复盘日记模板已内置五步。坚持21个交易日，你的复盘速度会从15分钟缩到5分钟，而质量更高。',

 {t:'s',q:'"明日计划"的合格标准是？',o:['写下可验证的具体条件（如"XX回踩MA20缩量则关注"）','写"明天看看情况"','预测明天大盘点位','什么都不写'],a:0,e:'计划=可验证条件。模糊的计划无法执行也无法复盘。'},
 {t:'j',q:'复盘时发现"操作没按计划但赚钱了"，正确处理是记为坏流程并在日记中标注。',a:1,e:'赚坏钱强化坏习惯。复盘评估的是流程执行度，不是单次盈亏。'}]},
{id:'z02',t:'盘前检查清单',c:`<p>开盘前5分钟（9:15-9:25竞价时间正好利用），过一遍清单：</p>
<ul><li><b>①市场面</b>：昨夜外围（美股指数/大宗）无极端？今日无重大事件预期？情绪温度计当前阶段？</li>
<li><b>②自选面</b>：自选股有无隔夜公告/异动？集合竞价高低开幅度？9:20-9:25竞价强度如何？</li>
<li><b>③计划面</b>：昨晚复盘的"明日观察条件"今天是否触发？触发条件=按计划行动；未触发=不动</li>

{id:'z03',t:'综合案例一：低位启动的全流程解读',c:`<p><b>案例背景（历史教学案例）</b>：某主板股票长期下跌后横盘3个月，某天放量突破。</p>
<ul><li><b>均线视角</b>：MA5/10/20长期黏合后首次发散向上，价格站上全部均线——黏合后的第一次方向选择（第2关知识）</li>
<li><b>量价视角</b>：突破日成交量达5日均量2.5倍，换手率从2%跳到8%——低位放量高换手=资金进场（第3关知识）</li>
<li><b>分时视角</b>：突破当日分时线全天运行在均价线上方，尾盘放量封高不回落——全天买方掌控（第4关知识）</li>

  const isM=q.t==='m';
  const isAns=i=>isM?(Array.isArray(q.a)&&q.a.includes(i)):i===q.a;
  const pickedThis=i=>isM?(Array.isArray(picked)&&picked.includes(i)):(picked===i||picked===String(i));
  const CF=(typeof LSN_FIGS!=='undefined'&&LSN_FIGS.CONCEPT_FIGS)?LSN_FIGS.CONCEPT_FIGS:null;
  const ckf=(typeof LSN_FIGS!=='undefined'&&LSN_FIGS.conceptKeyOf)?LSN_FIGS.conceptKeyOf:null;
  const qo=Array.isArray(q.o)?q.o:[];
  const keys=qo.map(o=>patternKeyOf(o));
  const ckeys=qo.map(o=>(!patternKeyOf(o)&&ckf)?ckf(o):null);
  const hasOe=q.oe&&q.oe.length===qo.length;
  if(!hasOe&&!keys.some(Boolean)&&!ckeys.some(Boolean)){
    /* 判断题/选项无图可配：题干本身含形态/概念词 → 给一张「本题概念图示」 */
    const sq=ckf?ckf(q.q||''):null;
    const sp=patternKeyOf(q.q||'');
    if(!sq&&!sp)return '';
    const fig=sq?`<canvas data-ocfig="${sq}" style="width:min(250px,82vw)"></canvas>`
                :`<canvas data-oc="${sp}" style="width:min(250px,82vw)"></canvas>`;
    const dd=sq?(CF[sq].d):(PATTERNS[sp].d+(PATTERNS[sp].s?(' '+PATTERNS[sp].s):''));
    return `<div class="opt-charts"><div class="oc-t">🔍 本题概念图示</div>
      <div class="oc-row"><div class="oc-main">${fig}<div class="oc-d">${esc(dd)}</div></div></div></div>`;
  }
  const rows=q.o.map((o,i)=>{
    const key=keys[i],ck=ckeys[i];
    const ans=isAns(i),pk=pickedThis(i)&&!ans;
    const cls=(ans?'oc-right':'')+(pk?' oc-wrong':'');
    const ico=ans?'✅':'❌';
    const tag=ans?'（正确答案）':(pk?'（你选的）':'');
    let exp=(q.oe&&q.oe[i])||'';
    if(!exp&&key)exp=PATTERNS[key].d+(PATTERNS[key].s?(' '+PATTERNS[key].s):'');
    if(!exp&&ck&&CF&&CF[ck])exp=CF[ck].d;
    return `<div class="oc-row ${cls}"><span class="oidx">${'ABCD'[i]||i+1}</span><div class="oc-main">
      <div class="oc-name">${ico} ${esc(o)}${tag}</div>
      ${key?`<canvas data-oc="${key}" style="width:min(250px,82vw)"></canvas>`:''}
      ${ck?`<canvas data-ocfig="${ck}" style="width:min(250px,82vw)"></canvas>`:''}
      ${exp?`<div class="oc-d">${esc(exp)}</div>`:''}
    </div></div>`;}).join('');
  return `<div class="opt-charts"><div class="oc-t">🔍 逐选项解析${isM?'（多选：每一项单独判定）':'——对照图形理解每个选项'}</div>${rows}</div>`;
}

</script>

<script>/* ==== 22b-curriculum3.js ==== */
'use strict';
/* ================= 课程数据 第10-12关：期货 / 加密货币 / 基金（纯小白特化） ================= */
CURRICULUM_add([
{ i:'l10', n:'第10关 · 期货入门', icon:'🏭', desc:'保证金、杠杆、双向交易：先懂规则，永远别碰高杠杆', lessons:[
{id:'qh01',t:'期货是什么：一张"未来的合同"',c:`<p>${termSpan('期货合约')}= 一份<b>标准化的合同</b>：约定在将来某个时间、按某个价格、买卖某种东西（螺纹钢、黄金、原油、股指……）。它诞生于农产品市场：农民怕秋收时粮价暴跌，提前和买家签好价格——这就是期货的初心：<b>锁定价格</b>。</p>
<ul><li>人话：股票买的是"公司的一小块所有权"；期货签的是"未来的一张订单"</li>
<li>这张合同是标准化的（数量/质量/时间都定死），所以可以在交易所里<b>随时转让</b>——转让价差就是盈亏</li>
<li>99% 的个人投资者<b>不会走到交割那一天</b>，赚亏都来自"合同价格的波动"</li></ul>`,
tip:'训练场品种类别选"期货"（连续合约），感受一下商品价格的波动节奏和股票有何不同。',
qs:[
 {t:'s',q:'期货合约最准确的描述是？',o:['公司所有权的一部分','标准化的未来买卖合同，可随时转让','一种债券','银行的理财产品'],a:1,e:'期货=标准化合同：约定未来时间以约定价格买卖标的物，合同本身可在交易所转让，价差即盈亏。'},
 {t:'j',q:'期货诞生的初衷之一是让生产者提前锁定价格、规避价格波动风险。',a:true,e:'对——套期保值（避险）是期货的原始功能，投机是后来发展出的流动性行为。'},
 {t:'s',q:'绝大多数个人期货投资者的盈亏来自？',o:['持有商品到期交割实物','合同价格波动的转让价差','商品的利息分红','仓储费'],a:1,e:'个人户很少持有到期交割，盈亏来自开仓平仓之间的价格差。'}]},
{id:'qh02',t:'双向交易：跌了也能赚',c:`<p>股票只能"先买后卖"（涨了才赚）；期货<b>可以先卖后买</b>——这就是${termSpan('双向交易')}：</p>
<ul><li><b>做多</b>（买入开仓）：认为要涨 → 涨了平仓赚差价</li>
<li><b>做空</b>（卖出开仓）：认为要跌 → 先按现价"卖出合同"，跌了再"买回来平仓"，差价就是利润</li>
<li>人话：做空=先借别人的货按高价卖掉，等便宜了买回来还——"高卖低买"反过来做</li></ul>`,
tip:'训练场里你会看到期货连续合约下跌趋势往往比股票更陡——因为做空力量也能推动价格。',
qs:[
 {t:'s',q:'做空（卖出开仓）的盈利方式是？',o:['等分红','价格下跌后买回平仓，赚差价','拿利息','价格必须涨'],a:1,e:'做空=先卖后买：跌了才能低价买回平仓，价差为利润。'},
 {t:'j',q:'期货只能先买后卖，和股票一样。',a:false,e:'期货支持双向交易：先卖出开仓（做空）也合法，跌了反而盈利。'},
 {t:'s',q:'认为某种商品价格将要下跌，期货上正确的操作是？',o:['买入开仓','卖出开仓（做空）','放弃交易','买入并长期持有'],a:1,e:'看跌就做空：卖出开仓，跌了买回平仓获利。'}]},
{id:'qh03',t:'保证金与杠杆：10%的押金，100%的盈亏',c:`<p>买100万的股票要掏100万；但期货签100万的合同只需要交<b>${termSpan('保证金')}</b>（比如10万）——押金制度。这就是${termSpan('杠杆')}：</p>
<ul><li><b>10%保证金 = 10倍杠杆</b>：价格波动1%，你的盈亏是押金的10%</li>
<li>人话：借钱不用利息，但盈亏按<b>合同全额</b>计算——赚得快，亏得也快</li>
<li>股票一天跌10%是极限；期货10倍杠杆下，价格反向波动10%你的押金就<b>归零</b></li></ul>`,
tip:'把杠杆想成"油门"：技术好的人油门是效率，新手油门是事故。训练场里期货题波动明显更剧烈——先感受，别上实盘。',
qs:[
 {t:'s',q:'保证金10%意味着杠杆是多少倍？',o:['1倍','5倍','10倍','100倍'],a:2,e:'保证金比例的倒数即杠杆：10%→10倍。价格波动1%=押金盈亏10%。'},
 {t:'j',q:'10倍杠杆下，价格反向波动10%，押金将全部亏光。',a:true,e:'对——杠杆把波动放大10倍，10%反向波动=100%押金亏损（爆仓）。'},
 {t:'m',q:'关于杠杆，正确的认识有？（多选）',o:['杠杆放大盈利也放大亏损','杠杆越高越容易爆仓','杠杆是新手快速致富的工具','新手应远离高杠杆'],a:[0,1,3],e:'杠杆是中性的工具，但对新手=事故加速器。"快速致富"恰恰是爆仓最快的路径。'}]},
{id:'qh04',t:'逐日盯市与爆仓：当天结算，亏光就出局',c:`<p>期货实行<b>${termSpan('逐日盯市')}</b>（当日无负债结算）：每天收盘后按结算价把盈亏<b>真金白银划进划出</b>你的押金账户。</p>
<ul><li>亏到押金不够最低要求 → 通知<b>追加保证金</b>（补钱），补不上 → <b>强制平仓</b>（强平）</li>
<li><b>${termSpan('爆仓')}</b>：行情剧烈波动时可能来不及补，押金亏光甚至倒欠（穿仓）</li>
<li>和股票的本质区别：股票套了可以"躺平装死"，期货<b>没有躺平的资格</b>——每天都要结账</li></ul>`,
tip:'记住一句话：股票的亏损是"账面浮动"，期货的亏损是"每天真扣钱"。这是两种完全不同的心理压力。',
qs:[
 {t:'s',q:'保证金不足且未按时追加，会发生？',o:['自动加倍押金','强制平仓','变成股票','没有任何影响'],a:1,e:'保证金不足→追加通知→未补→期货公司强制平仓，损失即刻兑现。'},
 {t:'j',q:'期货亏损可以像股票一样"躺平装死"等回本。',a:false,e:'不能：每日盯市+保证金制度下，亏损每天实扣，扛单的结果是强平/爆仓。'},
 {t:'m',q:'"爆仓"的成因包括？（多选）',o:['杠杆过高','行情剧烈反向波动','未及时追加保证金','股票分红'],a:[0,1,2],e:'高杠杆+急行情+不补钱=爆仓三件套；与股票分红无关。'}]},
{id:'qh05',t:'主力合约与连续合约：看盘到底看哪个',c:`<p>同一个商品有<b>很多个月份的合同</b>同时在交易（螺纹钢2605、2610、2611……），其中<b>成交量、持仓量最大的那个</b>叫${termSpan('主力合约')}——它是"人气最旺的会场"。</p>
<ul><li>分析行情时用<b>${termSpan('连续合约')}</b>（主力的接力，如 RB0/rbm）：把各时期的主力拼接成一条不断线的历史</li>
<li>实盘下单要选主力合约：流动性好、买卖不愁；冷门月份点差大、进出困难</li>
<li>本训练场的"期货"类别用的就是连续合约数据（新浪 RB0/AU0……）</li></ul>`,
tip:'新手口诀：看行情看连续，下订单选主力，永远避开成交稀少的远月冷合约。',
qs:[
 {t:'s',q:'"主力合约"指的是？',o:['价格最高的合约','成交量与持仓量最大的月份合约','最早到期的合约','交易所指定唯一合约'],a:1,e:'主力=该商品当前人气最旺（量最大）的月份合同。'},
 {t:'j',q:'连续合约（如RB0）是把历史上各时期的主力拼接成的分析用序列。',a:true,e:'连续合约用于看长期走势，实际下单应选当前主力月份合约。'},
 {t:'s',q:'新手实盘选合约的正确做法是？',o:['随便选个便宜的','选成交活跃的主力合约','选最远月份','选跌得最多的'],a:1,e:'主力合约流动性最好，进出场成本低；冷月合约点差大、易被"关门"。'}]},
{id:'qh06',t:'交割与移仓：个人户的"最后期限"',c:`<p>期货合同有<b>到期日</b>。到期有两种结局：</p>
<ul><li><b>交割</b>：真的按合同买卖实物（个人投资者没有交割资格，到期前必须平仓）</li>
<li><b>移仓换月</b>：把快到期的仓位平掉，换到更远月份的合约上继续持有——持仓的"续命"动作</li>
<li>到期前的主力切换期：资金从旧月搬到新月，价格常出现异常波动、旧合约流动性骤降——<b>新手在这几天最容易踩坑</b></li></ul>`,
tip:'还记得交割日的意义吗？它正是第5关讲的"期货次日溢价"机制的源头——到期迫使了结，需求被时间锁住。',
qs:[
 {t:'j',q:'个人投资者一般无交割资格，合约进入交割月前必须平仓。',a:true,e:'对。个人户持仓进入交割月会被强制平仓，规则因品种略有差异，方向一致。'},
 {t:'s',q:'想把多头持仓"继续拿着"，到期前应该？',o:['装死不动','移仓换月：平旧月、开新月','加杠杆','卖出全部股票'],a:1,e:'移仓换月=平掉近月、开远月，保持方向敞口的同时避开交割。'},
 {t:'s',q:'主力换月期最需要警惕的是？',o:['分红到账','旧合约流动性骤降与异常波动','停牌','汇率变化'],a:1,e:'移仓期资金搬家，旧月合约点差扩大、价格易异常，是新手踩坑高发期。'}]},
{id:'qh07',t:'期货 vs 股票：五大区别一张表',c:`<p>把两个市场放一起看，区别一目了然：</p>
<ul><li><b>方向</b>：股票只能做多（A股）｜期货多空双向</li>
<li><b>资金</b>：股票全额｜期货保证金杠杆</li>
<li><b>结算</b>：股票浮亏不动钱｜期货每日盯市真扣钱</li>
<li><b>时间</b>：股票T+1可躺平｜期货有到期日+当日结算，不能躺</li>
<li><b>波动</b>：股票涨跌停10%/20%封顶｜期货部分品种无涨跌停或幅度不同，且杠杆放大一切</li></ul>
<p>结论：期货是<b>更专业、更快、更危险</b>的战场。对A股投资者而言，学期货的最大价值是理解商品周期与宏观联动，而不是去实盘。</p>`,
tip:'第12关还会看到基金 vs 股票的对照——三种工具三种性格，先认清再选。',
qs:[
 {t:'m',q:'期货与A股股票的区别包括？（多选）',o:['期货可双向交易','期货有保证金杠杆','期货每日盯市结算','股票可以长期躺平而期货不能'],a:[0,1,2,3],e:'四条全部成立——方向、资金、结算、时间维度都不同。'},
 {t:'j',q:'期货的波动经过杠杆放大后，风险显著高于同等资金规模的股票。',a:true,e:'杠杆放大是风险的本质来源。'},
 {t:'s',q:'A股投资者学习期货知识最有价值的收获是？',o:['马上开户实盘','理解商品周期与宏观联动、建立对冲思维','学会熬夜盯盘','找到暴富捷径'],a:1,e:'学习价值在认知升级：商品周期、宏观联动、风险边界。'}]},
{id:'qh08',t:'基差与升贴水：期货价和现货价的关系',c:`<p><b>${termSpan('基差')}</b> = 现货价格 − 期货价格。期货价反映的是<b>市场对未来的预期</b>：</p>
<ul><li>期货价 > 现货价：叫<b>升水</b>（市场预期未来更贵，常见于乐观预期或持仓成本）</li>
<li>期货价 < 现货价：叫<b>贴水</b>（预期未来更便宜，或近期现货紧俏）</li>
<li>随到期临近，期货价会向现货价<b>收敛</b>——这是套利力量保证的规律，也是理解"预期回归现实"的最好教材</li></ul>`,
tip:'把基差想成"期货对未来的投票"。第5关情绪周期讲的是情绪投票，基差是资金对基本面的投票。',
qs:[
 {t:'s',q:'基差的定义是？',o:['期货价−现货价','现货价−期货价','两份期货的价差','股票与基金的价差'],a:1,e:'基差=现货价−期货价（教材定义）；其正负反映现货与预期的相对强弱。'},
 {t:'j',q:'随着交割日临近，期货价格会向现货价格收敛。',a:true,e:'到期必须按现货结算，套利力量推动期现收敛。'},
 {t:'s',q:'期货价明显高于现货价（大幅升水），通常反映？',o:['市场预期未来供应宽松或持仓成本高','现货短缺','无意义','基差为零'],a:0,e:'升水=预期未来更贵（乐观/持仓成本），过高时也埋着回落风险。'}]},
{id:'qh09',t:'期货风险清单：新手远离高杠杆',c:`<p>期货的风险比股票高一个量级，本课把风险清单列全：</p>
<ul><li><b>杠杆爆仓</b>：第3-4课讲过，放大一切</li>
<li><b>隔夜跳空</b>：夜盘外消息导致开盘价大幅偏离，止损单可能成交在更差价位</li>
<li><b>流动性风险</b>：冷月合约想卖没人接（关门打狗）</li>
<li><b>移仓成本</b>：长期持仓要不断移仓，费率与点差累积</li>
<li><b>逆势加仓的乘数效应</b>：股票逆势加仓亏"现货"，期货逆势加仓亏"杠杆×现货"=加速爆仓</li></ul>
<p><b>本App立场重申</b>：期货课是认知课，纯新手不建议期货实盘；真要接触也只从最低杠杆+最小仓位开始，并永远带着止损。</p>`,
tip:'训练场期货题的波动比股票题大很多——先在回放里习惯这种波动，你再看A股会觉得"慢"了许多。',
qs:[
 {t:'m',q:'期货新手的主要风险包括？（多选）',o:['杠杆爆仓','隔夜跳空','冷月合约流动性','逆势加仓加速亏损'],a:[0,1,2,3],e:'四条都是真实风险源，其中逆势加仓×杠杆是最快归零路径。'},
 {t:'j',q:'期货止损单在任何情况下都能保证按止损价精确成交。',a:false,e:'跳空/流动性差时可能滑点成交在更差价位——止损降低风险但不等于绝对保险。'},
 {t:'s',q:'本课程对期货实盘的建议是？',o:['尽早实盘练胆','纯新手不建议实盘；接触也只从最低杠杆最小仓位+必带止损开始','重仓做空致富','满仓做多周期股'],a:1,e:'期货是专业战场：认知先行、小仓试探、纪律保命。'}]},
{id:'qh10',t:'期货学习定位（本关总结）',c:`<p>学完期货10课，你应该带走三样东西：</p>

{id:'xb09',t:'加密风险清单：这一课最重要',c:`<p>加密世界的风险清单，每一条都有真实惨案：</p>

<p>本App的立场一以贯之：<b>认知先行，风险为界，不构成参与建议</b>。A股、期货、加密、基金——四个市场的规则你都懂了，才谈得上选择适合自己的战场。</p>`,

{ i:'l12', n:'第12关 · 基金入门', icon:'🏦', desc:'净值、ETF、定投：最适合新手的长钱工具', lessons:[
{id:'jj01',t:'基金是什么：凑钱请专业人士管理',c:`<p><b>基金</b>= 把很多投资者的钱凑在一起，交给专业的基金公司按约定规则投资（股票/债券/货币工具），赚亏按份额分摊。</p>
<ul><li><b>${termSpan('基金净值')}</b>（单位净值）= 每一份基金值多少钱：基金总资产÷总份额。你买1000元净值1元的基金=持有1000份</li>
<li>人话：股票是"自己开店"，基金是"入股别人的店"——专业但收管理费</li>
<li>涨跌逻辑：基金经理买股票涨 → 净值涨 → 你的份额更值钱</li></ul>`,
tip:'训练场选"基金"类别：净值走势是线形的（没有K线影线），趋势判断逻辑一样适用。',
qs:[
 {t:'s',q:'基金单位净值的含义是？',o:['每一份基金当前值多少钱','基金公司股价','管理费比例','银行利率'],a:0,e:'单位净值=基金总资产÷总份额，申购赎回都按它计算。'},
 {t:'j',q:'买1000元净值1.0的基金，获得1000份份额。',a:true,e:'份额=金额÷净值=1000份（不考虑费用时）。'},
 {t:'s',q:'基金与"自己炒股"最大的区别是？',o:['收益一定更高','资金委托专业管理、按份额分摊盈亏','没有风险','不需要任何费用'],a:1,e:'基金=委托管理：专业但也收管理费，且风险并未消失。'}]},
{id:'jj02',t:'基金分类全景：风险阶梯',c:`<p>按投资对象，公募基金从稳到激进排成一列阶梯：</p>
<ul><li><b>货币基金</b>（余额宝类）：投短期存款/票据，几乎不亏，收益低（活钱管家）</li>
<li><b>债券基金</b>：主要买债券，小波动小收益（利率上行也会亏）</li>
<li><b>混合基金</b>：股债搭配，比例灵活，风险中等</li>
<li><b>股票基金</b>：大部分仓位买股票，波动接近股市</li>
<li><b>指数基金</b>：机械跟踪某个指数（如沪深300），不靠经理主观判断</li></ul>
<p>选基金的第一个问题不是"哪个收益高"，而是"<b>这笔钱能承受多大波动</b>"——先定位阶梯位置，再挑产品。</p>`,
tip:'训练场"基金"类别里的净值波动差异，正好对应这个风险阶梯——拉几只不同类型基金对比看看。',
qs:[
 {t:'m',q:'按风险从低到高排列正确的是？',o:['货币<债券<混合<股票','股票<债券<货币<混合','混合<货币<股票<债券','债券<股票<货币<混合'],a:0,e:'货币→债券→混合→股票，风险与预期收益同向递增。'},
 {t:'j',q:'债券基金在任何情况下都不会亏损。',a:false,e:'利率上行或信用事件时债券基金同样亏损，只是波动小于股票基金。'},
 {t:'s',q:'选基金前应先回答的问题是？',o:['哪个涨得最快','这笔钱能承受多大波动','基金经理长啥样','手续费最低'],a:1,e:'风险承受度定位阶梯位置，是选基第一问。'}]},
{id:'jj03',t:'净值、份额与分红：账户数字的算法',c:`<p>基金账户的三个基本量：</p>
<ul><li><b>申购</b>：买入（份额=金额÷当日净值）；<b>赎回</b>：卖出（到账=份额×赎回日净值−费用）</li>
<li><b>单位净值</b>：每天收盘后更新一次（不像股票实时跳动）</li>
<li><b>分红</b>：基金把赚到的钱分给你一部分 → 单位净值相应下降（总资产没变，只是从"净值里"搬到"现金里"）；<b>累计净值</b>=单位净值+历史分红，用它看长期真实表现</li></ul>`,
tip:'看基金长期业绩要用"累计净值"或"复权净值"——单位净值会因为分红"看起来变便宜"，别被骗。',
qs:[
 {t:'s',q:'基金分红后，单位净值会？',o:['上涨','相应下降（总资产不变）','不变','清零'],a:1,e:'分红=把净值的一部分以现金发放，单位净值等额下降，总资产不变。'},
 {t:'j',q:'评估基金长期表现应看累计净值/复权净值，而非单位净值。',a:true,e:'单位净值受分红干扰，累计/复权才反映真实收益。'},
 {t:'m',q:'基金申购与赎回的正确理解是？（多选）',o:['申购按当日净值计份额','赎回到账=份额×赎回日净值−费用','按股票实时价成交','没有任何费用'],a:[0,1],e:'净值型申赎按未知价法（当日收盘净值），且存在相关费用。'}]},
{id:'jj04',t:'ETF与场内场外：像股票一样买卖的基金',c:`<p><b>ETF</b>（交易所交易基金）= 在股票账户里像买卖股票一样实时交易的基金：</p>
<ul><li><b>场外基金</b>：在基金平台申购赎回，按每日收盘净值成交，一天一个价</li>
<li><b>ETF（场内）</b>：盘中实时价格成交，有买卖点差；多数是<b>指数基金</b>（如沪深300ETF、证券ETF）</li>
<li><b>折溢价</b>：ETF市价 vs 基金净值的偏差——套利机制让它通常很小，但极端行情会放大</li>
<li>对训练场的意义：ETF有实时成交价，波动形态和股票接近；场外净值基金则是线形趋势（训练场"基金"类别）</li></ul>`,
tip:'第5关的板块轮动在ETF上看得最清楚：证券ETF、半导体ETF的涨跌就是板块情绪的直接温度计。',
qs:[
 {t:'s',q:'ETF与普通场外基金最大的交易差异是？',o:['ETF盘中实时交易，场外按每日净值','ETF没有风险','场外基金收益更高','ETF不需要账户'],a:0,e:'ETF场内实时成交；场外一日一价按净值申赎。'},
 {t:'j',q:'ETF市价可能偏离基金净值（折溢价），极端行情时偏差会放大。',a:true,e:'折溢价由供需与套利共同决定，极端时段可能明显偏离。'},
 {t:'m',q:'多数ETF属于？（多选）',o:['指数基金','场内交易','主观择股型','封闭十年'],a:[0,1],e:'主流ETF=场内交易的指数基金。'}]},
{id:'jj05',t:'费用：看不见的长期杀手',c:`<p>基金的费用藏在细节里，长期复利下杀伤力惊人：</p>
<ul><li><b>管理费</b>：每年从净值里扣（股票基金常见1.5%/年，指数基金0.5%甚至更低）</li>
<li><b>托管费</b>：银行保管资金的费用（约0.25%/年）</li>
<li><b>申购/赎回费</b>：买卖手续费；持有时间越长赎回费越低（鼓励长持）</li>
<li><b>销售服务费</b>：C类份额按天计提（适合短持）；A类申赎费模式（适合长持）</li>
<li>算笔账：1.5% vs 0.5%的年费差，30年复利下来差距是<b>本金的百分之几十</b>——第7关交易成本课的"基金版"</li></ul>`,
tip:'工具箱"交易成本计算器"教你算交易成本；基金的费用同理：长期持有者优先低费率的A类/指数基金。',
qs:[
 {t:'s',q:'长期持有（数年）基金，通常更划算的份额类别是？',o:['C类（销售服务费按天计）','A类（申赎费+低管理费）','没有区别','最贵的一定最好'],a:1,e:'A类一次性申赎费被长期摊薄；C类按天计提的费用长期累积更高。'},
 {t:'j',q:'每年1%的费率差异，在几十年复利下会显著侵蚀总资产。',a:true,e:'费用是确定性的负复利，时间越长杀伤越大。'},
 {t:'m',q:'基金的常见费用包括？（多选）',o:['管理费','托管费','申购赎回费','股息免税奖励'],a:[0,1,2],e:'三项都是常见费用；第四项不存在。'}]},
{id:'jj06',t:'基金经理与规模：人的因素',c:`<p>主动型基金的成败很大程度取决于<b>基金经理</b>与<b>规模</b>：</p>
<ul><li><b>规模是业绩的敌人</b>：钱太多，好机会装不下（小盘股买不动）、调仓变迟缓——"百亿魔咒"</li>
<li><b>明星经理陷阱</b>： past业绩不代表未来；规模随名气暴增后，能力圈往往跟不上</li>
<li>看基金经理三问：任职年限（≥一轮牛熊更可信）？管理规模变化？风格是否漂移（说好价值却追热门）？</li>
<li>对比指标：不只看收益，看<b>最大回撤</b>（第8关概念）与夏普比率（收益/波动比）</li></ul>`,
tip:'挑主动基金的简化流程：经理任职≥5年 → 回撤控制住过熊市 → 规模适中 → 风格稳定。四条全过再谈收益。',
qs:[
 {t:'s',q:'"规模是业绩的敌人"的主要原因之一是？',o:['规模大费率自动归零','钱太多导致好机会装不下、调仓迟缓','规模大会强制分红','规模与业绩无关'],a:1,e:'规模膨胀侵蚀灵活性，是主动基金业绩衰减的常见原因。'},
 {t:'j',q:'挑选主动基金时，经理过往一年暴涨的业绩比长期记录更重要。',a:false,e:'一年暴涨常是风格运气；经历完整牛熊的长期记录才更可信。'},
 {t:'m',q:'评估基金经理的合理维度包括？（多选）',o:['任职年限（经历牛熊）','最大回撤控制','风格是否漂移','颜值与直播频率'],a:[0,1,2],e:'业绩持续性、风控、风格稳定性是核心维度。'}]},
{id:'jj07',t:'指数基金与巴菲特赌局：新手的主力工具',c:`<p><b>${termSpan('指数基金')}</b>= 不靠经理主观选股，机械复制某个指数成分（如沪深300的300家公司）的基金。</p>
<ul><li>著名赌局：巴菲特十年赌约——标普500指数基金跑赢了多数对冲基金组合。结论：多数主动管理者长期跑不赢指数，费率是主因</li>
<li>对新手的意义：<b>不需要研究经理、费率低、风格永不漂移、必然拿到市场平均收益</b>——而市场平均收益已经超过多数频繁操作的散户</li>
<li>配合第8关认知：买指数基金=承认"我选不出α，但我确定性拿到β"，这是谦逊而高效的选择</li></ul>`,
tip:'训练场"基金"类别里的沪深300ETF净值走势≈沪深300指数——指数基金的趋势就是市场本身的趋势。',
qs:[
 {t:'s',q:'指数基金的核心特征是？',o:['机械跟踪指数成分，低费率','全靠经理主观判断','保证跑赢所有基金','只投资海外'],a:0,e:'被动复制指数：费率低、风格不漂移、拿到市场平均。'},
 {t:'j',q:'巴菲特十年赌局的结论之一是多数主动管理者长期未能跑赢低费率指数基金。',a:true,e:'赌局结果支持指数化投资对多数人的优越性。'},
 {t:'s',q:'指数基金对新手最大的意义是？',o:['确定性获得市场平均收益且省心','必然暴涨','没有波动','可以短线暴富'],a:0,e:'β收益的确定性+低费率+省心，是新手长钱的合理起点。'}]},
{id:'jj08',t:'定投：把择时难题交给纪律',c:`<p><b>${termSpan('定投')}</b>= 固定时间、固定金额买入同一基金（如每月发薪日买2000元）：</p>
<ul><li>原理：<b>摊平成本</b>——高位自动买得少（同样的钱买份额少），低位自动买得多，长期成本趋近均价</li>
<li><b>微笑曲线</b>：下跌过程坚持定投，成本不断降低，反弹时利润集中在低价筹码——前提是<b>标的长期不死</b>（宽基指数合格，个别股票/山寨币不合格）</li>
<li>适合的钱：<b>长期用不到的钱</b>（3-5年+）；不适合：下月要用的钱、借来的钱</li>
<li>纪律价值：定投本质是"用规则对抗择时冲动"——和你学过的交易计划同源</li></ul>`,
tip:'定投+指数基金+长期持有=新手长钱配置的"默认三件套"。它不刺激，但它是数学上站得住的策略。',
qs:[
 {t:'s',q:'定投摊低成本的前提是？',o:['标的长期不死','每次金额递增','只在牛市定投','每天手动操作'],a:0,e:'微笑曲线成立的前提：长期存活并最终回升的标的（宽基指数合格）。'},
 {t:'j',q:'定投的本质是用固定规则对抗择时冲动。',a:true,e:'固定时间金额机械化执行，与交易计划同源。'},
 {t:'m',q:'适合定投的钱包括？（多选）',o:['3-5年用不到的长期资金','工资结余的固定比例','下个月要交的房租','借来的钱'],a:[0,1],e:'长钱才经得起波动周期；短钱和杠杆钱会破坏纪律。'}]},
{id:'jj09',t:'最大回撤与持有体验：拿得住才算数',c:`<p><b>${termSpan('最大回撤')}</b>= 净值从最高点跌到最低点的最大幅度。它是选基金时比收益更重要的指标：</p>
<ul><li>收益50%但回撤60%的基金：多数持有人在深跌中割肉，<b>收益是纸面的，亏损是真实的</b></li>
<li>回撤30%的基金：多数人拿得住，收益才能落进账户——<b>拿得住的收益才叫收益</b></li>
<li>第8关讲过：回撤是复利的坟墓（亏50%需涨100%回本）。基金的回撤=你的持有体验=你能不能坚持</li>
<li>自查方法：看历史净值曲线，想象自己在最深谷那天——会加仓、持有还是清仓？诚实的答案决定这只基金适不适合你</li></ul>`,
tip:'训练场"基金"类别里挑几只净值基金对比历史深谷——先用回放练习"持有体验"，再谈真钱。',
qs:[
 {t:'s',q:'基金最大回撤指标主要衡量？',o:['最高收益','净值从峰到谷的最大跌幅（持有体验）','管理费高低','经理年龄'],a:1,e:'最大回撤=最深亏损幅度，直接对应持有人能否拿得住。'},
 {t:'j',q:'一只收益50%但曾回撤60%的基金，多数持有人实际能赚到50%。',a:false,e:'深回撤中大量持有人割肉离场，纸面收益与持有人实际收益严重脱节。'},
 {t:'m',q:'评估"这只基金我拿得住"的方法包括？（多选）',o:['看历史最大回撤','想象深谷当天的自己会怎么做','只看最近一周涨幅','对比同类回撤水平'],a:[0,1,3],e:'回撤维度+心理预演+同类对比；短期涨幅与持有体验无关。'}]},
{id:'jj10',t:'基金学习定位（本关总结）',c:`<p>第12关总结——基金在四个市场中的定位：</p>
<ul><li><b>它是"委托工具"</b>：把选股/择时交给规则（指数）或专业人士（主动），代价是费用</li>
<li><b>它是"纪律容器"</b>：定投+指数+长持，把第8关的纪律体系变成自动执行</li>
<li><b>它是新手长钱的默认起点</b>：宽基指数定投是数学上最站得住的配置；主动基金是进阶选修</li>
<li><b>四市场全景</b>：股票（自己决策）/期货（杠杆对冲工具）/加密（高风险新兴资产）/基金（委托长钱）——风险收益特征完全不同，<b>先认清再配置，永远把"拿得住"放在"收益高"前面</b></li></ul>
<p>第12关学完闯关考试！至此12关全部完成——你的认知版图覆盖了A股、期货、加密、基金四大市场。</p>`,
